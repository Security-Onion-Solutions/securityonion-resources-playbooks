name: Webshell Tool Reconnaissance Activity
id: fe9297c2-ea29-4e44-8741-5a76bcb2b016
description: |
  Detects a web-server process spawning a child whose command line probes for the presence of scripting and
  transfer tools — 'perl --help', 'perl -h', 'python --help', 'python -h', 'python3 --help', 'python3 -h', or
  'wget --help'. The rule fires when that probe runs AND the parent matches at least one web-server pattern:
  either the parent binary is one of caddy.exe, httpd.exe, nginx.exe, php-cgi.exe, w3wp.exe, or
  ws_tomcatservice.exe; or the parent is java.exe/javaw.exe running from a path that carries a Tomcat marker;
  or the parent is java.exe/javaw.exe and the child's own command line carries CATALINA_HOME or catalina.jar.
  The parent-child lineage is the signal: a web-server worker process has no operational reason to launch
  tool-availability probes, and this burst of probes is typically the first thing run after code execution is
  obtained through a server-side script placed in the web tree. The investigation should establish which web
  application the parent serves, which script file on disk handled the request, what else that same parent
  process spawned, and whether file transfer or outbound connections followed.
type: detection
detection_id: f64e5c19-879c-4bae-b471-6d84c8339677
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting event show a tool-availability probe spawned by either a named web-server binary, a
    Tomcat-marked Java parent, or a Java parent with CATALINA_HOME or catalina.jar in the command line?
  context: >-
    Confirm the CommandLine carries one of the probe strings the rule matches, then note which parent branch
    fired, because the branch drives the rest of the investigation. Branch one is ParentImage ending in
    caddy.exe, httpd.exe, nginx.exe, php-cgi.exe, w3wp.exe, or ws_tomcatservice.exe — the web application is
    identified directly by the binary and its worker configuration. Branch two is a java.exe/javaw.exe parent
    whose path contains a Tomcat marker, and branch three is a java.exe/javaw.exe parent where the child's own
    command line carries CATALINA_HOME or catalina.jar — both point at a servlet container, so the script file
    to look for lives under the deployed webapps tree rather than an IIS or PHP document root.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host a web server, and is the account running the probe the expected identity for that role?
  context: >-
    A host whose function is to serve web content will run these web-server binaries continuously, so the
    parent process alone is not unusual. What is unusual is that parent launching interpreter probes. Establish
    the host's role from asset records and confirm whether the account in the alert is the application pool or
    service identity the web server normally runs under; that identity is what an operator inherits when a
    server-side script executes a command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this web-server process expected to spawn a command interpreter, and what started the web server itself?
  context: >-
    A web-server worker process spawning a child at all is the core signal here — request handling normally
    stays inside the worker. Retrieving the parent's own process_creation event gives the full parent command
    line, which names the application pool, site, or servlet container instance, and the grandparent, which
    should be the service control manager or a container runtime. A parent started from something other than
    normal service startup changes the question from web-shell execution to something further upstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same web-server process instance spawn?
  context: >-
    Tool-availability probes are rarely the whole session. Listing every child of the exact parent instance
    shows whether the probes sit inside a longer command sequence — directory listings, account enumeration,
    archive creation, transfer utilities — all executing through the same server-side script. Several unrelated
    children from one web-server process instance in a short window points to interactive operator use rather
    than an application feature.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What web request triggered this execution, and which script file handled it?
  context: >-
    Command execution under a web-server parent arrives over HTTP. The parent command line identifies the
    application pool, site, or webapp context, which narrows the access log to search and the directory tree to
    review. Look in the server's own access logs for a request in the same second as the process creation, and
    record its URI, method, source address, and user agent — the URI usually names the script file that is the
    artifact to find on disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is the web server or application framework running under this parent up to date with security patches?
  context: >-
    Code execution through a web tree usually starts with either an upload path that accepts a server-side
    script or a deserialization or path-traversal flaw in the framework. Identify the exact version behind the
    parent binary — the IIS application pool's .NET or module set for w3wp.exe, the PHP build for php-cgi.exe,
    the Tomcat and JDK versions for the Java branches — and check it against known remote code execution
    advisories. An unpatched version gives the likely entry path and identifies which other servers share it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Did this same detection fire on other servers in the environment?
  context: >-
    Internet-facing servers running the same software are reachable by the same request. If this detection has
    fired on more than one host, the entry path is a property of the platform rather than of one machine, and
    every host running that platform needs its web tree reviewed. A single host points to a host-specific
    exposure or an upload accepted by one application.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: Which tool-availability probes ran on this host in the alert window, and what do they together indicate the operator was looking for?
  context: >-
    The rule fires on a single probe, but operators normally run several in sequence to learn what is installed
    before choosing a payload. Scoping to the probe strings themselves rather than to a binary name keeps the
    result to the pattern of interest, since the rule constrains the command line and not the child image.
    Reading the whole set shows the direction of travel — perl and python probes suggest a scripted stage next,
    a wget probe suggests the operator intends to pull tooling in from outside. Note the CurrentDirectory: it
    frequently resolves to the web root or the server's working directory and points at the script's location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_recon:
        CommandLine|contains:
          - 'perl --help'
          - 'perl -h'
          - 'python --help'
          - 'python -h'
          - 'python3 --help'
          - 'python3 -h'
          - 'wget --help'
      condition: selection_host and selection_recon
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: Is the alerting command line encoded or obfuscated, and what does the decoded content run?
  context: >-
    Server-side scripts commonly pass their command through a layer of encoding so the request itself does not
    carry readable text — base64 in a POST parameter that the script hands to an interpreter, hex, URL-encoding,
    character concatenation, or several of these stacked. The probe string that matched the rule may therefore
    be only the visible fragment of a longer command. Decode any encoded segment of the command line, iterating
    until the content is readable, and identify the operation it performs; also decode the suspicious parameter
    values from the originating request if the access log entry is available.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files has this web-server process instance written, and is any of them a server-side script placed outside a normal deployment?
  context: >-
    The script file in the web tree is the artifact that makes this repeatable, and the web-server process that
    accepted the upload is usually the process that wrote it. Anchoring on the alerting parent's process
    identity returns exactly that process instance's file writes rather than the whole host's file activity.
    Look for .aspx, .asmx, .ashx, .php, .jsp, or .jspx files, and for archives or text files under the document
    root — typical roots are \inetpub\wwwroot\, \Program Files\Apache*\htdocs\, \webapps\, and any custom root
    configured for the site, so confirm the real root from the server configuration before ruling a path out.
    File writes carry no hash, so treat the path as the pivot and look for later execution of it.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: Did this web-server process instance make outbound connections around the time of the probes?
  context: >-
    A wget or python probe is normally a check made immediately before pulling something in. Outbound
    connections initiated by the web-server process itself are the counterpart to that check — a server that
    accepts inbound requests should rarely originate egress beyond its own backend dependencies. Compare any
    destinations against the application's known database, cache, and API endpoints; an address outside that set
    around the probe window indicates tooling being retrieved or a channel being established.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
  answer_sources:
  - network_connection
- question: Did the web server's account authenticate or present explicit credentials around the time of the probes?
  context: >-
    Command execution inside a web-server worker runs as the application pool or service identity. If that
    identity begins producing logon events or explicit-credential use in the same window, the operator has moved
    from running commands to using the account, which is the step that turns a foothold on one server into reach
    across others. Event 4648 records explicit credential use with the target account and target server named;
    4624 records the logons that landed. If the Security channel is not collected from this host, treat an empty
    result as a visibility gap rather than as evidence the account was not used.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
      selection_host:
        host.name|expand: '%hostname%'
      condition: selection and selection_host
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
      - ProcessName
  answer_sources:
  - active_directory
  - manual_review
- question: Has this account previously produced this web-server-spawned probe pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is the account's
    90-day history of this exact pattern — a web-server parent spawning a tool-availability probe — aggregated
    by host, not generic use of an interpreter. An application pool or service identity that has never produced
    this pattern before is the case worth chasing. A non-zero count means some deployment or health-check
    routine already runs probes through the web server, and the alerting event should be compared against that
    routine's timing and command lines.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_webserver_image:
        ParentImage|endswith:
        - \caddy.exe
        - \httpd.exe
        - \nginx.exe
        - \php-cgi.exe
        - \w3wp.exe
        - \ws_tomcatservice.exe
      selection_webserver_characteristics_tomcat1:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        ParentImage|contains:
        - -tomcat-
        - \tomcat
      selection_webserver_characteristics_tomcat2:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        CommandLine|contains:
        - CATALINA_HOME
        - catalina.jar
      selection_recon:
        CommandLine|contains:
        - perl --help
        - perl -h
        - python --help
        - python -h
        - python3 --help
        - python3 -h
        - wget --help
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_webserver_* and selection_recon) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this web-server parent historically driven this probe pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    Web servers run as service identities, so the account in the alert attributes almost nothing — every request
    handled by the pool carries it. The launch mechanism is the meaningful pivot. This query mirrors the rule's
    selection structure scoped to the alerting parent process, giving the 90-day history of this parent binary
    driving this specific pattern, aggregated by host. A parent that already accounts for a large volume of
    prior events is a deployment or monitoring routine; a parent with no history for this pattern is the
    deviation to chase.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_webserver_image:
        ParentImage|endswith:
        - \caddy.exe
        - \httpd.exe
        - \nginx.exe
        - \php-cgi.exe
        - \w3wp.exe
        - \ws_tomcatservice.exe
      selection_webserver_characteristics_tomcat1:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        ParentImage|contains:
        - -tomcat-
        - \tomcat
      selection_webserver_characteristics_tomcat2:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        CommandLine|contains:
        - CATALINA_HOME
        - catalina.jar
      selection_recon:
        CommandLine|contains:
        - perl --help
        - perl -h
        - python --help
        - python -h
        - python3 --help
        - python3 -h
        - wget --help
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_webserver_* and selection_recon) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around this time?
  context: >-
    Tracking the alerting account's activity across all hosts shows whether the identity is being used beyond
    the one server. Web-server service identities are frequently machine or built-in accounts, in which case
    this returns routine service and agent activity from every host they exist on and the parent-scoped
    fleet-wide question carries the answer instead. Where the pool runs under a domain account, activity on a
    host that is not a web server is the finding.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven probe pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service identity, asking what else the account did across the environment returns routine service
    activity. The question that keeps its meaning is whether the same launch mechanism fired elsewhere: this
    query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in the alert
    window. Several web servers producing the pattern at once points at a request sprayed across every host
    running the same software, which changes the response from one host to the whole platform. A single host
    points at a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_webserver_image:
        ParentImage|endswith:
        - \caddy.exe
        - \httpd.exe
        - \nginx.exe
        - \php-cgi.exe
        - \w3wp.exe
        - \ws_tomcatservice.exe
      selection_webserver_characteristics_tomcat1:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        ParentImage|contains:
        - -tomcat-
        - \tomcat
      selection_webserver_characteristics_tomcat2:
        ParentImage|endswith:
        - \java.exe
        - \javaw.exe
        CommandLine|contains:
        - CATALINA_HOME
        - catalina.jar
      selection_recon:
        CommandLine|contains:
        - perl --help
        - perl -h
        - python --help
        - python -h
        - python3 --help
        - python3 -h
        - wget --help
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_webserver_* and selection_recon) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pair on the host in the alert window collapses steady service and agent
    activity into a few high-count rows while novel pairs stand out at the bottom with counts of one or two.
    On a web server the expected inventory is narrow, so any interpreter, archive utility, or account-management
    binary appearing under an unusual parent is visible immediately, and reveals whether the probes were an
    isolated step or part of a longer sequence on the box.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Probing for interpreters happens after code execution is already available, so earlier detections on the
    same server often carry the entry step — an exploitation attempt against the framework, an unexpected write
    into the web tree, or another child spawned by the same worker. Reading the detections in order reconstructs
    how long the access has existed, which sets how far back the file and access-log review needs to reach.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
