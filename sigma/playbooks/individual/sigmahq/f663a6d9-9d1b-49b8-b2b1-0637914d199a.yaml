name: Narrator's Feedback-Hub Persistence
id: 6c1c65cf-c8dc-4518-be1d-9a465f593c62
description: |
  Detects a registry modification under the AppX package key that registers the Feedback Hub protocol handler — the URI
  the Windows Narrator "Provide Narrator feedback" function invokes. The rule fires when EITHER the DelegateExecute value
  under that package's \Shell\open\command key is modified OR the same key's (Default) value is written. Both values
  control what the shell runs when the handler URI is triggered: DelegateExecute names the COM handler that normally
  services the URI, and (Default) holds the fallback command string used when no delegate is registered, so clearing the
  delegate and writing a command into (Default) repoints the handler at an attacker-chosen payload with no file dropped
  and no binary replaced. Narrator is reachable from the logon screen, which is why this registration is a persistence and
  privilege path rather than a configuration detail; it is not modified by ordinary software or user activity. The
  investigation should determine which value changed, what command string the key now holds, which process wrote it and
  what launched that process, whether the configured command subsequently ran, and whether other persistence was staged
  in the same session.
type: detection
detection_id: f663a6d9-9d1b-49b8-b2b1-0637914d199a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting registry path end in the Feedback Hub handler's command key, and was it the DelegateExecute value or the (Default) value?
  context: >-
    The rule matches either a modification of the DelegateExecute value under the package's \Shell\open\command key or a
    write to that same key's (Default) value; note which branch fired, because the two do different work. Removing or
    blanking DelegateExecute makes the shell fall back to the (Default) command string, and the (Default) write supplies
    the string that then runs — so a fire on one branch makes the other value in the same key the first thing to read.
    Review the exact TargetObject and the writing process on the triggering event. The signer columns are context, not a
    verdict; the judgment is whether that vendor plausibly owns an accessibility protocol-handler registration, which for
    a script host or interactive shell it does not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - EventType
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to reconfigure the Feedback Hub protocol handler?
  context: >-
    This registration is written by the OS when the package is installed or serviced and is otherwise static, so there is
    rarely a routine explanation for a change to it. Establish whether the account has an administrative role and whether
    the host was undergoing sanctioned maintenance. User attribution is present on roughly 94% of endpoint registry
    events; when it resolves to a machine account, SYSTEM, or is missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was this registry change part of a documented deployment, servicing operation, or maintenance window?
  context: >-
    Package servicing and imaging can rewrite protocol-handler registrations, and those operations normally have a
    corresponding record. A ticket or maintenance window that covers this host and time is the fastest way to close the
    alert; the absence of one where policy requires it moves the change into unauthorized territory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall performing an action that would rewrite this handler registration?
  context: >-
    Direct confirmation from the account holder is often the quickest way to settle legitimacy. If the change ran under a
    service or machine account, ask the team that owns that service or the imaging platform instead. If nobody recalls
    it, treat the account or the host as the next thing to examine and ask what the session was doing at that time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What launched the process that wrote to the Feedback Hub handler key?
  context: >-
    The process that performed the registry write is named in the alert, but its lineage is not. Looking that process up
    by its own identifier returns the parent that started it, which is what separates a servicing or installer chain from
    an interactive shell, script host, or remote-execution parent. A registry editor or interpreter parented by a
    document application or a remote shell is a different investigation from the same binary parented by a package
    servicing host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the writing process spawn?
  context: >-
    A process that repoints a protocol handler rarely stops there. Listing the children it launched shows whether the
    change was an isolated edit or one step in a longer chain — payload staging, additional persistence, or follow-on
    tooling. This shows what the acting process started, not what started alongside it, because registry events do not
    record the acting process's own parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which value under the Feedback Hub handler's command key was modified, and what does that location control?
  context: >-
    The registry path reveals intent. The \Shell\open\command subkey of a package's protocol-handler registration decides
    what the shell executes when the URI is opened - DelegateExecute names the COM handler that normally services it, and
    (Default) carries the fallback command line. Because the Narrator feedback option reaches this handler from the logon
    screen, a command written here runs without an interactive session and without replacing any accessibility binary on
    disk. Read the signer columns for coherence with the key rather than as a verdict; a trusted Microsoft-signed
    interpreter writing this value is exactly the pattern the technique produces.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command string does the handler's command key now hold, and did both the DelegateExecute and (Default) values change?
  context: >-
    The full technique clears the delegate and writes a command into (Default), so reading every value under the command
    key in the surrounding window shows whether one branch or both were performed and what the handler would now run.
    Read the value data for interpreter invocations, encoded arguments, paths under Temp, AppData, ProgramData, or public
    directories, and script or DLL references. Value data is populated on roughly 79% of endpoint registry modifications
    and is absent for binary or empty data; if it is missing, read the key directly on the host to see what the value now
    contains. Any executable or script path found here becomes the artifact for the rest of the investigation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: \AppXypsaf9f1qserqevf0sws76dx4k9a5206\Shell\open\command\
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did a command interpreter or script host run on this host after the handler key was rewritten?
  context: >-
    The configured command executes only when the handler URI is triggered, which for this handler happens when the
    Narrator feedback option is used — potentially from the logon screen and potentially long after the registry write.
    Execution therefore confirms the persistence is live. Compare what ran against the value data read from the key, and
    look at the parent of any match; a payload launched through this path is parented by a shell or broker process rather
    than by the process that made the registry change. Interpreters are common on most hosts, so use the value data as
    the discriminator rather than the presence of a match alone.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_payload:
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
      condition: selection and selection_payload
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did the process that rewrote the handler key, or its children, write any files to disk?
  context: >-
    This technique is designed to need no file on disk — the command string in the registry is the whole payload — so an
    absence of file writes here does not weaken the finding. What the answer does establish is whether a script, DLL, or
    executable was staged alongside the registry change for the command string to call. If a path found in the value data
    appears here, that file is the payload; file-write events carry no hash, so obtain one from a later execution of that
    path or retrieve the file for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were other registry modifications made on this host in the same session?
  context: >-
    An actor who repoints one handler often makes several changes together — additional autostart entries, security
    settings, or other protocol handlers. Grouping every registry modification on the host in the surrounding window by
    key path and writing process shows what else changed. The alerting key will appear in the results; the signal is what
    accompanies it. If the host is registry-noisy, narrow to the writing process from the alert or to autostart, service,
    policy, and Winlogon paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this value under the Feedback Hub handler key ever been modified before on this host?
  context: >-
    This registration is written when the package is installed or serviced and is static in between, so the expected
    history is empty or a small number of events clustered around servicing dates. A change appearing outside that
    pattern, or a first-ever modification, is the calibrating fact. Because value deletions are not recorded in this
    telemetry, judge the state of the key from the sequence of writes present here plus a direct read of the key on the
    host, not from an absence of events.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that made this change?
  context: >-
    A writing process that has never been seen on this host is a different finding from one that runs daily. Zero or very
    low historical counts point to first-time or rare execution; a long history under the same account suggests a routine
    tool being used for a non-routine purpose, in which case the parent lineage carries the judgment instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process starts on the host by executable and parent collapses routine repetition into high-count rows and
    leaves novel parent-child pairs standing out at low counts. That is where reconnaissance, credential access, or the
    delivery step that preceded the registry change tends to be visible.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this handler key modified on any other host in the environment?
  context: >-
    The same modification across multiple hosts points to a deployment mechanism or to activity repeated by hand; a
    single host points to a targeted change. Compare the value data across hosts — identical data on many hosts is
    consistent with a push, while differing command strings on a few hosts is consistent with per-host staging.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    A handler repoint is one foothold, and actors commonly stack a second mechanism using a different technique —
    scheduled tasks, services, autostart values, BITS jobs, or WMI subscriptions. Several persistence installations
    inside the same window point to intentional stacking rather than an isolated administrative action, and each one
    found is separate remediation work.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as Startup folders or scheduled-task definitions on this host?
  context: >-
    File-based persistence leaves no command-line trace. Writing an executable or script into a Startup folder, or a
    task XML directly under the task store, achieves persistence without running any of the usual persistence tools.
    Since the registry technique detected here is itself designed to avoid dropping files, a file-based mechanism in the
    same window indicates a second, independent foothold.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is usually installed after access is obtained, so earlier detections on the same host often name the
    delivery or execution step that led here. Read the preceding alerts as a timeline — defense tampering before
    execution, reconnaissance before escalation — and use them to decide how far back the investigation needs to reach.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
