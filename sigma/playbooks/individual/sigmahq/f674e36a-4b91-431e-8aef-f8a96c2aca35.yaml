name: CurrentControlSet Autorun Keys Modification
id: ecdfb429-fd05-4dae-9a26-7b9bb0294868
description: |
  Detects modification of autostart extensibility point (ASEP) values under HKLM\SYSTEM\CurrentControlSet\Control, including
  Terminal Server RDP InitialProgram/StartupPrograms, LSA Authentication and Notification Packages, SecurityProviders,
  SafeBoot\AlternateShell, Print Providers/Monitors, NetworkProvider\Order, and BootVerificationProgram\ImagePath. The rule
  fires when the target path is under \SYSTEM\CurrentControlSet\Control AND matches one of these monitored autostart keys AND
  the value data is non-empty AND the writing process is not one of the known print-driver/servicing exclusions (spoolsv,
  poqexec). Legitimate software and driver installs configure some of these keys, but many of them cause core system processes
  (LSASS, spoolsv, Session Manager, the RDP stack) to load an attacker-supplied DLL or run an attacker-supplied program at boot
  or logon, frequently as SYSTEM, giving both persistence and in some cases credential access. Investigation should confirm the
  exact key and value, decode the referenced module or program, attribute the writing process and its parent, and determine
  whether the referenced payload landed on disk or executed.
type: detection
detection_id: f674e36a-4b91-431e-8aef-f8a96c2aca35
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the registry key path and value data match a monitored CurrentControlSet autostart key modification?
  context: Confirm the alert is a true positive before investing time. The rule requires the target path to be under
    \SYSTEM\CurrentControlSet\Control AND to match one of the monitored autostart keys (RDP InitialProgram/StartupPrograms,
    LSA Authentication/Notification Packages, SecurityProviders, SafeBoot\AlternateShell, Print Providers/Monitors,
    NetworkProvider\Order, BootVerificationProgram\ImagePath) AND to carry non-empty value data, with the known print-driver and
    servicing writers (spoolsv, poqexec) excluded. Review the exact TargetObject and value data against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify system-level autostart or security-provider registry keys?
  context: Legitimate driver installs, servicing operations, and administrative configuration do modify some of these keys, so
    knowing whether the writing account and the host role fit the change is often the fastest triage step. These are
    machine-wide (HKLM) keys, so the writer is frequently SYSTEM or a machine account rather than an interactive user; when the
    User field is a machine account or missing, pivot on the writing process (Image) to judge legitimacy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which autostart key class was modified, and what execution does control of that key grant?
  context: The specific path determines the impact. LSA Authentication/Notification Packages and SecurityProviders load DLLs into
    LSASS at boot and can also enable credential capture. SafeBoot\AlternateShell sets the program launched in Safe Mode.
    Print Providers/Monitors load DLLs into the spooler service (spoolsv). RDP InitialProgram/StartupPrograms run a program on
    session start. BootVerificationProgram\ImagePath replaces the default boot-verification program. Identify which class fired and
    what the value data configures, since control of most of these grants SYSTEM-level code execution at boot or logon.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What module or program was written to this autostart value, and what does it point to?
  context: The value data (Details) names the DLL, executable, or program list that will load or run at boot or logon. Resolve it to
    a concrete file path and assess the location and name -- system directories versus user-writable paths (Temp, AppData,
    ProgramData), a signed system module versus an unfamiliar or randomly named DLL, or an added entry appended to an existing
    provider list. If the value resolves to an executable or DLL path, that path becomes the artifact to track on disk and at
    execution. Value data is absent for binary or empty registry writes, so treat a missing Details as a gap rather than a benign value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does this autostart value stay in place, or was it later re-modified or reverted?
  context: A persistence entry that stays set is more concerning than a transient change that an installer immediately corrects.
    Registry key and value deletions are not observable in endpoint telemetry, so attacker cleanup of the key cannot be seen
    directly. Judge persistence from the key's re-modification history over the window instead -- whether the same value keeps
    being reasserted, was overwritten with a different payload, or was restored to its prior contents.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the referenced executable or DLL present on disk, and did the writing process or its children drop it?
  context: An autostart entry is only effective if the module or program it names actually exists at the referenced path. Correlate
    file activity by the registry-writing process and its children, since the payload commonly lands in the same session as the
    registry write. The file-write event carries no hash; if the payload is present, hash it from a later execution or retrieve it
    for a reputation lookup. Reboot persistence itself is a judgment call -- weigh the value data together with the key's
    re-modification history.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this key was set, did a new or unusual process execute that traces back to the configured payload?
  context: >-
    These autostart keys generally activate the payload at the next boot or logon, when a system
    process (LSASS, spoolsv, Session Manager, or the RDP session host) loads the referenced DLL
    or runs the referenced program. The query anchors on the value data written to the key,
    returning executions whose command line carries the configured payload -- meaningful where
    the value names a standalone program (SafeBoot\AlternateShell, BootVerificationProgram, RDP
    InitialProgram). For the DLL-based classes (LSA packages, SecurityProviders, print monitors,
    NetworkProvider) the payload loads inside an existing system process rather than starting
    one, so a zero here is expected -- the value-decode and payload-on-disk questions carry that
    case. Execution may also not occur until the machine restarts; treat absence within the
    window accordingly.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this autostart key been modified before on this host?
  context: These CurrentControlSet\Control keys should change rarely -- typically only during driver installs, servicing, or
    deliberate configuration. A first-time or very infrequent modification is more suspicious than a value that is reset on a
    regular cadence. Compare historical Details values to see whether the same value is routinely written or whether this
    modification is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What process wrote this key, and what launched that writing process?
  context: The writing process and its parent chain reveal how the modification came to be. A driver install or servicing action
    has a predictable lineage (an installer or the servicing stack under services.exe), whereas a script host, Office
    application, or a shell spawned from an unexpected parent points to hands-on or automated abuse. Trace the writing
    process's own origin to judge whether the chain is legitimate. If the parent identifier is unavailable on the registry
    event, fall back to the writing process (Image) and a host-plus-time pivot.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other registry modifications were made on this host in the same window?
  context: Actors who alter one autostart key often alter several -- stacking an LSA package alongside a Run key, disabling a
    protection, or adjusting a provider order in the same session. All registry modifications on the host in the surrounding
    window, grouped by key path and writing process, reveal whether this change stood alone or arrived with other configuration
    changes. If the host is registry-noisy, narrow to the writing process from the alert or to security-relevant hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other process-based persistence mechanisms installed on this host in the same timeframe?
  context: Attackers rarely rely on a single foothold. Alongside an autostart-key modification, they commonly install backup
    persistence with different tooling -- scheduled tasks, services, additional registry Run keys, or BITS jobs. Persistence-tool
    executions clustered in the same window point to intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folder or Run key persistence locations on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder
    or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc, or reg. File event monitoring
    captures these drops even when standard persistence tooling is avoided, adding a parallel persistence angle to the autostart
    key change.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was this same autostart key modified on other hosts in the environment?
  context: The same modification across multiple hosts may indicate a group-policy push, widely deployed software, or spreading
    activity. A change confined to this one host may be targeted. Compare the Details values across hosts to see whether the
    same value is being set everywhere or whether this host received something distinct.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the modification?
  context: Alerts rarely occur in isolation. Process activity in the window around the registry write reveals what led up to it and
    what followed -- reconnaissance, privilege escalation, or the tooling that performed the change. Aggregating by process and
    parent collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the attack
    stages that preceded the autostart-key change and help reconstruct the timeline. Persistence is commonly established after an
    initial foothold and some hands-on activity, so prior alerts add valuable context.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: Some organizations require change records for system-level configuration, including persistence-relevant registry
    changes. A corresponding ticket or a documented driver deployment suggests authorized activity; the absence of one where
    policy requires it suggests the change was unauthorized. This check can quickly close a false positive or escalate a true
    positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
