name: Script Event Consumer Spawning Process
id: ee588335-6454-42b5-902d-2b887d5ded2d
description: |
  Detects scrcons.exe (the WMI Standard Event Consumer scripting host that runs registered ActiveScriptEventConsumer code) spawning a child process whose Image ends in one of svchost.exe, dllhost.exe, powershell.exe, pwsh.exe, wscript.exe, cscript.exe, schtasks.exe, regsvr32.exe, mshta.exe, rundll32.exe, msiexec.exe, or msbuild.exe. Legitimate ActiveScriptEventConsumer instances rarely contain script code that creates processes, so a scrcons.exe child is a low-volume, high-signal event: it usually means a WMI event subscription has been registered to host attacker script code that calls CreateProcess. scrcons.exe runs as NT AUTHORITY\SYSTEM by default, so any spawned child inherits SYSTEM. Investigation should confirm which child binary spawned, decode what the child did, trace the WMI subscription that hosts the script, and check whether the activity correlates with credential access, remote connections, or additional persistence.
type: detection
detection_id: f6d1dd2f-b8ce-40ca-bc23-062efb686b34
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Is the parent process scrcons.exe and is the spawned child one of the binaries this rule flags?
  context: >-
    Confirm the alert before investing time. The rule fires when scrcons.exe is the parent and the child Image ends in one of svchost.exe, dllhost.exe, powershell.exe, pwsh.exe, wscript.exe, cscript.exe, schtasks.exe, regsvr32.exe, mshta.exe, rundll32.exe, msiexec.exe, or msbuild.exe. Note which child binary spawned, because it drives the rest of the investigation. A scripting or interpreter child (powershell.exe, wscript.exe, cscript.exe, mshta.exe) usually carries its payload on the command line; a proxy or surrogate child (dllhost.exe, rundll32.exe, regsvr32.exe, msiexec.exe) often runs with no or minimal arguments and does its work in a loaded DLL, so a blank command line is itself meaningful here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this host expected to run ActiveScriptEventConsumer code that spawns processes?
  context: >-
    scrcons.exe spawning a child process is rare on normal systems. Some management, monitoring, or backup products do register WMI event subscriptions, so a small set of hosts may have a legitimate baseline. Determine whether this host runs software known to use WMI event consumers and whether the spawned child fits that software, versus a host where no such tooling is deployed and any scrcons.exe child is unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What spawned scrcons.exe, and is its own launch chain the canonical one?
  context: >-
    scrcons.exe is normally launched on demand by the DCOM/WMI service host with the canonical command line ending in -Embedding, and its expected parent is svchost.exe running the DcomLaunch group. Trace the parent of scrcons.exe to confirm it was started by the WMI infrastructure as a response to a registered event subscription rather than by an anomalous chain. The subscription that triggered it is what hosts the script code that then created the alerting child.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What did the spawned child process actually do? Decode its full command line and arguments.
  context: >-
    The child process is the payload the WMI consumer script chose to run. Read its full command line to determine intent. For interpreter children (powershell.exe, pwsh.exe, wscript.exe, cscript.exe, mshta.exe), decode any -EncodedCommand, script path, or inline script and any download or in-memory execution. For proxy children (dllhost.exe, rundll32.exe, regsvr32.exe, msiexec.exe, msbuild.exe), an absent or minimal command line is itself the signal; a canonical dllhost.exe normally carries a /Processid argument, so a bare dllhost.exe under scrcons.exe points to a surrogate hosting a loaded module. Identify the DLL, CLSID, or task being driven and what action it performs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\scrcons.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: If the child was PowerShell, was the command encoded or obfuscated, and what does it decode to?
  context: >-
    When the spawned child is powershell.exe or pwsh.exe, attackers frequently pass an -EncodedCommand (-enc) base64 payload or obfuscate with concatenation and backtick escaping to hide intent. Decoding reveals the actual operation, which under a WMI consumer is often a download cradle, an in-memory .NET assembly load, or reconnaissance. If the alerting child is not PowerShell, this query returns the triggering event only and the encoding question does not apply.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What WMI ActiveScriptEventConsumer or event subscription registration occurred on this host before the alert?
  context: >-
    scrcons.exe runs the script code stored in a registered ActiveScriptEventConsumer. That subscription is the persistence mechanism that hosts whatever spawned the child. WMI activity event logging records consumer, filter, and binding registrations in the root/subscription namespace; locating the registration shows when the persistence was installed, the script body or its reference, and which filter event triggers it. If WMI activity logging is not ingested in this environment, enumerate registered consumers directly on the host and treat zero results as a visibility gap rather than evidence nothing was registered.
  range: -30d
  query: |
    aggregation: false
    logsource:
      product: windows
      category: wmi_event
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - EventType
      - Operation
      - Consumer
      - Query
- question: Did the spawned child or scrcons.exe make outbound network connections close to the alert time?
  context: >-
    WMI abuse is frequently used to pull a remote payload or to drive remote execution, so a process creation under scrcons.exe that is closely followed by an outbound connection from the same process tree is a meaningful correlation. A child making connections to one or more external hosts within a short window of the spawn points to a download cradle or command-and-control channel; the count of distinct remote destinations helps separate a single fetch from beaconing. Excluding well-known system processes keeps the result focused on the spawned tooling.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_system:
        Image|endswith:
          - '\svchost.exe'
          - '\System'
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: What other child processes did this same scrcons.exe instance spawn?
  context: >-
    A WMI consumer script can call CreateProcess more than once, chaining reconnaissance, credential access, and follow-on tooling from the same scrcons.exe instance. Listing every child of this exact parent instance reveals the full scope of what the consumer script executed beyond the single binary that tripped the alert.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has scrcons.exe spawned this child binary on this host before?
  context: >-
    A scrcons.exe parent spawning this specific child binary that has never been seen on this host is more concerning than a relationship that recurs. Zero or very low historical counts indicate a newly registered or newly active WMI consumer; an established count may reflect legitimate management tooling that uses WMI event subscriptions on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\scrcons.exe'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Is scrcons.exe spawning this child binary on other hosts in the environment?
  context: >-
    The same scrcons.exe parent-child pairing appearing across multiple hosts suggests a WMI event subscription was deployed broadly, which points to either an enterprise management product or a persistence mechanism pushed to many endpoints. A single host points to a host-local subscription. The cross-host distribution calibrates scope and helps distinguish a deployed legitimate consumer from a planted one.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: '\scrcons.exe'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \scrcons.exe
        Image|endswith:
        - \svchost.exe
        - \dllhost.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \schtasks.exe
        - \regsvr32.exe
        - \mshta.exe
        - \rundll32.exe
        - \msiexec.exe
        - \msbuild.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \scrcons.exe
        Image|endswith:
        - \svchost.exe
        - \dllhost.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \schtasks.exe
        - \regsvr32.exe
        - \mshta.exe
        - \rundll32.exe
        - \msiexec.exe
        - \msbuild.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this account do across the environment around the alert time?
  context: >-
    Tracking the account's activity across hosts in the alert window can reveal lateral movement or multi-host activity initiated by the same actor. If the alert fired under a named interactive account, concentrated unusual activity across several hosts widens the scope. If it fired under SYSTEM or a service account, this view returns broad agent-telemetry volume and the launch-mechanism view is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \scrcons.exe
        Image|endswith:
        - \svchost.exe
        - \dllhost.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \schtasks.exe
        - \regsvr32.exe
        - \mshta.exe
        - \rundll32.exe
        - \msiexec.exe
        - \msbuild.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A scrcons.exe child rarely happens in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or the WMI subscription registration itself, may reveal the attack stages that preceded this event and help reconstruct the timeline. Patterns like reconnaissance followed by credential access, or tampering followed by execution, tell the attack story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the alert time?
  context: >-
    A WMI event subscription is itself a persistence mechanism, and operators rarely rely on a single foothold. Surfacing other persistence tooling run on the host in the surrounding window, such as scheduled task creation, service installation, registry edits, BITS jobs, or additional WMI activity, shows whether backup persistence was stacked alongside the consumer. Multiple installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
