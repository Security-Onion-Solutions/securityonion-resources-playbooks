name: PUA - Nmap/Zenmap Execution
id: 3c617692-eaa5-4d41-b10e-db9a61703bb6
description: |
  Detects execution of the Nmap network scanner or its Zenmap GUI front-end on a Windows host, identified by an Image path ending in nmap.exe or zennmap.exe or an OriginalFileName of nmap.exe or zennmap.exe. Nmap is a dual-use port and service scanner: network and IT staff run it for inventory and troubleshooting, while operators use it after a foothold to enumerate live hosts, open ports, and vulnerable services on internal subnets before lateral movement. Investigation should establish whether the user, host, and parent process are expected to run a scanner, what targets and scan options were specified, and whether the execution sits among other reconnaissance activity in the same window.
type: detection
detection_id: f6ecd1cf-19b8-4488-97f6-00f0924991a3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting process match nmap.exe or zennmap.exe by image path or original filename?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the Image path ends in nmap.exe or zennmap.exe, or the OriginalFileName is nmap.exe or zennmap.exe. Review the full event to confirm the binary identity, since OriginalFileName catches renamed copies whose on-disk name was changed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What scan options and targets did this Nmap invocation specify? Decode the full command line.
  context: The command line reveals what the scanner actually did. Decode the scan-type flags (-sS SYN, -sT connect, -sU UDP, -sV version detection, -O OS detection), the -p port range, the --script or -sC NSE scripts, and the target specification (single host, CIDR block, or host list). NSE vuln, brute, and exploit scripts and broad subnet targets point toward intrusive enumeration rather than a narrow troubleshooting check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this user expected to run a network scanner on this host?
  context: Network administrators, IT staff, and security testers legitimately run Nmap for inventory and troubleshooting. Standard users and service accounts rarely have a reason to port-scan. The user's role and typical toolset determine whether scanner execution is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Is Nmap on the organization's approved software list for this host?
  context: Many organizations restrict scanning tools to a sanctioned IT or security inventory. Nmap present on a host outside that approved set may represent shadow IT or an operator-staged binary, regardless of the tool's well-known reputation. An installation under a user-writable or staging directory rather than the standard Program Files (x86)\Nmap path is a further signal worth checking.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket, maintenance window, or authorized assessment explaining this scan?
  context: Legitimate scanning usually maps to a documented activity such as a vulnerability assessment, an asset-inventory job, or a troubleshooting request. If no approved context exists for this execution, the scan may be unsanctioned testing or post-compromise reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned Nmap, and is that parent chain expected?
  context: The parent reveals how the scanner was launched. A user-initiated run is typically spawned from explorer.exe or an interactive cmd.exe or powershell.exe. Parents such as wscript.exe, mshta.exe, wmiprvse.exe, wsmprovhost.exe, or an Office application point toward scripted or remotely-driven execution rather than a deliberate operator action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What process spawned the discovery activity, and is this a normal launch pattern?
  context: Scanning launched from an interactive shell a user opened is ordinary administrative behavior. Scanning spawned by script interpreters (wscript.exe, cscript.exe, mshta.exe), by remote-execution hosts (wmiprvse.exe, wsmprovhost.exe), or by an Office process indicates automated post-exploitation enumeration rather than a hands-on operator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What child processes did Nmap spawn afterward?
  context: A scanner's children reveal its actual impact. Nmap with the scripting engine can invoke helpers, and operators often chain a scan into follow-on actions. Spawned cmd.exe, powershell.exe, certutil.exe, or ncat.exe shifts the disposition toward hands-on-keyboard activity rather than a self-contained inventory scan.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What network destinations did Nmap probe from this host?
  context: Scan traffic shows what was actually targeted. A spread of destination IPs across an internal subnet on many ports within a short window is the network signature of host and service enumeration. A single documented target or a narrow port set is more consistent with troubleshooting. If network telemetry is not collected for this host, fall back to the target and port arguments in the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Does this host normally run Nmap?
  context: A scanner that has never run on this host is more suspicious than one that runs on a routine schedule. Zero or very low counts over the trailing window indicate first-time or rare execution; a steady recurring count suggests an established inventory or monitoring job. Compare any allowed-scanner expectation for this host against what the baseline shows.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how this scanner-execution pattern has historically run here rather than generic binary usage. A new parent process, an unexpected account, or a first-ever appearance is the deviation worth chasing; a parent and user that already account for prior firings point to an established scheduled or operator job.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \nmap.exe
        - \zennmap.exe
      - OriginalFileName:
        - nmap.exe
        - zennmap.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \nmap.exe
        - \zennmap.exe
      - OriginalFileName:
        - nmap.exe
        - zennmap.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \nmap.exe
        - \zennmap.exe
      - OriginalFileName:
        - nmap.exe
        - zennmap.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the scan was an isolated action or part of broader movement. If the same user drove similar activity on multiple endpoints in the same window, the scope of the investigation may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \nmap.exe
        - \zennmap.exe
      - OriginalFileName:
        - nmap.exe
        - zennmap.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single scanner run may be legitimate troubleshooting, but a scan accompanied by several native discovery commands in rapid succession is a signature pattern of post-compromise enumeration. Three or more distinct recon binaries within the window points to automated reconnaissance rather than a deliberate one-off scan.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host spread look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this scanner-execution pattern rather than generic binary usage. Many hosts firing the same pattern points to a scripted deployment or a sanctioned scanning job; one host or a small unrelated set points to manual operator activity. A consistent set of allowed scanning hosts can be used as a known-scanner baseline when calibrating severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \nmap.exe
        - \zennmap.exe
      - OriginalFileName:
        - nmap.exe
        - zennmap.exe
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this scan?
  context: Reconnaissance rarely happens in isolation. Earlier detections on the same host - initial access, defense tampering, or credential access - may reveal the attack stages that preceded the scan and help place it on a timeline. Network service discovery commonly follows a foothold and precedes lateral movement.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
