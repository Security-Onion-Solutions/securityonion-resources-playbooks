name: Uncommon Microsoft Office Trusted Location Added
id: d0c42f70-95ae-4b99-bf40-798dc8499e02
description: |
  Detects a registry write that adds a Microsoft Office Trusted Location, where the value name ends in \Path under a
  Security\Trusted Locations\Location key and the directory being trusted is not one of the known Office template
  directories, and where the writing process is not an Office application or the Office Click-to-Run updater. A Trusted
  Location tells Office to open documents from that directory without macro warnings and without Protected View, so adding
  one pre-authorizes macro execution for anything later opened from that directory. This is a setup action rather than an
  execution event: the document usually arrives afterwards, which makes the trusted directory, the process that wrote it,
  and any subsequent Office child processes the load-bearing evidence. Legitimate causes are common — an administrator
  deploying a template or add-in share, a line-of-business installer, or a group policy rollout — so establishing whether
  the change was sanctioned is a first-class outcome of this investigation.
type: detection
detection_id: f742bde7-9528-42e5-bd82-84f51a8387d2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Do the registry key and value data match what this rule detects?
  context: >-
    Confirm the key path contains Security\Trusted Locations\Location and ends in \Path, and that the writing process is
    not an Office application or the Click-to-Run updater, which the rule excludes. The directory being trusted lives in
    the value data; where value data is not recorded for this event, identify the directory from the key path index and a
    direct read of the key instead of assuming it is present. Read the signer columns for coherence with the key, not as a
    verdict — nearly every alerting process is trusted-signed, so the question is whether that publisher plausibly owns
    Office trust configuration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to configure Office Trusted Locations?
  context: >-
    Trusted Location changes are normally made by administrators, by a deployment mechanism, or by an installer that ships
    templates or add-ins. A change made under an ordinary user account on a workstation that has no template-publishing
    role is a different situation from the same change on a machine that is part of a documented Office rollout. User
    attribution is present on most endpoint registry events but is frequently a machine account or a service identity for
    deployment-driven writes; when it is, attribute the change through the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What launched the process that wrote the Trusted Location value?
  context: >-
    The registry event names the writing process but not its lineage. Looking that process up by its own identifier returns
    the parent that started it, which separates an installer or software-deployment chain from an interactive shell, a
    script host, or an Office application driving the change through a macro. Registry tools reached through msiexec.exe or
    a deployment agent read differently from reg.exe, powershell.exe, or wscript.exe started under an interactive session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the process that wrote the Trusted Location value spawn?
  context: >-
    A process that reconfigures Office trust rarely stops there. Listing the children it launched shows whether the change
    was an isolated configuration step or one part of a longer sequence — copying content into the newly trusted directory,
    adding further trust entries, or launching Office directly. This shows what the writing process started, not what
    started alongside it, because registry events do not record the writing process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was this Trusted Location change part of a documented deployment or approved request?
  context: >-
    Office trust configuration is usually rolled out deliberately — a template share, an add-in, or a line-of-business
    application that needs its documents to open without prompts. A matching ticket, package, or policy record makes the
    change routine; the absence of one where policy requires it makes the directory and the writing process the next
    things to examine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Are Office trust settings normally configured this way in your organization?
  context: >-
    Most organizations push Office trust settings through group policy or an application-deployment mechanism, which writes
    the policy hive rather than the per-user Office hive and does so from a known agent. A direct write from a command
    interpreter, a script host, or an unmanaged installer is inconsistent with that pattern — which may mean an
    administrator took a shortcut, or that the change did not come from your deployment path at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which Office application and trust index does this key belong to, and what does trusting that directory permit?
  context: >-
    The key path names the Office application and the Location index the entry occupies, and the value data holds the
    directory itself. A Trusted Location suppresses macro warnings and Protected View for documents opened from that
    directory, so the entry is a standing grant rather than a single action. Judge the writing process against that grant —
    a publisher that plausibly ships Office content is coherent, a general-purpose interpreter or an unrelated vendor
    writing Office trust configuration is not. Where value data is absent from this event, read the directory from the key
    directly before ruling on it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: Which directory was trusted, and is it writable by an ordinary user or reachable over the network?
  context: >-
    The directory path is the whole point of the entry. A path under a user profile, ProgramData, a temporary directory, or
    a UNC share means anyone who can write there can place a document that Office will open with macros enabled and no
    Protected View. A path under a controlled program directory or a read-only template share is a much narrower grant.
    Value data is not recorded on every registry event in this telemetry; if it is missing here, read the Path value from
    the key on the host rather than treating the directory as unknown.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - User
  answer_sources:
  - registry_event
  - manual_review
- question: Were the companion values under this Trusted Location entry set, including AllowSubfolders and Description?
  context: >-
    A Trusted Location entry is a small group of values written together under one Location index. AllowSubfolders extends
    the grant to every directory beneath the trusted path, which widens it considerably; Description and Date are cosmetic
    and are what a deployment mechanism typically fills in. Seeing which companion values were written, and whether other
    Location indexes were added in the same window, tells you the breadth of the grant and whether one entry or a set of
    them was configured.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: 'Security\Trusted Locations\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
  answer_sources:
  - registry_event
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Registry changes that arrive together describe an operation. Office trust configuration alongside macro-security
    downgrades, autostart entries, or security-tool policy changes within the same window points to a hands-on session or
    an installer-style implant; the same entry arriving on its own from a deployment agent points to a rollout. Group by
    key path and writing process, and read the entries other than the alerting one as the signal.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Did the process that wrote this entry, or its children, also place files on disk around the same time?
  context: >-
    A Trusted Location grant becomes useful once content exists in the directory it names. Correlating file activity by the
    writing process and its children shows whether a document, template, or add-in landed in the same session as the
    registry write, and where it landed relative to the trusted path. A grant with no accompanying content is consistent
    with staging for something that arrives later; content written into the trusted directory by the same process narrows
    the question to that file.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Did an Office application spawn any child processes on this host after the Trusted Location was added?
  context: >-
    The grant takes effect the next time a document is opened from the trusted directory, and the observable consequence of
    a macro running inside that document is an Office application starting a child process. Command interpreters, script
    hosts, or transfer utilities under WINWORD.EXE, EXCEL.EXE, or POWERPNT.EXE after the entry was written indicate the
    pre-authorization was used. No children is not proof nothing opened — it means no macro spawned a process in this
    window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_office:
        ParentImage|endswith:
          - '\WINWORD.EXE'
          - '\EXCEL.EXE'
          - '\POWERPNT.EXE'
          - '\MSACCESS.EXE'
          - '\OUTLOOK.EXE'
          - '\VISIO.EXE'
      condition: selection and selection_office
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Has this Trusted Location key been written before on this host?
  context: >-
    An index that has never been touched in ninety days is a new grant; an index rewritten on a regular cadence with the
    same directory is characteristic of a deployment mechanism reasserting configuration. Compare the value data across the
    history — the same directory reappearing is a refresh, a directory that changes is a reconfiguration. This history also
    stands in for cleanup detection, because value removals are not recorded in this telemetry.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Does this host normally run the process that wrote this entry?
  context: >-
    A ninety-day count of the writing binary on this host separates routine tooling from a first appearance. A deployment
    agent or installer that runs regularly here is a weaker signal than a binary whose only execution in the period is the
    one that reconfigured Office trust. Grouping by user shows whether it normally runs under a service identity and ran
    this time under someone else.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: What other registry activity occurred on this host around the time of the alert?
  context: >-
    Grouping every registry write on the host by key path and writing process collapses routine agent and application churn
    into high-count rows and leaves unusual writers visible at low counts. Scan for writers that have no business touching
    Office configuration, and for other trust or macro-security paths written by the same process in the window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
  answer_sources:
  - registry_event
- question: Have Office Trusted Locations been added on other hosts in the environment recently?
  context: >-
    The same trusted directory appearing across many hosts from a consistent writing process describes a policy or software
    rollout, and is the most efficient way to close this alert when the change was sanctioned. The same directory appearing
    on a handful of unrelated hosts, or different directories written by the same unusual process, describes something
    narrower. Compare both the directories and the writing processes across hosts.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|contains: 'Security\Trusted Locations\Location'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Trust configuration is a setup step, and setup steps usually follow something. Earlier detections involving document
    handling, script execution, macro-security changes, or file delivery on the same host help establish how the writing
    process came to be running and whether the trust grant is one stage of a sequence rather than a standalone change.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    A Trusted Location grant survives reboot and re-establishes macro execution every time a document is opened from the
    directory, which makes it one option among several for holding access. Executions of the common persistence utilities
    in the surrounding window show whether this entry stands alone or whether scheduled tasks, services, or autostart
    entries were configured alongside it. Grouping by tool and command shows which mechanisms were touched rather than
    every invocation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
