name: Winlogon AllowMultipleTSSessions Enable
id: 25a72985-977b-42f9-9c88-8377f17b17bf
description: |
  Detects the Winlogon 'AllowMultipleTSSessions' value being set to 0x00000001, which permits
  more than one concurrent Remote Desktop session on the host. Administrators occasionally enable
  this for shared or lab systems, but it is also used to attach to a host over RDP without
  disconnecting the logged-on user, and it commonly appears alongside other RDP-enablement and
  credential-weakening registry changes. Investigation should confirm the writing process and its
  parent, determine whether the change was authorized, and check whether the weakened setting was
  actually used or accompanied by additional tampering.
type: detection
detection_id: f7997770-92c3-4ec9-b112-774c4ef96f96
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was the Winlogon AllowMultipleTSSessions value set to 0x00000001 (enabled) on this host?
  context: Confirm the alert is a true positive before investing time. The rule fires when the value
    under \Microsoft\Windows NT\CurrentVersion\Winlogon\AllowMultipleTSSessions is written with data
    DWORD (0x00000001). Review the exact key path (TargetObject) and value data (Details) against
    that pattern; 0x00000001 enables concurrent RDP sessions, while a 0 or absent value leaves the
    default single-session behavior.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to enable multi-session Remote Desktop?
  context: Legitimate administration can set this value on shared, lab, or jump hosts. Knowing whether
    the account and machine role are consistent with RDP configuration changes is often the fastest way
    to separate routine maintenance from unauthorized tampering. Registry changes made through
    regedit.exe, msiexec.exe, or reg.exe by an administrator differ from the same write driven by an
    unexpected or unsigned process; note the writing process when user attribution is a machine account
    or missing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the AllowMultipleTSSessions key, and is this a known RDP-enablement location?
  context: This value lives under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon and controls
    whether the host allows multiple simultaneous Terminal Services sessions. Enabling it is one of a small
    set of registry changes that loosen Remote Desktop restrictions (others include the RDP listener
    PortNumber and firewall rules). The environment's list of monitored persistence and policy keys, and
    whether the writing process is a signed administrative tool, determine how much scrutiny the change warrants.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the written DWORD value mean for this host's Remote Desktop behavior?
  context: The Details field carries the value data. DWORD (0x00000001) turns on concurrent session
    support; a value of 0 restores the single-session default. Reading the exact data confirms the setting
    was enabled rather than reset, and distinguishes an activation from a benign policy read or a revert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the AllowMultipleTSSessions change stay in effect, or was the value reset afterward?
  context: A durable weakening of the setting is more concerning than a transient change that an
    administrator immediately reverted. Endpoint telemetry does not emit registry value-deletion events,
    so removal of the key cannot be observed directly; judge durability from the value's re-modification
    history over a longer window and from whether the setting was later written back to 0.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this registry value, and what started that process?
  context: The writing process and its parent reveal how the change was made. A signed administrative tool
    launched from an interactive session (regedit.exe, reg.exe, or an installer under explorer.exe) looks
    different from the same write driven by a script host, a remote-execution service, or an unsigned binary
    with an unexpected parent chain. Tracing the parent's own origin distinguishes routine administration
    from an attacker-driven configuration change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: Enabling multi-session RDP frequently travels with other registry changes made in the same short
    window — setting the RDP listener PortNumber, adding a backdoor account to the RDP users group, weakening
    credential protections (WDigest UseLogonCredential, LmCompatibilityLevel), or relaxing remote UAC
    (LocalAccountTokenFilterPolicy). Correlating changes by writing process within the window reveals whether
    this was one config edit or a cluster of tampering pursuing multiple objectives.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the AllowMultipleTSSessions value been modified before on this host?
  context: A first-time change to this policy key is more suspicious than a routine one. Some hosts have this
    enabled by design and rarely touch the value again; others should never see it change. A long historical
    view, grouped by the value data written and the writing process, calibrates how unusual this modification is.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After the setting was enabled, were new Remote Desktop connections established on this host?
  context: The purpose of this value is to permit concurrent RDP sessions, so the follow-on test is whether
    Remote Desktop was actually used afterward. Connection activity on TCP 3389 in the hours after the change
    indicates the weakened setting was exercised; this is connection-level evidence rather than a session count,
    so pair it with logon review when confirming multiple simultaneous sessions.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort: 3389
      condition: selection
    fields:
      - DestinationIp
      - Initiated
- question: Was this same registry value modified on other hosts in the environment?
  context: The same change across many hosts may reflect a group policy push or widespread tooling; a change
    isolated to this one host is more consistent with targeted, hands-on activity. Comparing the value data
    written across hosts helps distinguish an authorized fleet-wide setting from a one-off modification.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the change?
  context: Registry tampering rarely happens in isolation. Surrounding process execution — reconnaissance,
    account creation, credential access, or persistence tooling — reveals whether this setting change was part
    of a larger sequence. Aggregating by process and parent collapses routine agent noise so that novel
    parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may
    reveal the stages that preceded this configuration change and help reconstruct the timeline. RDP-enablement
    changes often follow initial access and precede lateral movement.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single foothold. Alongside loosening RDP access, they commonly install
    backup persistence via scheduled tasks, services, or registry Run keys. Persistence tooling executing in the
    same timeframe as the setting change points to intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations on this host around this time?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without running
    schtasks, sc, or reg. File event monitoring captures these drops even when standard persistence tooling is avoided.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: Many organizations require change records for policy and Remote Desktop configuration changes. A
    corresponding ticket suggests authorized activity; the absence of one when policy requires it suggests the
    change was unauthorized. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall enabling multi-session Remote Desktop on this host?
  context: Direct confirmation from the person behind the account is often the fastest path to determining
    legitimacy. If no one recalls making the change, the account may be compromised or the activity automated;
    if they do recall it, capture why the setting was needed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
