name: Potential RDP Tunneling Via SSH
id: 605b0033-6f5a-44ce-83ba-f2c147baf96c
description: |
  Detects ssh.exe running with a command line that references TCP/3389, the signature of forwarding RDP through an
  outbound SSH session. Outbound 3389 is commonly blocked at the perimeter while outbound SSH (22/443) is usually
  permitted, so an operator forwards the victim's local 3389 (or an internal host's 3389 via 127.0.0.1 substitution)
  back through the tunnel with -R, -L, or -D. The rule fires when an Image ending in ssh.exe runs with ":3389" in the
  command line. Determine whether this is a sanctioned administrative tunnel or operator-staged remote access by
  decoding the forwarding flags, identifying the external SSH endpoint, and checking whether the user, host, and parent
  chain are expected.
type: detection
detection_id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting command line show ssh.exe forwarding TCP/3389?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    against the rule's criteria - an Image ending in ssh.exe with ":3389" present. Confirm the port appears as a forwarding
    target and not as an incidental substring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run SSH port forwarding to RDP?
  context: Legitimate administrative tunnels exist, but a server, workstation, or service account that has no remote-admin
    role forwarding RDP over SSH is harder to explain. Knowing whether the user role and host function fit this operation
    is often the fastest path to distinguishing a sanctioned admin tunnel from operator-staged access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Decode the ssh.exe command line - what does the full forwarding specification do?
  context: The full command line reveals the tunnel direction and target. Decode the forwarding flag and its argument - -R
    exposes a local or internal 3389 back to the SSH server side, -L pulls a remote 3389 to a local listener, and -D opens
    a SOCKS proxy. Note the destination host after the user@host token and any automation switches such as -N, -i keyfile,
    or StrictHostKeyChecking disabled, which indicate an unattended persistent tunnel.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which forwarding flags and target endpoints in the command line encapsulate RDP inside the SSH session?
  context: Protocol tunneling hides RDP inside an allowed protocol so it crosses the perimeter undetected. Confirm the
    specific encapsulation by isolating the forwarding flag and its address pair - a 127.0.0.1:3389 or internal-IP:3389
    target paired with -R or -L is the tunnel definition. The remote port the operator dialed and the internal target
    being exposed both come from this string.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        CommandLine|contains: ':3389'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Is SSH port forwarding authorized for use on this host, and what business purpose does it serve?
  context: Organizations typically sanction a specific set of remote-access and tunneling methods. SSH port forwarding that
    exposes RDP may be a legitimate admin jump path or it may be shadow IT or operator-staged persistence. An unauthorized
    tunnel should be checked regardless of whether ssh.exe itself is a built-in Windows binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this SSH tunnel part of a documented administrative procedure or active support session?
  context: Legitimate tunneling usually correlates with an approved maintenance window, a change ticket, or a documented
    administrative procedure. If no support context explains this forwarding session, the tunnel may have been established
    by an operator for persistent remote access or by a user circumventing access controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoint did ssh.exe connect to around the time of the alert?
  context: The SSH tunnel terminates at an external endpoint - the server the operator forwards RDP through. A connection
    to a cloud VPS, an unfamiliar IP, or a non-corporate ASN on port 22 or 443 is the relay side of the tunnel. Correlating
    the ssh.exe process with its outbound connection in the same window ties the forwarding command to the actual destination.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What process spawned ssh.exe and is that parent chain expected?
  context: The parent process reveals how the tunnel was launched. An interactive explorer.exe or a terminal under an admin
    session fits manual administration, while a script host, a service, an Office application, or a remote-execution parent
    points to scripted or operator-driven setup. Walk up to the parent's own parent to see what initiated the chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What inbound remote-access connections reached this host, and are those sources expected administrative origins?
  context: Tunneling RDP back to an attacker relay is often paired with inbound access on the forwarded port. Identifying
    which hosts opened RDP, SMB, WinRM, or SSH sessions to this host reveals whether the connection came from a known admin
    jump box or an unexpected source being used as a pivot.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes were spawned on this host after the tunnel was established?
  context: A tunnel is a means to an end - once RDP is reachable, an operator runs commands, deploys tools, or accesses data
    through the session. Examining processes that started shortly after the forwarding command reveals whether the tunnel was
    used and what objectives followed.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account run other lateral-movement or tunneling tools across the environment?
  context: Operators rarely stop at one tunnel. If the same account is also running psexec, mstsc, plink, wmic, or further
    ssh sessions across multiple hosts in a short window, the scope of compromise is larger than this single endpoint and
    points to active lateral movement.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains: :3389
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains: :3389
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals whether the tunnel is part of broader movement. If the same
    user triggered similar activity on multiple endpoints, the scope extends past this host. Pair with the launch-mechanism
    view since user pivots degrade under service accounts.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains: :3389
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this ssh.exe-to-3389 pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the tunneling
    pattern rather than generic ssh.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains: :3389
      condition: selection
    fields:
    - host.name
- question: When this host has previously fired this ssh.exe-to-3389 pattern, what parents and users drove it, and does the current alert fit?
  context: Even built-in tools can be abused. The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an
    unexpected account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ssh.exe
        CommandLine|contains: :3389
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Did other detections fire on this host in the hours before this alert?
  context: A tunnel rarely stands alone. Earlier detections on the same host - defense tampering, reconnaissance, credential
    access, or privilege escalation - may reveal the stages that preceded the tunnel and help reconstruct the timeline that
    led to remote access being staged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
