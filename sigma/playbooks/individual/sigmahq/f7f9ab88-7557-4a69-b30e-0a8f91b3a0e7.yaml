name: Registry Entries For Azorult Malware
id: 7a96cbd1-396e-43cc-8dc7-a22885ed312e
description: |
  Detects creation or modification of a registry key ending in \services\localNETService under the SYSTEM hive, a
  service registration written during Azorult malware execution. Azorult is an information stealer typically dropped
  by other malware or downloaded from malicious sites, and a service entry under this name reflects its
  host-persistence stage rather than any routine software installation. The investigation should confirm the key path,
  identify the writing process and its origin, determine whether the registered service executed a payload, and scope
  the host for related persistence and data-theft activity.
type: detection
detection_id: f7f9ab88-7557-4a69-b30e-0a8f91b3a0e7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry write target the localNETService service key this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact registry
    path (TargetObject) against the rule's criteria - a key under the SYSTEM hive ending in \services\localNETService.
    Both key creation and value writes to that path match, so note which operation occurred and which value, if any,
    was written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - EventID
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to install or reconfigure Windows services?
  context: Legitimate service registrations come from installers, deployment tooling, or administrators. The
    localNETService name is not associated with any known legitimate product, so knowing whether the account is an
    admin performing installs or an ordinary user - and whether the host has any pending software deployment - frames
    everything that follows. User attribution is present on most endpoint registry events; when it is a machine
    account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What launched the process that wrote this service key?
  context: Service keys are legitimately written by services.exe, msiexec.exe, or installer executables run by an
    administrator; registry edits from regedit.exe reflect hands-on changes. Azorult-family infections instead write
    service entries from a dropped executable whose own parent is a browser, an Office process, a script host, or
    another malware loader - trace the writing process's parent chain and check whether the writing binary is signed
    using your endpoint console.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What was written under the localNETService key, and does it register a runnable service?
  context: Keys under SYSTEM\CurrentControlSet\Services define Windows services - the values written determine what
    persists. An ImagePath or ServiceDLL value naming an executable, a Start value of 2 (automatic), or a Type value
    indicating an own-process service means the malware registered a payload that the service control manager will
    launch. Services is one of the critical persistence locations (alongside Run keys, security policy settings, and
    LSA configuration) where any unexplained write deserves scrutiny.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the value data under this key decode to?
  context: Registry values in a malicious service key can contain the payload path, a DLL for svchost hosting, an
    encoded command, or configuration data the stealer reads back at runtime. Analyze the Details field - a file path
    in Temp, AppData, or ProgramData becomes a new artifact to verify on disk; DWORD values set the service start
    behavior. If Details names an executable path, carry that path into the follow-on execution and file-drop checks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the executable referenced by the service key present on disk?
  context: Service persistence is only effective if the referenced payload exists at the path written to the registry.
    This query surfaces file activity by the registry-writing process and its children - the dropped service binary
    usually lands in the same session as the registry write. The file-write event carries no hash; if the payload is
    present, hash it from a later execution event or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the registered service start and execute a payload?
  context: A service registered in the registry only matters once the service control manager launches it. New service
    processes start as children of services.exe - review new executions under that parent in the hours after the
    write, looking for the binary named in the service key's value data. Registry key deletion is not observable in
    endpoint telemetry, so judge whether the persistence is live from execution evidence and the key's re-modification
    history rather than from the key's absence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\services.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the process that wrote this key make external network connections?
  context: Azorult-family stealers harvest browser credentials, cookies, and cryptocurrency wallet data and send it to
    a command-and-control host shortly after execution, often in a single burst before the process exits. Outbound
    connections from the writing process to external addresses around the alert time point to the exfiltration stage;
    capture the destination for blocking and cross-host scoping.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Were other registry modifications made on this host in the same session?
  context: Malware that registers a service commonly makes several registry changes together - additional run keys,
    security setting downgrades, or configuration for the payload. Clusters of registry writes from the same process
    within a short window reveal the full set of configuration changes; the signal is what else was modified beyond
    the alerting key.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the alert?
  context: A service registration for a stealer rarely happens in isolation - the dropper, the payload, discovery
    commands, and cleanup all land within minutes of each other. Aggregated parent-child pairs collapse repetitive
    agent noise into high-count rows while novel pairs stand out at low counts; those low-count novel pairs are what
    to scan for. The registry-to-execution time correlation is the core of this check.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this registry key been modified before on this host?
  context: A service key that has never been touched before points to a first-time installation - consistent with a
    fresh infection. Prior modifications with the same value data would instead point to re-installation or a
    recurring process. Zero history for a key named localNETService leaves little room for a benign explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that wrote the key?
  context: A writing binary that has executed regularly for months reads very differently from one seen for the first
    time at alert. Zero or very low historical counts indicate a freshly dropped executable; also check whether the
    binary is signed and where it lives on disk - unsigned executables writing service keys from user-writable paths
    fit the malware pattern rather than the installer pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was the localNETService key written on other hosts?
  context: The same service key appearing across multiple hosts indicates the infection spread - a shared dropper,
    a malicious download mirrored to several users, or lateral movement. If only this host carries the key, containment
    can stay host-focused. Compare value data across hosts to see whether the same payload path was configured
    everywhere.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence mechanisms installed on this host?
  context: Malware droppers frequently stack persistence - a service entry plus a scheduled task, run key, or WMI
    subscription - so removal of one mechanism does not clean the host. Executions of the standard persistence tools
    in the hours around the service registration reveal whether additional footholds were configured alongside the
    detected one.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to startup or run-key persistence locations on this host?
  context: File-based persistence bypasses tool-based detection entirely - dropping an executable into a Startup
    folder achieves relaunch-on-logon without running sc.exe or reg.exe. Stealer droppers often plant a copy in a
    startup path as a backup to the service entry; file writes to these locations in the surrounding hours widen the
    persistence picture.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: A stealer's service registration is usually preceded by delivery and execution stages - a malicious
    download, a script-host launch, or defense tampering. Earlier detections on the same host help reconstruct how
    the malware arrived and which other rules already saw stages of the same infection.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
