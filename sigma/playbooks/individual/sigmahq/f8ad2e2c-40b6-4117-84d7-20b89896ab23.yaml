name: Suspicious Scan Loop Network
id: 2858f78e-114d-46f9-8e7f-becfddd7a119
description: |
  Detects a command line that combines a loop construct ("for " or "foreach ") with a network resolution or reachability
  utility (nslookup or ping) in the same invocation. This is the classic pattern of a scripted network sweep -- iterating over
  a host list or address range and resolving or pinging each entry to map reachable systems for lateral movement. Legitimate
  scripts and IT troubleshooting use the same construct, so the investigation should determine the breadth of the iteration,
  who and what launched it, whether it fits this host's history, and whether enumeration of additional systems or follow-on
  tooling accompanied it.
type: detection
detection_id: f8ad2e2c-40b6-4117-84d7-20b89896ab23
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line combine a loop construct with nslookup or ping, as this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires only when a single command
    line contains both a loop keyword ("for " or "foreach ") AND a resolution/reachability utility (nslookup or ping) -- the
    signature of an iterated sweep rather than a one-off lookup. Verify both elements are present and read the iteration set
    to see what range or host list is being walked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the looped command actually iterate over, and what does it do to each target?
  context: The full command line reveals the scope and intent of the sweep. Decode the iteration set -- a numeric range (for
    /L 1,1,254), a file of hostnames, or piped command output -- and the per-iteration action. ping with output redirected
    to a file is reconnaissance staging; nslookup resolving an internal name list is DNS-based enumeration. Note any output
    redirection, additional flags, or chained commands in the DO/process block.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_loop:
        CommandLine|contains:
          - 'for '
          - 'foreach '
      selection_tools:
        CommandLine|contains:
          - nslookup
          - ping
      condition: selection_host and selection_loop and selection_tools
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this looped scan command, and is that parent chain normal?
  context: Legitimate discovery loops are typically run from cmd.exe or powershell.exe spawned by explorer.exe (an interactive
    operator) or from a known automation/orchestration process. A scan loop spawned by an Office application, a script
    interpreter such as wscript.exe or mshta.exe, or a remote-execution host like wmiprvse.exe or wsmprovhost.exe points to
    automated post-exploitation enumeration rather than manual troubleshooting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run scripted network enumeration?
  context: Network administrators and IT staff legitimately script ping/nslookup sweeps for inventory and connectivity
    troubleshooting. Standard users and service accounts rarely iterate over an address range or host list. The user's role
    and typical toolset determine whether the looped enumeration is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single scan loop may be troubleshooting, but multiple distinct reconnaissance binaries in rapid succession --
    nslookup, net, nltest, arp, nbtstat, hostname -- is a signature of post-compromise enumeration. Three or more different
    recon tools within roughly fifteen minutes typically indicates automated discovery. The mutable burst window (often under
    thirty seconds for scripted runs) is what separates a tight automated sweep from intermittent manual checks.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: When this host previously fired this looped-scan pattern, what parents and users drove it, and does the current
    alert fit?
  context: Even routine troubleshooting scripts recur. The query mirrors the rule's selection structure scoped to this host,
    so the resulting parent/user distribution reflects how this specific firing pattern -- not generic shell usage -- has
    historically run here. A new parent process, an unexpected user account, or an unusual command-line structure relative to the
    historical baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loop:
        CommandLine|contains:
        - 'for '
        - 'foreach '
      selection_tools:
        CommandLine|contains:
        - nslookup
        - ping
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What did the parent of this scan loop spawn afterward?
  context: The processes launched after a network sweep reveal its purpose. A reconnaissance loop followed by lateral-movement
    tooling, credential access, or remote execution against the systems just enumerated indicates the discovery fed an active
    operation. The parent that launched the loop is the pivot for what ran next on this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Reconnaissance rarely happens in isolation. Activity surrounding the scan loop may reveal privilege escalation,
    persistence installation, credential access, or data staging that provides broader context. Scan the surrounding process
    activity for tools that would advance an operation past the discovery stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loop:
        CommandLine|contains:
        - 'for '
        - 'foreach '
      selection_tools:
        CommandLine|contains:
        - nslookup
        - ping
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loop:
        CommandLine|contains:
        - 'for '
        - 'foreach '
      selection_tools:
        CommandLine|contains:
        - nslookup
        - ping
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple
    endpoints. If the same user triggered similar enumeration or follow-on activity on other hosts in the same window, the
    scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loop:
        CommandLine|contains:
        - 'for '
        - 'foreach '
      selection_tools:
        CommandLine|contains:
        - nslookup
        - ping
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event, what
    happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or
    persistence mechanisms in the surrounding process activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, initial access, credential access -- may reveal the
    attack stages that preceded this enumeration and help reconstruct the timeline. Reconnaissance commonly follows initial
    access and precedes lateral movement, so the order of alerts tells the story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this looped-scan pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic shell usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_loop:
        CommandLine|contains:
        - 'for '
        - 'foreach '
      selection_tools:
        CommandLine|contains:
        - nslookup
        - ping
      condition: all of selection_*
    fields:
    - host.name
- question: Did this host generate a burst of DNS lookups or ICMP/outbound connections to many distinct internal addresses
    around the alert time?
  context: A loop wrapping nslookup or ping produces network-layer evidence even when command-line capture is incomplete --
    a rapid series of DNS queries from one host, or outbound reachability probes to many distinct internal addresses in a
    short window. A fan-out to a contiguous address range or a large host list confirms an active sweep and reveals which
    systems were enumerated. If DNS and connection telemetry are not collected for this host, treat sparse results as a
    visibility gap rather than evidence the sweep was narrow.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - QueryName
- question: What is the scope of the iteration -- a contiguous address range, a discrete host list, or piped command output?
  context: The breadth and source of the iteration set distinguish a narrow connectivity check from a broad sweep. A
    contiguous range (for /L over 1..254) or a large discrete host list indicates intent to map many systems; piped output
    from net view or a hostfile indicates the operator already had a target list. Read the iteration set and any output
    redirection to gauge how many systems were touched and whether results were staged to a file for later use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
