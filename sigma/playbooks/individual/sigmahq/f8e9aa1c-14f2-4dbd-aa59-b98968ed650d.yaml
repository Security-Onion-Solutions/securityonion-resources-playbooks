name: DarkGate - Autoit3.EXE Execution Parameters
id: 289730e3-9a0d-4653-81dd-5d54e15c92b4
description: |
  Detects the AutoIt3 scripting interpreter running under cmd.exe, KeyScramblerLogon.exe, or msiexec.exe, from a
  location other than the standard AutoIt3 install directories under Program Files. The interpreter is identified
  either by an Image path ending in \Autoit3.exe or by PE metadata whose OriginalFileName is AutoIt3.exe, so a
  renamed copy still matches; both identity branches are combined with the parent-process requirement and with the
  Program Files exclusion. AutoIt is a legitimate automation runtime, and some environments deploy it deliberately,
  but a copy staged outside Program Files and launched from a command shell or an installer is the delivery pattern
  DarkGate uses to run an .au3 script that decodes shellcode and injects it into another process. The investigation
  should establish which identity branch fired, which .au3 script the interpreter was handed, where that script and
  the interpreter came from, and whether AutoIt automation is expected on this host at all.
type: detection
detection_id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Did AutoIt3 — identified either by its Image path or by its OriginalFileName metadata — run under cmd.exe,
    KeyScramblerLogon.exe, or msiexec.exe from outside the Program Files AutoIt3 directories?
  context: >-
    The rule fires when the parent is one of those three binaries AND either identity branch matches — an Image path
    ending in \Autoit3.exe, or an OriginalFileName of AutoIt3.exe — AND the Image is neither of the two Program
    Files AutoIt3 paths. Note which branch fired, because it changes what the rest of the investigation weighs. If
    the Image path branch fired, the interpreter is still named Autoit3.exe and the question is where that copy was
    staged. If only the OriginalFileName branch fired, the file on disk carries a different name than its PE
    metadata, and the identity and origin of the renamed file become the load-bearing questions. Both branches
    firing together is the plain case of an unrenamed interpreter outside its install directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
  answer_sources:
  - alert
  - process_creation
- question: Is AutoIt automation expected on this host and for this user, and is AutoIt3 deployed here through a managed install?
  context: >-
    AutoIt is a supported scripting runtime, and organizations do ship AutoIt-compiled helpers, installer wrappers,
    and desktop automation. A managed deployment normally lands the interpreter under Program Files, which this rule
    excludes, so a match means the interpreter ran from somewhere else. Confirm with asset inventory and software
    deployment records whether AutoIt is sanctioned here and where it is supposed to live.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the actual identity of the alerting binary — does the file name on disk match its OriginalFileName, and what does the hash resolve to?
  context: >-
    Comparing the Image path against OriginalFileName shows whether this is the AutoIt3 interpreter under its own
    name or a renamed copy. The AutoIt3 interpreter itself is a signed, legitimate build, so a clean reputation
    result on the hash does not clear the alert — it confirms the interpreter is genuine and moves the question to
    the script it was told to run. A hash that does not resolve to a published AutoIt3 build points to a modified or
    repacked interpreter instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How did this copy of the AutoIt3 interpreter arrive on the host, and which process wrote it?
  context: >-
    An interpreter running outside Program Files was placed there by something. The file creation event names the
    writing process, which separates a package manager or vendor installer from a download tool or a script-driven
    staging step. A common delivery pattern is a shell or script host invoking a command-line download utility —
    sometimes a copy of curl.exe renamed and run from the same new directory — to fetch the interpreter and its
    script into a freshly created folder. File writes carry no hash, so match on the file name and pivot to the
    later execution event for hash-based reputation work.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What did the AutoIt3 interpreter do after it started, and did it spawn any child processes?
  context: >-
    The interpreter's command line names the script, but the script's behavior shows up as everything the
    interpreter did afterwards. In the shellcode-loader pattern, the .au3 script decodes a payload, marks the memory
    executable, and calls it in-process, so an empty child list is an expected result rather than a clean one — the
    payload runs inside AutoIt3.exe itself and later injects into another process. Child processes, when present,
    name the next stage directly.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is this parent expected to launch the AutoIt3 interpreter, and what started the parent itself?
  context: >-
    cmd.exe, msiexec.exe, and KeyScramblerLogon.exe each imply a different launch mechanism — a shell or batch
    script, an installer package, and a keystroke-encryption product's logon component respectively. The parent's own
    command line and grandparent separate a user double-clicking an installer from a script host chaining into a
    shell, which is the more common delivery route. Installer-wrapped delivery is one documented variant, so an
    msiexec.exe parent does not by itself make the launch routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the same parent instance spawn around the alert?
  context: >-
    A staging sequence usually shows more than the interpreter launch — directory creation, a download utility
    fetching the interpreter and the script, and sometimes a copy of a system tool being relocated before use.
    Siblings from the exact same parent instance reveal whether the interpreter launch is one step in a longer
    sequence or an isolated invocation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which script was the AutoIt3 interpreter handed, and from what directory did it run?
  context: >-
    The command line tells you which script ran, not what the script did — an .au3 argument is a compiled or
    obfuscated AutoIt script whose content lives on disk, not in the arguments. Read the script path and the working
    directory, then retrieve the .au3 file itself and examine it in a safe environment. Compiled AutoIt scripts
    carry an AU3!EA06 marker and loader variants prepend a long base64 blob that the script decodes into shellcode
    at runtime. A script staged next to the interpreter in a directory created moments earlier is a different
    finding from a script under a managed automation path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
  - safe_environment
- question: What files did the parent process write, and does that include the .au3 script and the interpreter itself?
  context: >-
    The script named on the interpreter's command line has an origin, and the parent that launched the interpreter
    is the first place to look for it. Scoping file events to the parent's own process identifier shows every file
    that process created — typically a new directory holding the interpreter, the .au3 script, and sometimes a
    relocated copy of a download utility. If the parent wrote none of them, the staging happened further up the
    chain and the grandparent's file activity is the next step.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
- question: Has this parent binary launched this interpreter on this host before?
  context: >-
    A parent-child pairing with a long history on the host points to an established automation or a product that
    bundles AutoIt. Zero or very low counts indicate the pairing is new, which for an interpreter running outside
    its install directory is the finding worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Does this host normally run the AutoIt3 interpreter at all, and under which accounts?
  context: >-
    This counts every execution of the binary on the host over 90 days regardless of parent or path, which
    establishes whether AutoIt is part of this host's normal software profile. A host with a steady history under a
    single account is likely running sanctioned automation; a host with no prior history is running the interpreter
    for the first time.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this user previously produced this rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day history
    of this specific pattern — the interpreter under one of the three parents, outside Program Files — rather than
    generic AutoIt use. A developer or automation owner may have a legitimate history here; a user with none is the
    deviation. Weigh the count against what this account is expected to run.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_proc:
      - Image|endswith: \Autoit3.exe
      - OriginalFileName: AutoIt3.exe
      selection_parent:
        ParentImage|endswith:
        - \cmd.exe
        - \KeyScramblerLogon.exe
        - \msiexec.exe
      filter_main_legit_autoit_location:
        Image|endswith:
        - :\Program Files (x86)\AutoIt3\AutoIt3.exe
        - :\Program Files\AutoIt3\AutoIt3.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven this rule's pattern here or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the behavior and the
    launch mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the
    alerting parent binary, so the result is the 90-day history of that parent driving this specific pattern. A
    parent already accounting for a large volume of prior events is packaged automation; a parent that is new for
    this pattern is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_proc:
      - Image|endswith: \Autoit3.exe
      - OriginalFileName: AutoIt3.exe
      selection_parent:
        ParentImage|endswith:
        - \cmd.exe
        - \KeyScramblerLogon.exe
        - \msiexec.exe
      filter_main_legit_autoit_location:
        Image|endswith:
        - :\Program Files (x86)\AutoIt3\AutoIt3.exe
        - :\Program Files\AutoIt3\AutoIt3.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user run across the environment around the time of the alert?
  context: >-
    Tracking the account's process activity across all hosts in the surrounding hour shows whether the same identity
    was active elsewhere at the same time. Delivery that reaches several recipients often produces the same staging
    sequence under several accounts in a narrow window. If the alert fired under SYSTEM or a machine account, expect
    this to return agent telemetry rather than a usable answer.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, a user-scoped sweep returns agent telemetry rather than the activity in question. The
    query mirrors the rule's selection structure scoped to the alerting parent binary, fleet-wide, in the alert
    window. Several hosts inside the same window points to a pushed or scheduled deployment; a single host points to
    a host-local trigger such as a file opened by the person at the keyboard.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_proc:
      - Image|endswith: \Autoit3.exe
      - OriginalFileName: AutoIt3.exe
      selection_parent:
        ParentImage|endswith:
        - \cmd.exe
        - \KeyScramblerLogon.exe
        - \msiexec.exe
      filter_main_legit_autoit_location:
        Image|endswith:
        - :\Program Files (x86)\AutoIt3\AutoIt3.exe
        - :\Program Files\AutoIt3\AutoIt3.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Is the same parent binary launching this interpreter on other hosts in the last day?
  context: >-
    The same launch pairing appearing across several hosts distinguishes a fleet-wide software rollout from activity
    confined to one endpoint. Where multiple hosts appear, compare the interpreter paths and script names across
    them — identical paths and script names suggest one distribution mechanism, while host-unique directory names
    suggest per-host staging.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host in the minutes around the alert?
  context: >-
    Aggregating parent-child pairings on the host collapses routine telemetry into high-count rows and leaves novel
    pairings visible at low counts. Look for the steps that bracket interpreter execution — a script host or shell
    starting shortly before, a download utility, or a process that becomes an injection target shortly after.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host often name the delivery step that preceded interpreter execution — an
    archive extracted from a message, a shortcut launching a batch script, a script host writing to a new directory,
    or a download utility being copied and renamed. Reading them in time order reconstructs how the interpreter and
    its script reached the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
