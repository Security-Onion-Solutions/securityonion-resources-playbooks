name: Potentially Suspicious Windows App Activity
id: 334477fd-f02d-45ee-8c0b-473e62070bfc
description: |
  Detects a process installed under C:\Program Files\WindowsApps\ (a Store / MSIX-packaged ".appx" application) spawning a child that is EITHER one of a set of script and command interpreters (cmd, cscript, mshta, powershell, powershell_ise, pwsh, regsvr32, rundll32, wscript) OR a process whose command line contains cmd /c, Invoke-, or Base64 — with Windows Terminal and the Sysinternals Suite packages excluded. Packaged Store apps run sandboxed and rarely shell out to interpreters, so this parent-child relationship is a clean signal that may indicate a rogue or trojanized .appx package, or a legitimate package abused to proxy command execution under its signed identity. The investigation should confirm which branch fired, decode what the child actually did, identify the package, and determine whether this app legitimately spawns this child on this host and for this user.
type: detection
detection_id: f91ed517-a6ba-471d-9910-b3b4a398c0f3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- question: Does this match the rule — a WindowsApps-packaged parent spawning a listed interpreter or a suspicious command line?
  context: Confirm the alert before investing time. The rule fires when the parent runs from C:\Program Files\WindowsApps\ AND the child EITHER ends in one of the listed interpreters (cmd, cscript, mshta, powershell, powershell_ise, pwsh, regsvr32, rundll32, wscript) OR has a command line containing cmd /c, Invoke-, or Base64 — and the Windows Terminal and Sysinternals packages are excluded. Note which branch fired, because a known interpreter as the child versus a suspicious command string determines what to decode next.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Which packaged app is this, is it expected to spawn this child, and what started the app?
  context: The parent-child relationship is the core signal. The parent path under WindowsApps identifies the package — read it to see whether this is a known, sanctioned Store app or something unfamiliar. Tracing the app's own origin shows whether the user launched it normally or it was started or driven in an unusual way. A trojanized or abused package still presents as the legitimate signed app, so the package identity, its command line, and its grandparent are where the abuse becomes visible.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is this user and host expected to run interpreters spawned by a packaged Store app?
  context: Some developer and IT workflows legitimately launch shells or helper scripts from packaged apps. Knowing whether this user's role and this host's function are consistent with that behavior is often the fastest way to separate a routine action from a rogue package. A developer workstation differs from a standard user endpoint where a Store app spawning powershell is anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the child process do? Decode its full command line and arguments.
  context: The full command line reveals the specific action. Decode any flags, encoded content, file paths, or URLs the child carried — the rule's own triggers (cmd /c, Invoke-, Base64) point to a shell one-liner, a PowerShell cmdlet invocation, or an encoded payload. Identify what the packaged app actually drove the interpreter to do.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If the child was PowerShell, was the command encoded or obfuscated, and what does it decode to?
  context: When the child is powershell.exe, pwsh.exe, or powershell_ise.exe, attackers frequently hide intent with -EncodedCommand (-enc), Base64 strings, concatenation, or backticks — and Base64 is one of this rule's own triggers. Decoding reveals the actual payload — a download cradle, a reverse shell, or in-memory execution of a .NET assembly. If the child was not PowerShell, this question does not apply.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script PowerShell actually executed, even when the command line is encoded or obfuscated, providing ground truth about what ran. If PowerShell operational logging is not collected in this environment, that absence is itself a visibility gap worth noting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host shortly before this execution?
  context: Attackers often disable or bypass PowerShell protections before running a payload — AMSI patching, execution-policy bypass, or a v2 downgrade that lacks logging. Finding these precursor events in the hour before the packaged app spawned the interpreter strengthens the case that the execution is malicious rather than incidental.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'AmsiScanBuffer'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What other child processes did this same packaged app instance spawn?
  context: If the package was trojanized or abused to proxy execution, the same parent instance likely spawned more than one child. Listing the siblings of the detected child reveals the full scope of activity initiated through this app — multiple suspicious children from one package strongly suggests orchestration rather than a one-off.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: How often has this packaged app spawned this child binary on this host before?
  context: Packaged Store apps very rarely shell out to interpreters, so historical frequency is a strong discriminator. Zero or very low counts for this specific app-to-child pairing indicate a novel spawning relationship worth chasing; a pairing that already accounts for many prior events is more likely a built-in helper behavior of a legitimate package.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|contains: C:\Program Files\WindowsApps\
      selection_susp_img:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      selection_susp_cli:
        CommandLine|contains:
        - cmd /c
        - Invoke-
        - Base64
      filter_optional_terminal:
        ParentImage|contains: :\Program Files\WindowsApps\Microsoft.WindowsTerminal
        ParentImage|endswith: \WindowsTerminal.exe
        Image|endswith:
        - \powershell.exe
        - \cmd.exe
        - \pwsh.exe
      filter_optional_sysinternals:
        ParentImage|startswith: C:\Program Files\WindowsApps\Microsoft.SysinternalsSuite
        Image|endswith: \cmd.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent and 1 of selection_susp_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|contains: C:\Program Files\WindowsApps\
      selection_susp_img:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      selection_susp_cli:
        CommandLine|contains:
        - cmd /c
        - Invoke-
        - Base64
      filter_optional_terminal:
        ParentImage|contains: :\Program Files\WindowsApps\Microsoft.WindowsTerminal
        ParentImage|endswith: \WindowsTerminal.exe
        Image|endswith:
        - \powershell.exe
        - \cmd.exe
        - \pwsh.exe
      filter_optional_sysinternals:
        ParentImage|startswith: C:\Program Files\WindowsApps\Microsoft.SysinternalsSuite
        Image|endswith: \cmd.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_susp_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity elsewhere, the scope is larger than a single host. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_parent:
        ParentImage|contains: C:\Program Files\WindowsApps\
      selection_susp_img:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      selection_susp_cli:
        CommandLine|contains:
        - cmd /c
        - Invoke-
        - Base64
      filter_optional_terminal:
        ParentImage|contains: :\Program Files\WindowsApps\Microsoft.WindowsTerminal
        ParentImage|endswith: \WindowsTerminal.exe
        Image|endswith:
        - \powershell.exe
        - \cmd.exe
        - \pwsh.exe
      filter_optional_sysinternals:
        ParentImage|startswith: C:\Program Files\WindowsApps\Microsoft.SysinternalsSuite
        Image|endswith: \cmd.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_susp_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the timeline that led to the packaged app spawning an interpreter.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
