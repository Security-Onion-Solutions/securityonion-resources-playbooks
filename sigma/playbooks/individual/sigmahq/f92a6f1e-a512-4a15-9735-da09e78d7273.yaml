name: GatherNetworkInfo.VBS Reconnaissance Script Output
id: 8bfc00b0-b421-4fc4-89c7-151ab19a7f68
description: |
  Detects creation of the output files that C:\Windows\System32\gatherNetworkInfo.vbs writes into
  C:\Windows\System32\config - Hotfixinfo.txt, netiostate.txt, sysportslog.txt, or VmSwitchLog.evtx. The script is a
  Microsoft-signed diagnostic component that enumerates event logs, services, network configuration, ARP tables, and
  hardware details in one pass, which makes it an attractive signed reconnaissance primitive: one invocation produces
  a pre-formatted host survey whose output blends in beside the registry hives. The same script also runs from a
  legitimate built-in scheduled task, and tampered systems have shipped that task with a secondary download action
  appended, so the investigation should determine what invoked the script, whether the task definition is unmodified,
  and whether the output was archived or transferred off the host.
type: detection
detection_id: f92a6f1e-a512-4a15-9735-da09e78d7273
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file match the gatherNetworkInfo.vbs output set this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact path against the rule's criteria - a file under
    C:\Windows\System32\config named Hotfixinfo.txt, netiostate.txt, sysportslog.txt, or VmSwitchLog.evtx - and note
    the writing process. These names are produced by the script's enumeration routines; one firing usually arrives
    with several sibling outputs in the same directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the invoking user expected to run system diagnostics on this host?
  context: Network and support staff occasionally run diagnostic collection during troubleshooting, and the script
    also fires from built-in automation under a service context. A standard user account behind the invocation - or
    any interactive account on a server with no open support case - shifts the weight toward post-compromise
    enumeration rather than maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Are the output files still on disk, or were they deleted after creation?
  context: The output files' post-alert lifecycle drives next steps. Files still present can be retrieved to see
    exactly what was enumerated; deletion shortly after creation - or after an archiving utility ran - is the cleanup
    signature of an operator who has already packaged the results and moved on.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What was the writing process doing when it produced the output files?
  context: The script is normally driven by cscript.exe with gatherNetworkInfo.vbs on the command line; the working
    directory and full arguments show whether it was launched by path from System32 (consistent with the built-in
    task) or from an unusual location or wrapper. A writer other than cscript.exe means something else is producing
    files with these names and deserves its own scrutiny.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What do the created output files contain, and what would the operator have learned?
  context: The output set is a pre-formatted host survey - hotfix inventory, network and port state, service lists,
    and event-log extracts. Retrieve the files from the endpoint and review them; what was collected defines the
    reconnaissance value obtained (patch level for exploit selection, reachable networks for lateral movement,
    security services for evasion planning) and therefore what the next attack stage would target.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What spawned the process that produced the output, and does that parent indicate the built-in task or a manual run?
  context: The parent is the single strongest discriminator for this detection. The built-in scheduled task launches
    the script under the task-scheduler service host, while hands-on abuse arrives from cmd.exe, powershell.exe, or a
    remote-execution host process. An interactive or remote-execution parent turns a routine diagnostic into
    post-compromise enumeration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What other files did the writing process create or delete around the alert?
  context: A full script run produces a burst of output files in the config directory over about a minute; a partial
    set can mean an interrupted run or a different tool mimicking the names. Watch also for writes outside the config
    directory - a staging copy or archive of the results in a user-writable path indicates collection for exfiltration.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were archiving or transfer utilities run on this host after the output was created?
  context: Collected recon output is only useful to an operator once packaged and moved. The living-off-the-land
    follow-on chain uses built-in utilities - makecab to bundle the text files, then certreq, bitsadmin, or curl to
    move data over HTTPS. Any of these executing within hours of the output creation connects the enumeration to a
    collection-and-exfiltration sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\makecab.exe'
          - '\certreq.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\7z.exe'
          - '\tar.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the GatherNetworkInfo scheduled task definition unmodified, and did a download utility run right after the script?
  context: The script ships with a built-in scheduled task, and compromised installations have been distributed with
    that task definition carrying an appended second action - a PowerShell command that fetches tasking from an
    external gateway with curl. Review PowerShell and curl activity in the window for download cradles, and inspect
    the task's definition on the endpoint for any action beyond the original script invocation.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\curl.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did other reconnaissance commands run on this host around the same time?
  context: The script already gathers most host facts in one pass, so an operator confident in it needs nothing else -
    but manual sessions commonly mix it with direct commands like whoami, net, nltest, or tasklist. Three or more
    distinct discovery binaries inside the window indicate hands-on or scripted enumeration beyond the built-in
    diagnostic.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What else has been written into the System32 config directory recently, and by which processes?
  context: This directory holds the registry hives and normally sees writes only from system components - which is
    precisely why recon output parked there blends in. Recent arrivals beyond the expected hive files and the script's
    own output set reveal whether the location is being used as a general staging area, and which processes are using
    it.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|startswith: 'C:\Windows\System32\config'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's output pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user - the result is the user's 90-day
    history of producing this exact output set, aggregated by host. Support staff who run diagnostics may show
    scattered history across machines they service; a user who has never produced it before, on a host they rarely
    touch, is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\config
        TargetFilename|endswith:
        - \Hotfixinfo.txt
        - \netiostate.txt
        - \sysportslog.txt
        - \VmSwitchLog.evtx
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's output pattern, or is the program new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute behavior - the launch
    mechanism does. The query mirrors the rule's selection scoped to the alerting program, giving the 90-day
    history of this program producing this output set. The built-in task's service-host program accounting for all
    prior events reads as OS automation; a new program for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\config
        TargetFilename|endswith:
        - \Hotfixinfo.txt
        - \netiostate.txt
        - \sysportslog.txt
        - \VmSwitchLog.evtx
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: If the invocation was hands-on, the same account's activity on other hosts in the surrounding hour reveals
    whether this is one stop in a wider enumeration sweep. The same user triggering diagnostics or discovery commands
    on multiple machines in a short window indicates systematic reconnaissance across the environment. When the
    account is a service principal, this view returns agent noise - judge from the parent-pattern fleet check instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven output pattern fire on other hosts in the same window?
  context: Under a service principal, the meaningful fleet question is whether the same launch mechanism produced the
    same output set elsewhere. Multiple hosts writing the output in the same window points to scheduled or pushed
    automation - the built-in task firing on its cadence or a coordinated rollout - while a single host points to a
    host-local trigger worth attributing.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\config
        TargetFilename|endswith:
        - \Hotfixinfo.txt
        - \netiostate.txt
        - \sysportslog.txt
        - \VmSwitchLog.evtx
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this output file been created before on this host?
  context: The built-in task produces these files on its own schedule, so a periodic creation history with the same
    writer and parent supports a routine diagnostic run. Zero prior history - or history whose writer and invocation
    context differ from today's - means this run is not part of the host's established pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Reconnaissance output rarely appears in isolation during an intrusion - initial-access tooling, privilege
    escalation, or staging activity typically lands in the same window. Aggregated parent-child pairs collapse
    repetitive agent noise into high-count rows while novel pairs stand out at low counts; those low-count novel pairs
    are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Host enumeration is typically an early post-access step, so earlier detections - initial execution,
    defense tampering, or credential access - may show how the operator arrived. The alert timeline on this host in
    the preceding hours helps place the reconnaissance inside a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
