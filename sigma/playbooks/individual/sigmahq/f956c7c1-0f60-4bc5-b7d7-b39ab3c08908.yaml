name: PktMon.EXE Execution
id: be10fa4d-92a0-47a3-8457-a86b40fb7e31
description: |
  Detects execution of pktmon.exe, the built-in Windows packet-capture utility, identified by image name or original filename. pktmon is a legitimate diagnostic tool for network troubleshooting, but it also provides an on-host packet sniffer that requires no additional software and can capture sensitive traffic — including plaintext credentials and session tokens — to an .etl file. Investigation should determine what the capture targeted, who ran it, whether the host and user normally perform packet capture, and what activity surrounded the execution.
type: detection
detection_id: f956c7c1-0f60-4bc5-b7d7-b39ab3c08908
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Does this process match the rule's pktmon detection — image ending in pktmon.exe or an original filename of PktMon.exe?
  context: Confirm the alert is a true positive by reviewing the process image and original filename against the rule's criteria. The original-filename match also catches a renamed pktmon binary, so verify both the on-disk name and the embedded original filename before investing further.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What did the capture target — which ports, protocols, or filters were configured on the pktmon command line?
  context: pktmon captures network traffic and can apply packet filters to focus on specific ports or protocols (for example 'pktmon filter add -p 445'). The command line reveals what traffic the operator was after; filters targeting authentication, file-sharing, or remote-access ports (such as 445, 21, 23, 389, 88) point at credential or data interception rather than routine diagnostics. A bare start with no filter captures everything on the wire.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned pktmon and is that parent chain expected?
  context: The parent process reveals how pktmon was invoked. Administrative use is typically launched from an interactive shell under explorer.exe or from a known management/automation process. Unusual parents such as mshta.exe, wscript.exe, powershell.exe download cradles, or Office applications point at scripted or hands-on-keyboard use rather than troubleshooting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did pktmon spawn afterward?
  context: Processes spawned by pktmon after launch reveal its actual impact. Legitimate capture sessions rarely spawn children; follow-on cmd.exe, powershell.exe, or copy/move of the resulting .etl file may indicate the operator is staging or exfiltrating the capture output.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run pktmon?
  context: A packet-capture tool that has never run on this host is more suspicious than one that runs regularly as part of diagnostics. Zero or very low historical counts over the past 90 days indicate first-time or rare execution and raise the priority of the investigation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pktmon pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a legitimately used capture tool has a normal launch profile. This query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how pktmon specifically has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \pktmon.exe
      - OriginalFileName: PktMon.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pktmon pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of pktmon executions matching the rule's pattern. Many hosts firing the same pattern points to scripted deployment or vendor automation; a single host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \pktmon.exe
      - OriginalFileName: PktMon.exe
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \pktmon.exe
      - OriginalFileName: PktMon.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \pktmon.exe
      - OriginalFileName: PktMon.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope may be larger than a single capture session.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \pktmon.exe
      - OriginalFileName: PktMon.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the capture, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or staging of captured data.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded the capture and help reconstruct the timeline. Packet capture is often a mid-chain action that follows initial access and enumeration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single diagnostic command may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession — whoami, ipconfig, net user, systeminfo — is a signature of post-compromise enumeration. Network capture alongside host and network discovery suggests an operator mapping the environment before moving to the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned pktmon, and is this a normal pattern?
  context: Legitimate capture is typically launched from cmd.exe or PowerShell spawned by explorer.exe (an admin opened a shell) or from a known automation script. pktmon spawned by unusual parents — Word or Excel macros, wscript.exe, mshta.exe, wmiprvse.exe, or wsmprovhost.exe — indicates remote or automated execution rather than hands-on troubleshooting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user and host expected to run packet-capture tooling?
  context: Network administrators and IT staff legitimately run pktmon for troubleshooting, and some hosts are dedicated to such diagnostics. Standard users and most servers rarely need on-host packet capture. The user's role and the host's function determine whether the activity is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be exposed by the captured traffic, and do any have elevated privileges?
  context: The severity depends on what the capture could have exposed. Traffic to or from domain controllers, authentication services, or sessions involving administrative accounts raises the risk of high-value credential exposure and may require incident escalation; capture confined to a standard user's own traffic is lower impact. Cross-reference the host's network role and the accounts active during the capture window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
