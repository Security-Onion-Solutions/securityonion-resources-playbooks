name: Potential Defense Evasion Activity Via Emoji Usage In CommandLine - 3
id: fc76b909-de52-49ea-b512-e507ea42020f
description: |
  Detects a process_creation event whose command line contains any one of a large list of emoji
  characters. Emoji are legal in a command line but carry no meaning for the interpreter, so their
  presence generally means the argument text was produced by something other than a person typing an
  ordinary command — an obfuscator that uses emoji as variable or function names, a payload that
  encodes data in non-ASCII characters, or a generator that pads arguments so that literal string
  matching fails. Benign sources are real, including chat and collaboration clients, localized
  installers, build and test tooling, and scripts that print status characters. The investigation
  should determine what the command does once the emoji are set aside, whether the parent chain
  explains how such a command line was assembled, and whether the same command line or the same
  account appears on other hosts.
type: detection
detection_id: f9578658-9e71-4711-b634-3f9b50cd3c06
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting command line actually contain one of the emoji characters this rule looks for?
  context: >-
    The rule fires on a single condition, a process_creation event whose CommandLine contains any one
    of the listed emoji characters. Read the raw command line and confirm the emoji sits in the
    argument text itself rather than in a rendered or truncated display field. If no emoji is present
    in the raw value, the match came from encoding or field handling rather than the behavior the
    rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run commands that carry emoji characters?
  context: >-
    A range of ordinary software emits emoji on a command line, including messaging clients,
    localized installers, package and build tooling, and scripts that print status characters.
    Establishing whether this host runs that class of software, and whether this account works with
    it, is normally the quickest way to separate routine output from a command line assembled with
    deliberate non-ASCII padding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What does the command actually do once the emoji characters are set aside?
  context: >-
    Read the remaining command the way the interpreter would. Emoji show up as variable and function
    names in obfuscated scripts, as delimiters splitting a payload into fragments concatenated at
    runtime, and as filler inserted between real tokens to break literal matching. Identify the
    binary being driven, the flags passed to it, any encoded or concatenated content, and any file
    path or network destination the command resolves to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this command, and is that parent chain expected?
  context: >-
    The parent shows how the argument text was assembled. A shell or script host started from
    explorer.exe fits a person or an interactive script, while an Office application, a mail client,
    an archive utility, or a script host running out of a temporary directory points to the command
    line arriving from off the host. Read the parent's own command line for the generator that
    produced the emoji-bearing arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What else did the same parent launch around this time?
  context: >-
    A generator that produces one obfuscated command line rarely produces only one. Listing every
    child of the same parent in the surrounding window shows whether this execution stands alone or
    is one step in a sequence the parent drove, and whether the sibling commands were built the same
    way as the alerting one.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    The children show what the command accomplished. Obfuscation wraps an action rather than being
    the action, so the payload usually surfaces as a script host, a download utility, an archive
    tool, or a second interpreter started by the alerting process. An obfuscated command line that
    spawns nothing is a different finding from one that starts a downloader.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the alerting process make any network connections?
  context: >-
    Non-ASCII padding is often applied to commands that retrieve a second stage or reach a
    controller, and the destination is frequently the part being hidden from literal matching.
    Connections made by the alerting process tie the command line to an external endpoint that can be
    compared against the destinations this host normally uses.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Did the alerting process write any files to disk?
  context: >-
    A command with obfuscated arguments commonly ends in a written artifact, such as a decoded
    script, an archive, a dropped executable, or a staging file in a user-writable directory. The
    written paths name the artifact to collect and give a second anchor for the investigation when
    the command line itself cannot be read directly.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
- question: Does this host normally run this binary at all?
  context: >-
    Historical frequency of the alerting binary on this host separates a tool that runs here daily
    from one that appeared for the first time today. A long and steady history under the same account
    points toward installed software that legitimately emits these characters, while zero or very low
    counts make the execution itself the finding regardless of what the arguments contain.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this exact command line run anywhere else in the environment?
  context: >-
    An identical command line across many hosts is the signature of deployed software or a packaged
    script and is usually explained by a deployment or inventory record. The same command line on a
    handful of unrelated hosts, or on this host only, points to something assembled locally rather
    than shipped in. The match is exact, so a generator that varies its padding on every execution
    returns only the alerting event.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|expand: '%CommandLine%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process and its parent in the surrounding window collapses routine agent and
    service telemetry into a few high-count rows while novel parent-child pairs stand out at low
    counts. Those low-count pairs are where reconnaissance, credential access, or persistence steps
    around this execution become visible.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    An obfuscated command line usually sits in the middle of a sequence rather than at its start.
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential
    access, place this execution in a timeline and often identify the delivery step that came before
    it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: What else did this user do across the environment around this time?
  context: >-
    Following the account across all hosts in the surrounding hour shows whether the activity stays
    on this endpoint or the same account is driving execution elsewhere. If the alert fired under a
    machine or service principal, this returns broad automation telemetry rather than the actions of
    a person, and the parent-driven view of the same window carries the meaningful answer.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same parent and binary pairing run on other hosts in this window?
  context: >-
    This pivots on the launching mechanism rather than the account, which is the attribution that
    survives when the alert fires under a machine or service principal. The same parent driving the
    same binary across several hosts in one window is the signature of a deployment or a scheduled
    job, while the pairing occurring only here points to something local to this endpoint.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this detection fired on other hosts recently?
  context: >-
    Counting this rule's own recent firings across the environment separates a persistent background
    source, meaning one application or script that routinely emits these characters and can be
    identified once and tuned, from an isolated occurrence on a single host. A first-of-its-kind
    firing carries different weight than one of hundreds.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
  answer_sources:
  - alert
