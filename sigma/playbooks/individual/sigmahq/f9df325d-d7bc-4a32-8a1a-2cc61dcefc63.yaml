name: Third Party Software DLL Sideloading
id: 0a25a038-8eb1-48e6-8f68-0728b1dc221c
description: |
  Detects a load of a third-party software DLL from outside its vendor's install directory - either commfunc.dll
  loading from any path other than the Lenovo Communications Utility directories (with Chrome's application directory
  also excluded), or tosbtkbd.dll loading from outside the Toshiba Bluetooth Stack directories. These library names
  are known sideloading candidates: an attacker places a malicious DLL with the expected name beside a copied,
  legitimately signed vendor executable, and the trusted binary loads and runs the attacker's code. The investigation
  should determine which branch fired, whether the loading executable and path correspond to a real installation,
  who wrote the DLL to that location, and what the process did after the load.
type: detection
detection_id: f9df325d-d7bc-4a32-8a1a-2cc61dcefc63
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Which sideloading branch fired - and does the module path fall outside the vendor's install directories?
  context: The rule fires on either of two distinct patterns - commfunc.dll loaded from any path outside the Lenovo
    Communications Utility program directories (Chrome's application directory is also excluded), or tosbtkbd.dll
    loaded from outside the Toshiba Bluetooth Stack program directories. Confirm the loaded module path (ImageLoaded)
    truly falls outside the excluded vendor paths, and note which DLL name fired - the vendor software it impersonates
    determines what a legitimate installation would look like in the later checks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is the impersonated vendor software actually installed on this host?
  context: These DLL names belong to Lenovo and Toshiba utilities. If the host is not that vendor's hardware and has no
    record of the utility in software inventory, there is no benign reason for the DLL name to exist at all - the load
    is a planted library by default. If the software is present but relocated to a non-standard path, the question
    becomes who moved it and why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Does your organization ever install vendor utilities outside their standard Program Files paths?
  context: The main false-positive class for path-based sideloading rules is legitimately relocated software -
    portable installs, migrated user profiles, or repackaged deployments that put vendor files in non-standard
    directories. If deployment tooling never does this, a vendor DLL in an unexpected path has no sanctioned
    explanation and the allow-listed install directories in the rule can be trusted as the complete legitimate set.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other modules did the loading process load, and are any from non-canonical or user-writable paths?
  context: A sideload victim usually loads the planted DLL from its own directory alongside otherwise normal system
    libraries. Review the process's full module list - additional libraries from the same unexpected directory,
    unsigned modules where signed ones are expected, or system DLL names resolving to non-system paths widen the
    finding from one planted file to a staged toolkit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What are the alerting DLL's signature status, hash, and threat-intel reputation?
  context: The load event itself carries the module's hash and code-signature fields. The genuine vendor DLL is signed
    by its vendor; a planted sideload payload is typically unsigned or carries an unrelated or invalid signature.
    Compare the hash against the legitimate DLL version from a known-good install, and submit it to threat
    intelligence - known loader families circulate under exactly these library names.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What executable loaded the DLL, and what do its command line and working directory show?
  context: In the sideloading pattern the loading executable is usually a legitimately signed vendor binary copied to
    the same directory as the planted DLL - the signature is what lets the pair slip past allow-listing. The
    executable's own path, command line, and working directory show whether it is running from a real install
    location or from a user-writable staging directory next to the module it loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: When was the DLL written to this path, and by which process?
  context: The planted library had to arrive before the load. The file history for this module path shows the write
    that staged it - a browser download, archive extractor, or another payload writing the DLL minutes before the
    load closes the delivery-to-execution loop, while a months-old write by an installer supports a relocated-software
    explanation. The write event also identifies whether the signed host executable was copied in at the same time.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What spawned the loading executable, and is that chain expected?
  context: How the sideload victim started reveals the trigger - explorer.exe from a user double-click, a persistence
    mechanism launching it at logon, or another payload starting it programmatically. Vendor utilities normally start
    from services or the shell at session start; a script host, Office process, or unfamiliar executable as parent
    points to deliberate staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What files did the loading process touch after the module loaded, and is the DLL still on disk?
  context: Once the planted DLL is loaded, the trusted process is running attacker code - its subsequent file activity
    is payload behavior. Watch for dropped executables, staged archives, or deletion of the DLL itself as cleanup.
    Retrieve the module from the ImageLoaded path while it remains on disk for hashing and sandbox analysis.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the loading process modify the registry after the load?
  context: Code running inside the hijacked process commonly anchors itself - run keys, service configuration, or
    application-path values that ensure the signed host binary launches again from the staged directory at next
    logon. Registry writes by the loading process in the surrounding window show whether the sideload established
    persistence beyond the single execution.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has this DLL been loaded on this host before, and under what processes?
  context: A relocated-but-legitimate utility produces a long history of the same module loading under the same
    executable. A first-ever load - or a history in which the module previously loaded only from the vendor's install
    path - marks the alerting load as the deviation. The loading-process breakdown shows whether one consistent binary
    or a shifting set has been loading it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the loading executable?
  context: The signed vendor binary in a sideload pair is often making its first-ever appearance on the host - copied
    in purely to host the malicious library. Zero or very low execution history for the loading executable, especially
    when the impersonated software has no install record, fits staging; a long regular history under the same user
    fits installed software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is this DLL being loaded on other hosts, and under what processes?
  context: Fleet distribution separates an enterprise software footprint from a spreading toolkit. The same module
    loading from vendor install paths on many hosts is the product's normal presence; the same name loading from
    scattered non-standard directories, or under varied loading processes, indicates the sideload pair being staged
    on multiple machines.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were other persistence mechanisms installed on this host around the alert?
  context: A sideload that executed attacker code often stacks additional footholds - scheduled tasks, services, or
    registry autoruns configured through the standard tools. Persistence-tool executions in the hours around the
    load reveal whether the operator anchored more than the hijacked application itself; service-path changes
    pointing into the staged directory are the tell that connects them to the sideload.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to startup or run-key persistence locations on this host?
  context: File-based persistence bypasses tool-based detection entirely - a shortcut or copy of the signed
    host executable in a Startup folder relaunches the sideload pair at every logon without touching schtasks or
    reg.exe. File writes to these locations in the surrounding hours widen the persistence picture beyond the
    process-based checks.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: A sideload execution is usually one link in a delivery chain - an archive being unpacked, a copied binary
    launched, follow-on payloads starting. Aggregated parent-child pairs collapse repetitive agent noise into
    high-count rows while novel pairs stand out at low counts; those low-count novel pairs are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: The staging steps before a sideload - download of the DLL-and-executable pair, archive extraction, or
    earlier execution alerts - frequently trip their own rules. The preceding alert timeline on this host helps
    reconstruct how the pair arrived and whether this load is part of a longer sequence already in progress.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
