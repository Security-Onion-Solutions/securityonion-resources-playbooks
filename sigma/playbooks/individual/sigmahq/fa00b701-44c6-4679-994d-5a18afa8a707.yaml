name: PUA - AdvancedRun Suspicious Execution
id: 591121b1-82be-4408-81c2-0f315504fceb
description: |
  Detects AdvancedRun (a NirSoft utility) launched with /EXEFilename and /CommandLine arguments combined with a /RunAs value
  of 8, 4, 10, or 11 — the codes that run the target binary as TrustedInstaller, SYSTEM, or another high-integrity context.
  AdvancedRun has legitimate administrative uses, but the same invocation is reused to escalate to SYSTEM or TrustedInstaller
  and then disable security tooling or run privileged commands. The rule fires only when both the /EXEFilename + /CommandLine
  pattern AND one of the elevated /RunAs codes are present. Investigation should confirm the exact target binary and arguments
  it elevated, identify who or what invoked AdvancedRun, and determine whether any defense-tampering or follow-on privileged
  activity accompanied the elevation.
type: detection
detection_id: fa00b701-44c6-4679-994d-5a18afa8a707
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show AdvancedRun launching a target binary as SYSTEM or TrustedInstaller?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the command
    line carries both the /EXEFilename plus /CommandLine pair AND one of the elevated /RunAs codes (4 = SYSTEM, 8 = TrustedInstaller,
    10 or 11 = other elevated contexts). Read the full command line and confirm which target binary and arguments were set
    to run, and which /RunAs code was requested.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to elevate binaries to SYSTEM or TrustedInstaller with a privilege tool?
  context: Legitimate administration occasionally runs binaries under SYSTEM or TrustedInstaller, but it is normally confined
    to specific admin accounts and management hosts. If the account or endpoint has no role that would justify token elevation
    via a third-party utility, the disposition shifts toward operator misuse or compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is AdvancedRun on the organization's approved software list for this host?
  context: AdvancedRun is a NirSoft potentially-unwanted utility whose purpose is to launch programs under a chosen security
    context. Many organizations do not sanction it on production endpoints. If it is not on the approved software list for
    this host, treat the presence of the binary itself as a finding regardless of who ran it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket or maintenance window that explains a privileged elevation on this host right now?
  context: Sanctioned use of an elevation utility usually maps to a documented task — a software install, a registry repair,
    or a maintenance window. If no approved work explains an elevation to SYSTEM or TrustedInstaller on this host at this time,
    the activity may be unauthorized operator action or attacker preparation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What target binary and arguments did AdvancedRun elevate, and which /RunAs context was requested?
  context: The full command line reveals what was actually elevated. Read the /EXEFilename value (the program being launched),
    the /CommandLine value (the arguments handed to it), and the /RunAs code (4 = SYSTEM, 8 = TrustedInstaller, 10 or 11 = other
    elevated contexts). A privileged shell, a service-control command targeting security services, or a recursive delete of
    a protected directory are all high-concern targets; a benign system utility is less so.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - /EXEFilename
          - /CommandLine
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process invoked AdvancedRun, and is that parent chain expected?
  context: The parent process shows how the elevation was triggered. An interactive shell, a script host (wscript.exe, cscript.exe,
    powershell.exe), or an Office application as the parent points to hands-on operator activity or a malicious dropper; a known
    deployment agent points to managed automation. Walk up the parent chain to see what launched the invoker.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What processes started on this host in the elevated context shortly after the alert?
  context: >-
    AdvancedRun launches its target through a helper service, so the elevated child runs as
    SYSTEM or TrustedInstaller rather than as a direct child of AdvancedRun, and no parent pivot
    will find it. This is an aggregated survey of what started on the host after the alert:
    routine service and agent activity collapses into familiar high-count rows, while a novel
    image running under SYSTEM or at System integrity — especially service-control, registry,
    PowerShell, or file-deletion tooling matching the /EXEFilename target from the command line
    — stands out at low counts. Pivot to the raw events on any suspect row to recover its full
    command line.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
      - IntegrityLevel
- question: Has this host run AdvancedRun with an elevated /RunAs context before?
  context: A privilege-elevation invocation that has never been seen on a host is more suspicious than one that recurs as part
    of a known process. Zero or very low historical counts of this AdvancedRun pattern indicate first-time or rare use on this
    endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - /EXEFilename
          - /CommandLine
      condition: selection
    fields:
      - User
- question: When this host has previously fired this AdvancedRun elevation pattern, what parents and users drove it, and does
    the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution reflects how
    this specific elevation pattern — not generic AdvancedRun usage — has historically run here. A new parent process, an unexpected
    account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - /EXEFilename
        - /CommandLine
      selection_runas:
      - CommandLine|contains:
        - ' /RunAs 8 '
        - ' /RunAs 4 '
        - ' /RunAs 10 '
        - ' /RunAs 11 '
      - CommandLine|endswith:
        - /RunAs 8
        - /RunAs 4
        - /RunAs 10
        - /RunAs 11
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - /EXEFilename
        - /CommandLine
      selection_runas:
      - CommandLine|contains:
        - ' /RunAs 8 '
        - ' /RunAs 4 '
        - ' /RunAs 10 '
        - ' /RunAs 11 '
      - CommandLine|endswith:
        - /RunAs 8
        - /RunAs 4
        - /RunAs 10
        - /RunAs 11
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - /EXEFilename
        - /CommandLine
      selection_runas:
      - CommandLine|contains:
        - ' /RunAs 8 '
        - ' /RunAs 4 '
        - ' /RunAs 10 '
        - ' /RunAs 11 '
      - CommandLine|endswith:
        - /RunAs 8
        - /RunAs 4
        - /RunAs 10
        - /RunAs 11
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action across multiple endpoints.
    If the same account triggered similar elevation activity on other hosts in the same window, the scope of the operation may
    be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - /EXEFilename
        - /CommandLine
      selection_runas:
      - CommandLine|contains:
        - ' /RunAs 8 '
        - ' /RunAs 4 '
        - ' /RunAs 10 '
        - ' /RunAs 11 '
      - CommandLine|endswith:
        - /RunAs 8
        - /RunAs 4
        - /RunAs 10
        - /RunAs 11
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    the elevation, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, additional privilege
    escalation, or persistence being installed.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or defense
    tampering — may reveal the attack stages that preceded the elevation and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this AdvancedRun elevation pattern in the past week, and does the distribution look like automation
    or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    elevation pattern rather than generic AdvancedRun usage. Many hosts firing the same pattern points to scripted deployment
    or managed tooling; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains:
        - /EXEFilename
        - /CommandLine
      selection_runas:
      - CommandLine|contains:
        - ' /RunAs 8 '
        - ' /RunAs 4 '
        - ' /RunAs 10 '
        - ' /RunAs 11 '
      - CommandLine|endswith:
        - /RunAs 8
        - /RunAs 4
        - /RunAs 10
        - /RunAs 11
      condition: all of selection*
    fields:
    - host.name
- question: Was a new process granted SYSTEM or TrustedInstaller privileges on this host around the alert time?
  context: Token-creation elevation produces a new process whose security context differs from its parent — a child running
    with sensitive privileges or a logon context that does not match the invoking account. Privileged-logon and new-process
    records around the alert window confirm whether the elevation actually produced a SYSTEM or TrustedInstaller process and
    identify which binary received that context. If privileged-logon and detailed process records are not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing was elevated.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - SubjectUserName
      - TargetUserName
      - PrivilegeList
