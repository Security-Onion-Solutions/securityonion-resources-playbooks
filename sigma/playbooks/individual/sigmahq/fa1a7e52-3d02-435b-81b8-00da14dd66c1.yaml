name: Diskshadow Script Mode - Execution From Potential Suspicious Location
id: 42ff5b90-9b69-4cef-9487-db889161a430
description: |
  Detects diskshadow.exe (a Microsoft-signed System32 VSS administration LOLBin) running in script mode via the "-s"/"/s" flag where the script path lives in a user-writable or staging directory such as a Temp, AppData, ProgramData, or Users\Public folder. The rule fires only when all three conditions hold together - the diskshadow image or original filename, the script-mode switch, and a suspicious script-file location. Legitimate backup automation normally references scripts under fixed administrative paths, so a script driven from these locations is the deviation worth investigating. Diskshadow script mode can mount volume shadow copies to read locked files like NTDS.dit or registry hives, delete shadow copies to inhibit recovery, or proxy-execute arbitrary binaries via the exec sub-command under the diskshadow.exe parent, so determine what the script instructed and what child processes resulted.
type: detection
detection_id: fa1a7e52-3d02-435b-81b8-00da14dd66c1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show diskshadow.exe run in script mode with the script located in a user-writable directory?
  context: Confirm the alert is a true positive by reviewing the exact command line against the rule's criteria - the diskshadow image or original filename, the script-mode switch (-s or /s), and a script-file path under a Temp, AppData, ProgramData, or Users\Public location. All three must be present together for the rule to fire.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run diskshadow.exe and perform volume shadow copy operations?
  context: Diskshadow.exe ships on Windows Server and is used by backup operators and administrators; its presence and use on a workstation or by a non-admin account is unusual. Knowing whether the account role and host function involve VSS administration is often the fastest way to separate routine backup work from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the diskshadow script instruct - read the full command line and identify the script path and any inline switches?
  context: The command line names the script file diskshadow executed; retrieve it and, where possible, read the script contents to identify the sub-commands. Look for expose (mounts a shadow copy as a drive letter to read NTDS.dit, SAM, SYSTEM, or SECURITY hives), exec (launches an arbitrary local binary under the diskshadow.exe parent), and delete shadows or revert (inhibits recovery). The script path and any quoted arguments distinguish a routine backup script from one staging credential theft or destruction.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned diskshadow.exe, and is that parent chain expected for backup activity?
  context: The parent process reveals how diskshadow was invoked. Backup automation and interactive administration produce predictable parents (a scheduling service, an admin shell launched from explorer.exe). A parent such as cmd.exe spawned from a script, wscript.exe, mshta.exe, or an Office application points to scripted or operator-driven abuse rather than a maintenance task.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did diskshadow.exe spawn afterward?
  context: The diskshadow exec sub-command runs an arbitrary local binary as a child of diskshadow.exe, letting an operator hide execution as a backup step and inherit the legitimate process tree. Children such as cmd.exe, powershell.exe, robocopy.exe, or reg.exe - especially copying out of a mounted shadow path or saving registry hives - indicate credential theft or staging rather than a clean snapshot.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run diskshadow.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution; a host with no backup role that suddenly runs diskshadow is the anomaly. Use the user breakdown to judge whether the activity matches a known backup service account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this diskshadow script-mode pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific script-mode-from-suspicious-location pattern has historically run here - not generic diskshadow usage. A new parent process, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_cli:
        CommandLine|contains|windash: '-s '
      selection_paths:
        CommandLine|contains:
        - :\Temp\
        - :\Windows\Temp\
        - \AppData\Local\
        - \AppData\Roaming\
        - \ProgramData\
        - \Users\Public\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this diskshadow script-mode pattern in the past week, and does the cross-host spread look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this specific firing pattern rather than generic diskshadow usage. Many hosts firing the same pattern points to scripted deployment or a backup-tooling rollout; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_cli:
        CommandLine|contains|windash: '-s '
      selection_paths:
        CommandLine|contains:
        - :\Temp\
        - :\Windows\Temp\
        - \AppData\Local\
        - \AppData\Roaming\
        - \ProgramData\
        - \Users\Public\
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_cli:
        CommandLine|contains|windash: '-s '
      selection_paths:
        CommandLine|contains:
        - :\Temp\
        - :\Windows\Temp\
        - \AppData\Local\
        - \AppData\Roaming\
        - \ProgramData\
        - \Users\Public\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_cli:
        CommandLine|contains|windash: '-s '
      selection_paths:
        CommandLine|contains:
        - :\Temp\
        - :\Windows\Temp\
        - \AppData\Local\
        - \AppData\Roaming\
        - \ProgramData\
        - \Users\Public\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or action spanning multiple endpoints. If the same user drove similar diskshadow or shadow-copy activity on other hosts, the scope may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_cli:
        CommandLine|contains|windash: '-s '
      selection_paths:
        CommandLine|contains:
        - :\Temp\
        - :\Windows\Temp\
        - \AppData\Local\
        - \AppData\Roaming\
        - \ProgramData\
        - \Users\Public\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the event reveals what led to it and what followed - reconnaissance, privilege escalation, credential staging, or recovery-inhibition steps that provide broader context. Novel parent-child pairs at low counts are what to scan for against the high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering, reconnaissance, or credential access - may reveal the attack stages that preceded this event and help reconstruct the timeline leading up to the shadow-copy activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other recovery-inhibition or shadow-copy LOLBins used on this host recently?
  context: Operators who abuse one VSS or persistence LOLBin often use several. Diskshadow's delete-shadows and revert behaviors overlap with vssadmin, wbadmin, bcdedit, and wmic shadowcopy delete; finding multiple tools driving the same recovery-inhibition or shadow-copy objective strengthens the case for malicious activity. The diskshadow.exe detected by this rule is excluded from the list to avoid redundancy.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wbadmin.exe'
          - '\bcdedit.exe'
          - '\wmic.exe'
          - '\esentutl.exe'
          - '\reg.exe'
          - '\schtasks.exe'
          - '\sc.exe'
          - '\dnscmd.exe'
          - '\net.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was diskshadow.exe executed from its expected System32 path?
  context: Diskshadow.exe normally lives in %SystemRoot%\System32. A diskshadow process running from a user-writable or staging directory may have been copied or renamed to evade path-based allowlists. Compare the Image path against the expected System32 location and confirm the OriginalFileName still reports diskshadow.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this diskshadow script-mode pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific script-mode-from-suspicious-location pattern, not generic diskshadow usage. The command-line projection lets the analyst compare typical script paths and switches against the alerting invocation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: diskshadow.exe
      - Image|endswith: \diskshadow.exe
      selection_cli:
        CommandLine|contains|windash: '-s '
      selection_paths:
        CommandLine|contains:
        - :\Temp\
        - :\Windows\Temp\
        - \AppData\Local\
        - \AppData\Roaming\
        - \ProgramData\
        - \Users\Public\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
