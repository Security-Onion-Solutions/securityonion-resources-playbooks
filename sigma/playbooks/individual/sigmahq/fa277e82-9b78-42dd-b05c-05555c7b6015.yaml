name: Enable Local Manifest Installation With Winget
id: d260fba9-e20c-47a3-976e-5afd869111cb
description: |
  Detects a registry write enabling the AppInstaller (winget) local-manifest policy - a DWORD 1 written to a value
  ending in \AppInstaller\EnableLocalManifestFiles. With this policy on, winget will install packages from custom
  local manifest files, letting an operator deliver arbitrary software through a trusted, signed package manager
  without going through the configured repository's verification. Administrators and developers sometimes enable it
  for testing or private packages, so the investigation should establish who made the change, whether it was
  sanctioned, and whether winget was subsequently used to install anything from a local manifest.
type: detection
detection_id: fa277e82-9b78-42dd-b05c-05555c7b6015
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry write enable the winget local-manifest policy as this rule detects?
  context: Confirm the alert is a true positive - the TargetObject must end in \AppInstaller\EnableLocalManifestFiles
    and the Details must be DWORD (0x00000001), the enabled state. A write of 0 is the policy being turned off and
    reads as remediation rather than exposure. Note the writing process for the attribution steps.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to change application-installer policy?
  context: Developers packaging private software and administrators testing deployments are the legitimate audience
    for local-manifest installation. A standard user's session enabling an installer policy - or the change landing
    on a server with no development role - has no routine explanation. User attribution is present on most endpoint
    registry events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket or documented approval for enabling local manifest installation?
  context: Installer-policy changes on managed endpoints normally arrive through group policy or documented
    configuration work. A corresponding ticket or deployment record closes the alert quickly; an undocumented policy
    loosening on a single host - especially one that reduces package verification - deserves the full attribution
    trail.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall enabling this winget policy?
  context: The stated false-positive path for this detection is a developer or admin enabling local manifests for
    testing or private packages - direct confirmation is the fastest closer. If they recall it, capture why and for
    how long the loosened policy is needed; if they do not, treat the session as potentially operated by someone
    else and continue with the execution checks.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly was written to the AppInstaller policy key, and by which process?
  context: This value governs whether winget accepts custom local manifests instead of only repository-verified
    packages - it is a delivery-control policy, not a persistence location itself. The writing process carries the
    intent - group-policy processing writing it reads as managed configuration, reg.exe or PowerShell from an
    interactive session reads as a hands-on change, and an unfamiliar executable writing installer policy reads as
    tooling preparing its own delivery channel.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What spawned the process that wrote the policy value?
  context: The parent chain distinguishes the change's origin - a group-policy or management-agent lineage indicates
    pushed configuration, an interactive shell under explorer indicates a hands-on user, and a script host or freshly
    dropped executable in the chain indicates automation preparing the host for a follow-on install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was winget executed on this host after the policy was enabled?
  context: The policy only matters once used. Review winget invocations in the following hours for local-manifest
    installs - command lines carrying -m or --manifest point at a custom manifest file, and that file path names the
    package the operator delivered outside repository verification. No winget execution after the change leaves the
    exposure configured but unused.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\winget.exe'
          - '\AppInstallerCLI.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files did winget or the App Installer write after the policy change?
  context: A local-manifest install leaves the delivered package on disk - executables and support files written by
    the App Installer processes show exactly what was installed and where. Anything landing outside the standard
    package directories, or an executable that then appears in later process activity, becomes its own artifact to
    verify.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains:
          - '\winget.exe'
          - '\Microsoft.DesktopAppInstaller_'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: An operator loosening one installer control often adjusts several settings together - other AppInstaller
    policy values, trust or verification settings, or security tool configuration. Clusters of registry writes from
    the same process within the window show whether this was a single deliberate toggle or part of a broader
    reconfiguration of the host's defenses.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this policy value been modified before on this host?
  context: A development machine where local manifests are periodically toggled shows prior writes to this value,
    supporting the testing explanation. A first-ever write - particularly a bare enable with no matching disable
    afterward - marks a fresh change to the host's package-verification posture worth attributing fully.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that wrote the policy value?
  context: If the writer is a management agent or group-policy component, regular history is expected and the change
    is likely pushed configuration. If the writer is reg.exe, PowerShell, or an unfamiliar binary with little or no
    history on this host, the change was made outside the normal management path and needs the human-confirmation
    answers to stand on their own.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was the local-manifest policy enabled on other hosts?
  context: The same value appearing across many hosts in the same window indicates a group-policy rollout - verify it
    with the change record. The value appearing on only this host, or trickling across a few hosts with different
    writing processes, reads as either one developer's testing or an operator repeating a preparation step as they
    move through the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were persistence mechanisms installed on this host around the policy change?
  context: Enabling an unverified install channel is preparation; what follows is usually the point. Executions of
    the standard persistence tools in the hours around the change - scheduled tasks, services, run-key writes -
    reveal whether a package delivered through the loosened policy anchored itself on the host.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to startup or run-key persistence locations on this host?
  context: A package installed from a local manifest can plant persistence purely through its payload files - a drop
    into a Startup folder relaunches it at logon without any persistence tool running. File writes to these locations
    in the surrounding hours catch that quieter path.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: A policy change made in preparation for delivery is usually surrounded by the rest of the sequence -
    manifest files being written, winget launching, installed payloads starting. Aggregated parent-child pairs
    collapse repetitive agent noise into high-count rows while novel pairs stand out at low counts; those low-count
    novel pairs are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: A configuration loosening mid-intrusion typically follows initial access and precedes payload delivery.
    Earlier detections on this host - execution alerts, defense tampering, or download activity - help place the
    policy change inside a longer sequence and identify what led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
