name: Network Communication With Crypto Mining Pool
id: d0f5d907-20a5-4196-8f05-1a6bd6aa2fc9
description: |
  Detects outbound network connections to known cryptocurrency mining pool hostnames - a large catalogue of Monero and
  multi-coin pool endpoints including miner donation and update hosts. Unauthorized mining on enterprise hardware
  follows a compromise or an insider install: a miner binary or script runs persistently, holds a long-lived
  connection to a pool, and consumes CPU for someone else's benefit. False positives are unlikely, so the
  investigation should identify the connecting program and its wallet configuration, how it arrived and persists,
  and which other hosts are mining for the same operation.
type: detection
detection_id: fa5b1358-b040-4403-9868-15f7d9ab6329
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Do the destination and direction match what this rule detects, an outbound connection to a mining pool host?
  context: Confirm the alert by reviewing the destination against the rule's mining-pool hostname catalogue and the
    direction (an initiated, outbound connection). The alerting event may come from network-level telemetry with no
    process attribution attached - if process fields are empty, the endpoint-side questions pivot through the
    connection's host and destination instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
- question: Is there any sanctioned reason for this host to reach a mining pool?
  context: Legitimate mining traffic is essentially absent from enterprise environments - the plausible benign cases
    are a researcher's sandbox or a personal miner on an employee device, both of which are policy questions rather
    than false positives. Establish the host's role and owner; on a server the connection has no innocent reading.
    If the network event carries no process or user fields, judge from host function and the process-side questions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What program made the pool connection, and what does its command line reveal?
  context: Miner command lines are self-documenting - look for a pool URL (stratum+tcp or stratum+ssl), a -u or
    --user wallet address, and throttle flags like --donate-level or CPU thread limits. The wallet address is the
    strongest pivot for scoping the operation, and the binary's path shows whether it runs from a user-writable
    staging directory or hides under a system-sounding name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What do the pool endpoint and port reveal about the mining setup?
  context: The destination hostname identifies the pool and often the coin; the port carries signal too - stratum
    mining commonly rides ports like 3333, 4444, 5555, or 14444, and TLS variants blend into 443. Donation and
    update hosts for common miner software in the catalogue indicate the miner is running with default settings,
    which points to a dropped stock build rather than a customized one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What spawned the connecting process, and is that chain expected?
  context: How the miner starts tells the deployment story - a service or scheduled-task lineage means installed
    persistence, a shell under an interactive session means hands-on installation, and a web-server or database
    worker process as ancestor means the host was compromised through an exposed service and the miner is the
    monetization stage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did known mining tools or stratum-configured command lines execute on this host?
  context: The connection is one half of the pattern; the executing tool is the other. This sweep matches common
    miner binaries by name and any process whose command line carries a stratum pool URL or the donate-level flag,
    catching renamed binaries whose arguments still betray them. Sustained high CPU over 15 minutes or more alongside
    such an execution completes the resource-hijacking picture - check the host's utilization telemetry where
    available.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\xmrig.exe'
          - '\nbminer.exe'
          - '\xmr-stak.exe'
          - '\minerd.exe'
          - '\nicehash.exe'
          - '\ethminer.exe'
      selection_cli:
        CommandLine|contains:
          - 'stratum+tcp://'
          - 'stratum+ssl://'
          - '--donate-level'
          - '--cpu-max-threads-hint'
      condition: selection and (selection_img or selection_cli)
    fields:
      - Image
      - CommandLine
- question: Which hosts resolved mining pool domains, and which processes performed the lookups?
  context: Hostname fields on connection events are sparsely populated, so the DNS lookups are the reliable
    domain-side record. This fleet-wide sweep over the rule's full pool-domain catalogue shows every resolving host
    and the querying process on each - one host resolving one pool is an isolated install, while many hosts
    resolving the same pool with the same process name is a deployed mining operation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
