- question: What does the connection pattern to this pool endpoint look like?
  context: Pool mining holds a long-lived session or reconnects on a steady cadence as jobs are issued - a
    persistent or regularly re-established connection distinguishes an active miner from a one-off probe. Multiple
    processes connecting to the same endpoint, or connections resuming immediately after interruption, show the
    miner is supervised by a watchdog or service.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: What files did the connecting process write on this host?
  context: Miner deployments leave a small file footprint - the binary itself, a JSON or text config carrying the
    pool and wallet, and often a watchdog script or renamed copy. The connecting process's file activity locates
    that kit; config files are worth retrieving since they hold the wallet and pool list for scoping.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Does this host normally communicate with this destination?
  context: A mining pool appearing in a host's traffic for the first time bounds the infection window - combined
    with the process's start time it tells you when mining began. A months-long history means the miner has been
    resident and unnoticed, which widens the persistence and lateral checks accordingly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run the connecting program?
  context: Miners either appear as brand-new executables or masquerade under system-sounding names that have
    surprisingly short histories. Zero or recent-only execution history for the connecting binary marks the install
    date; a long history under a legitimate name argues the connection came from an injected or trojanized component
    instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is the same executable running on other hosts?
  context: Mining campaigns monetize scale - the same binary deployed across many machines multiplies the return.
    Other hosts running the connecting executable, especially with similar paths and start times, define the
    deployment's footprint and usually share the same delivery vector worth closing.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith|expand: '%Image%'
      filter_self:
        host.name|expand: '%hostname%'
      condition: selection and not filter_self
    fields:
      - host.name
- question: What other activity has this user performed across the network?
  context: >-
    If the miner runs under a real user account, that account's cross-host activity in the
    window shows If the alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine
    account (name ending in $), this query intentionally returns nothing — every host runs those
    principals constantly, so a fleet-wide pivot on them is noise, not an actor trail; use the
    program- and host-scoped questions instead.

    whether the same operator is installing on other machines. When the account is a service principal or the
    network event carries no user, this view degenerates into agent noise - lean on the executable-based fleet
    sweep instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: Do other hosts communicate with this same pool endpoint?
  context: The connection-side complement to the DNS sweep - every host reaching this specific pool address over the
    past week, with ports and connecting processes. Pool endpoints resolve to shifting addresses, so treat this as a
    lower bound and rely on the domain-resolution sweep for full coverage.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - DestinationPort
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Miner deployments arrive with their support acts - droppers, persistence installation, defense tampering
    to keep CPU alarms quiet. Aggregated parent-child pairs collapse repetitive agent noise into high-count rows
    while novel pairs stand out at low counts; those low-count novel pairs are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Mining is a monetization stage - it typically follows initial compromise, privilege escalation, and
    persistence, any of which may have tripped earlier rules. The preceding alert timeline on this host
    reconstructs how the miner arrived and what else the same access was used for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
