name: Rar Usage with Password and Compression Level
id: e8ec8b6d-b0f3-486d-946f-4efee682d948
description: |
  Detects a command line that invokes the RAR archiver with a password flag (' -hp' for header-plus-content
  encryption) together with either a compression-level flag (' -m') or the add-to-archive command (' a '). This
  flag combination is the canonical pattern operators use to stage collected data for exfiltration: header
  encryption hides even the filenames inside the archive, and high compression packs data to fit size-limited
  exfil channels. Legitimate command-line WinRAR use and other tools sharing these switch names produce the same
  pattern, so the investigation must establish what data was archived, who ran the tool, whether the encrypted
  output was moved or sent off-host, and whether the activity fits normal use of this binary on this host.
type: detection
detection_id: faa48cae-6b25-4f00-a094-08947fef582f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting command line invoke RAR with a password flag plus a compression-level flag or the add command?
  context: >-
    Confirm this is a true positive before investing time. The rule fires when the command line contains ' -hp'
    (header-plus-content encryption) together with either ' -m' (compression level) or ' a ' (add to archive).
    Read the full command line and verify both the password flag and the compression/add token are present, and
    that the executable is actually an archiver rather than an unrelated tool that reuses these switch names.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to create password-protected, compressed archives from the command line?
  context: >-
    Legitimate administrative or backup activity can produce the same flag combination. Command-line archiving
    with header encryption is uncommon for ordinary users but may be routine for backup operators, developers, or
    automated packaging jobs. Knowing whether the user role and host function fit command-line archiving is often
    the fastest way to separate routine work from staging for exfiltration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this archiving command do? Decode every flag, password switch, and source path on the command line.
  context: >-
    The full command line reveals the operation. Decode the compression level (' -m0' through ' -m5'; ' -m5' is
    best compression and signals care over output size for a size-limited channel), the password switch (' -hp'
    encrypts headers and content; ' -p' encrypts content only), and anti-forensics or stealth switches such as
    ' -df' (delete source files after archiving), ' -v' (split into multi-volume parts), ' -sfx' (build a
    self-extracting executable), ' -y'/' -idp'/' -inul' (silent operation). The remaining arguments name the
    archive file and the files or directories being collected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_scope:
        host.name|expand: '%hostname%'
      selection_password:
        CommandLine|contains: ' -hp'
      selection_other:
        CommandLine|contains:
          - ' -m'
          - ' a '
      condition: selection_scope and selection_password and selection_other
    fields:
      - CommandLine
      - CurrentDirectory
      - User
- question: Is the executing binary genuinely WinRAR, or a renamed or relocated copy of rar.exe?
  context: >-
    The rule keys on command-line switches, not on the image name, so the same flags fire whether the binary is
    a stock rar.exe in Program Files or a renamed copy dropped into a temporary or staging directory. Operators
    frequently rename or relocate the archiver to blend in. Check the executable path, file name, and signing
    chain of the alerting process: an unsigned binary, a WinRAR PE that has been renamed, or a copy living under a
    user-writable path (Temp, ProgramData, AppData) is a stronger staging signal than a signed rar.exe in its
    install directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Company
      - Description
      - Hashes
- question: Did the archiving process load crypt32.dll or other cryptographic libraries around the time it ran?
  context: >-
    Header and content encryption pulls in cryptographic libraries. Loading of crypt32.dll (or related crypto
    DLLs) by the archiving process corroborates that encryption was actually performed rather than just requested
    on the command line. If image-load telemetry is not collected in this environment, treat zero results as a
    visibility gap and rely on the command-line password flags as the encryption evidence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\crypt32.dll'
          - '\bcrypt.dll'
          - '\ncrypt.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Was header encryption applied, and what does the password switch on the command line tell you?
  context: >-
    Header encryption (' -hp') hides even the filenames inside the archive, so an analyst cannot see what was
    collected without the password; content-only encryption (' -p') leaves filenames visible. The presence of the
    ' -hp' flag this rule fires on is a deliberate obfuscation step. Note that a password supplied via stdin or a
    config file will not appear in the command line, so an inline ' -hp' with no trailing password may mean the
    password was passed by another channel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What files or directories were selected for archiving?
  context: >-
    The command-line arguments after the archive name reveal what data was targeted: specific file types, sensitive
    directories (finance shares, HR folders, source repositories), or broad wildcards with ' -r' (recursive)
    indicating bulk collection. The CurrentDirectory shows the working directory, which often reveals the data
    source. The scope of targeted data determines the severity of potential loss and which business units to notify.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_scope:
        host.name|expand: '%hostname%'
      selection_password:
        CommandLine|contains: ' -hp'
      selection_other:
        CommandLine|contains:
          - ' -m'
          - ' a '
      condition: selection_scope and selection_password and selection_other
    fields:
      - CommandLine
      - CurrentDirectory
- question: Where was the archive written, and was it moved or sent off-host afterward?
  context: >-
    Data staging typically creates an archive locally, then moves it to a staging location or
    exfiltrates it over the network. The query anchors on file events from the alerting archiver
    process and its children, so it returns the archive output wherever it was written —
    including multi-volume .partNN.rar or legacy .rNN names, and output deliberately given
    .tmp/.log/.docx/.zip extensions to evade content filters. A later move or copy performed by
    a different process (explorer, a script, a transfer tool) will not appear here; pivot on the
    recovered archive path and on outbound network connections from this host to see whether the
    encrypted output left the environment.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this archiver, and is that parent chain expected?
  context: >-
    The parent process reveals how the archiver was invoked. Interactive use launched from explorer.exe or a
    console differs from invocation by a script host (wscript.exe, cscript.exe, mshta.exe), an Office application,
    or a scheduled-task host, which may indicate automated staging driven by a prior foothold. Walk up the tree
    from the parent to see what launched it and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously ran this archiving pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even legitimate archivers get abused. This query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how this specific password-plus-compression pattern has run
    here historically, not generic archiver usage. A new parent process, an unexpected user account, or an unusual
    command-line structure relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_password:
        CommandLine|contains: ' -hp'
      selection_other:
        CommandLine|contains:
        - ' -m'
        - ' a '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_password and selection_other) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_password:
        CommandLine|contains: ' -hp'
      selection_other:
        CommandLine|contains:
        - ' -m'
        - ' a '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_password and selection_other) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_password:
        CommandLine|contains: ' -hp'
      selection_other:
        CommandLine|contains:
        - ' -m'
        - ' a '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_password and selection_other) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or staging spread across multiple
    endpoints. If the same user archived data or ran related tooling on several hosts in this window, the scope of
    potential collection is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_password:
        CommandLine|contains: ' -hp'
      selection_other:
        CommandLine|contains:
        - ' -m'
        - ' a '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_password and selection_other) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Archiving rarely occurs in isolation when it is malicious. Examining process activity around the alert reveals
    what led up to it and what followed — reconnaissance, credential access, or movement of the staged archive.
    Aggregating by parent and child binary collapses repetitive agent noise while novel parent-child pairs stand
    out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts run this archiving pattern in the past week, and does the cross-host spread look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    password-plus-compression firing pattern rather than generic archiver usage. Many hosts firing the same pattern
    points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_password:
        CommandLine|contains: ' -hp'
      selection_other:
        CommandLine|contains:
        - ' -m'
        - ' a '
      condition: selection_password and selection_other
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Archiving for exfiltration usually follows earlier attack stages. Earlier detections on the same host —
    reconnaissance, credential access, defense tampering, or lateral movement — help reconstruct the timeline and
    indicate whether the archiving is the collection step of a larger operation rather than a one-off backup.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
