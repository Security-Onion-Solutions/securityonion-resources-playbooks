name: Cloudflared Portable Execution
id: 570e709c-3cca-4a45-8669-c62e37deab5d
description: |
  Detects execution of the cloudflared binary from a location outside the standard install directories under Program Files. Cloudflared is Cloudflare's signed tunnel agent and is used legitimately by developers to expose a localhost service for sharing or testing. The same binary is abused as a covert remote-access and C2 primitive: an operator drops it (often renamed) to a user-writable or temp path and runs a token-based tunnel, making all traffic appear as outbound HTTPS/QUIC to Cloudflare infrastructure that perimeter controls rarely block. The investigation should determine whether the binary was launched with tunnel arguments, where it connects, whether the user and host are expected to run tunnel software, and whether this is one-off operator activity or sanctioned automation.
type: detection
detection_id: fadb84f0-4e84-4f6d-a1ce-9ef2bffb6ccd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did cloudflared.exe run from a path outside the standard Program Files cloudflared install directories?
  context: Confirm the alert is a true positive before investing time. The rule fires when an image ending in cloudflared.exe executes AND its path is not under the standard cloudflared install directories in Program Files or Program Files (x86). Review the full image path of the triggering event to confirm both conditions held; the command-line decode question covers the tunnel arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run a network tunnel agent?
  context: Legitimate cloudflared use is concentrated on developer and IT workstations with a documented sharing or testing need. A general-purpose endpoint, a server, or a user with no development role running a portable tunnel agent is harder to explain and shifts the disposition toward shadow IT or operator-deployed remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this tunneling tool authorized for use on this host, and what business purpose does it serve?
  context: Organizations typically sanction a specific short list of remote access and tunneling tools. Cloudflared run from a non-standard path -- even though it is Cloudflare-signed -- may represent shadow IT or attacker-deployed persistence. The signature validates the binary's origin, not its filename, so a renamed copy retains a valid Cloudflare signature; authorization should be judged on business purpose, not reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved development or testing use case, or a helpdesk ticket, explaining this tunnel?
  context: Legitimate tunnel usage typically correlates with a documented developer task, a scheduled maintenance window, or a user request. If no support or development context exists for this execution, the tool may have been placed for persistent remote access or by a user circumventing egress controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did cloudflared do? Decode its command-line arguments and identify the tunnel mode.
  context: The command line distinguishes benign from operator use. A quick account-less tunnel uses 'tunnel --url http://localhost:<port>'; the canonical abuse pattern is a token-based named tunnel, 'tunnel run --token <TOKEN>', which pulls its ingress configuration from a Cloudflare account off-host and can expose RDP, SMB, or SSH. The presence of a 'tunnel' subcommand and a '--token' argument is the strongest on-host signal of remote-access relaying.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What external endpoints did cloudflared connect to, and on what ports?
  context: Cloudflared establishes outbound connections to Cloudflare edge infrastructure, by default over QUIC on port 7844 to the two geographically nearest Cloudflare data centers. Tunnel initialization also generates DNS lookups to argotunnel.com hosts (for example protocol-v2.argotunnel.com and region1.v2.argotunnel.com), and a quick tunnel proxies a random subdomain on trycloudflare.com. Watch for outbound connections on 7844 or other high or proxy-style ports such as 1080, 8080, or 4444 from a host that does not normally run tunnel software.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What process spawned cloudflared, and is that parent chain expected?
  context: The parent reveals how the tunnel agent was launched. A user double-clicking a portable copy yields an explorer.exe parent; a service or a scheduled task yields services.exe or taskeng.exe. Parents like cmd.exe, powershell.exe, a remote-execution tool, or an Office application point to scripted or hands-on-keyboard deployment rather than sanctioned use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run cloudflared?
  context: A tunnel agent that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the past 90 days indicate first-time or rare execution and raise the priority of the destination and command-line questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a tool with some legitimate footprint can be abused. The query mirrors the rule's selection -- cloudflared.exe outside the standard install directories -- scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or a different launch pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cloudflared.exe
      filter_main_admin_location:
        Image|contains:
        - :\Program Files (x86)\cloudflared\
        - :\Program Files\cloudflared\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did cloudflared spawn afterward?
  context: Children spawned by the tunnel agent reveal its impact and timing. A benign tunnel typically spawns nothing notable; post-exploitation activity correlated to the tunnel start -- shells, reconnaissance binaries, or transfer clients launching shortly after -- ties the C2 channel to hands-on-keyboard operations. Correlate the timing of any children with the tunnel execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cloudflared.exe
      filter_main_admin_location:
        Image|contains:
        - :\Program Files (x86)\cloudflared\
        - :\Program Files\cloudflared\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cloudflared.exe
      filter_main_admin_location:
        Image|contains:
        - :\Program Files (x86)\cloudflared\
        - :\Program Files\cloudflared\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity on multiple endpoints. If the same user established tunnels or ran related tooling on several hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cloudflared.exe
      filter_main_admin_location:
        Image|contains:
        - :\Program Files (x86)\cloudflared\
        - :\Program Files\cloudflared\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity in a tight window around the alert reveals what led to the tunnel execution and what followed -- reconnaissance, transfer clients, archive utilities, or scanners that, paired with an outbound tunnel, suggest staging and exfiltration rather than benign testing.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of cloudflared running outside the standard install directories. Many hosts firing the same pattern points to a packaging or deployment quirk where a portable copy lands outside Program Files; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cloudflared.exe
      filter_main_admin_location:
        Image|contains:
        - :\Program Files (x86)\cloudflared\
        - :\Program Files\cloudflared\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: A C2 tunnel rarely opens in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, credential access, or remote-service abuse -- may reveal the stages that preceded the tunnel and help reconstruct the timeline. The order of alerts tells the activity story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
