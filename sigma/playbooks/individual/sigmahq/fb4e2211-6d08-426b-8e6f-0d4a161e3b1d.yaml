name: Clfs.SYS Loaded By Process Located In a Potential Suspicious Location
id: 784bf34f-144f-43ec-93e5-c06fde9775f0
description: |
  Detects clfs.sys - the Common Log File System driver library - being loaded by a process whose executable runs from
  a suspicious location: either a staging directory (Perflogs, Users\Public, Temporary Internet files, Windows\Temp)
  or a user-profile subfolder that should never host executables (Favorites, Favourites, Contacts, or Pictures under
  Users). User-mode loads of clfs.sys from such paths are the preparation signature of CLFS privilege-escalation
  exploits, which commodity malware families have shipped to jump from user to SYSTEM. The investigation should
  identify the loading executable, how it arrived in that path, whether an elevation followed, and whether the same
  pattern appears elsewhere in the fleet.
type: detection
detection_id: fb4e2211-6d08-426b-8e6f-0d4a161e3b1d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-11
questions:
- question: Does the load match this rule - clfs.sys loaded by a process running from one of the suspicious paths?
  context: The rule requires the loaded module to be clfs.sys AND the loading executable's path to match either of two
    branches - a staging directory (Perflogs, Users\Public, Temporary Internet files, or Windows\Temp), or a user
    profile subfolder where both the Users segment and a Favorites/Favourites/Contacts/Pictures segment appear
    together. Confirm which branch fired and note the exact executable path; both branches point at the same
    exploit-staging concern, but the profile-subfolder branch is the quieter hiding spot.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is there any expected reason for an executable to run from this path on this host?
  context: Nothing routine executes from Perflogs, Public, or a profile's Favorites, Contacts, or Pictures folders -
    the plausible benign cases are narrow, such as a portable tool a user parked somewhere odd. Weigh the user's role
    and whether the timing fits their normal working pattern; an off-hours run from a staging path under an ordinary
    user account is the exploit-staging profile rather than the quirky-but-benign one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the loading executable, and what do its command line and working directory show?
  context: The process that loaded clfs.sys is the candidate exploit host - its command line may carry encoded
    arguments, staging paths, or nothing at all (droppers often run bare). The binary name and any arguments feed the
    intel lookup, and the working directory shows where its supporting files would sit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What other modules did this process load, and are any unsigned or from non-canonical paths?
  context: A CLFS exploit loads clfs.sys to groom the log-file structures it abuses - alongside it, expect the
    standard system libraries plus whatever payload components the tool carries. Unsigned modules, DLLs loaded from
    the same suspicious directory as the executable, or system DLL names resolving to non-system paths widen the
    finding from one load to a staged kit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Is the loaded clfs.sys the genuine system driver file?
  context: The load event carries the module's hash and signature fields - genuine clfs.sys is Microsoft-signed and
    lives under the system drivers directory. A copy loaded from any other path, or one with a missing or invalid
    signature, means the file itself was planted rather than merely abused. Either way, submit the loading
    executable to threat intelligence; the clfs.sys hash mostly confirms which case you are in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What spawned the suspicious-location executable?
  context: How the binary started narrows the delivery story - explorer.exe means a user launched it, a script host
    or Office ancestor means a document or download chain, and an unfamiliar parent from the same staging directory
    means this is a later stage of something already resident. Commodity worm families that carry CLFS exploits
    typically show a removable-media or archive-extraction lineage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: When was the executable written to the suspicious path, and by which process?
  context: The binary had to arrive before it ran. The file history for its path shows the write that staged it - a
    browser, archive extractor, removable-media copy, or another process already on the host - and the gap between
    write and execution. That writer is the delivery vector to close, and anything else it wrote belongs in the
    same sweep.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did the executable spawn, and under which accounts?
  context: A successful CLFS exploit turns into an elevated child - the classic outcome is the staging binary
    spawning a shell or a copy of itself running as SYSTEM. Children appearing under a higher-privileged account
    than the alerting user are the escalation succeeding; their command lines show what the elevation was spent on.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Is the executable still on disk, and what files did it and its children touch?
  context: Retrieve the binary from its staging path while it remains - its hash and contents settle the intel
    question. The process-lineage file activity also shows payload drops and self-deletion; exploit tools commonly
    remove themselves once an elevated stage is running, which makes the surviving artifacts the children left
    behind the remaining evidence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which processes normally load clfs.sys on this host?
  context: The CLFS library is loaded legitimately by system components and services running from system paths - that
    is the expected loader population. The 90-day breakdown shows whether anything outside that population has
    loaded it before; the alerting executable standing alone against a uniform system-path history is the anomaly
    this rule is built on.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Has this executable run on this host before?
  context: Staged exploit tools are typically first-run binaries - zero history plus a suspicious path plus the
    clfs.sys load stacks three anomalies on one process. Prior regular execution under the same user would instead
    point at a resident tool worth re-examining from its first appearance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what programs and users normally drive that activity, and does the current alert fit?
  context: The query mirrors the rule's full selection scoped to this host - its 14-day history of suspicious-location
    processes loading clfs.sys, broken down by the loading program and user (image-load events carry no parent
    lineage; pivot to the program's start event if lineage matters). Any prior events establish whether a recurring
    automation produces this pattern here; an empty history makes the current alert the host's first, with no
    established driver to compare against.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_dll:
        ImageLoaded|endswith: \clfs.sys
      selection_folders_1:
        Image|contains:
        - :\Perflogs\
        - :\Users\Public\
        - \Temporary Internet
        - \Windows\Temp\
      selection_folders_2:
      - Image|contains|all:
        - :\Users\
        - \Favorites\
      - Image|contains|all:
        - :\Users\
        - \Favourites\
      - Image|contains|all:
        - :\Users\
        - \Contacts\
      - Image|contains|all:
        - :\Users\
        - \Pictures\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_dll and 1 of selection_folders_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's full selection fleet-wide - every host where a suspicious-location process
    loaded clfs.sys in the past week. Several hosts firing with similar paths and timing indicates a spreading
    family carrying the exploit; a single host points at targeted or hands-on activity confined to this machine.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_dll:
        ImageLoaded|endswith: \clfs.sys
      selection_folders_1:
        Image|contains:
        - :\Perflogs\
        - :\Users\Public\
        - \Temporary Internet
        - \Windows\Temp\
      selection_folders_2:
      - Image|contains|all:
        - :\Users\
        - \Favorites\
      - Image|contains|all:
        - :\Users\
        - \Favourites\
      - Image|contains|all:
        - :\Users\
        - \Contacts\
      - Image|contains|all:
        - :\Users\
        - \Pictures\
      condition: selection_dll and 1 of selection_folders_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: An escalation attempt sits inside a longer sequence - delivery before it, elevated persistence or
    credential access after it. Aggregated parent-child pairs collapse repetitive agent noise into high-count rows
    while novel pairs stand out at low counts; those low-count novel pairs are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: The staging steps that put the binary in a suspicious path - downloads, archive extraction, removable
    media activity, or earlier execution alerts - frequently trip their own rules. The preceding alert timeline
    reconstructs the delivery chain and shows whether this host was already mid-incident when the load fired.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
