name: Disabled IE Security Features
id: 63d70c03-77cc-4c3b-afd5-2fc5dbde3523
description: |
  Detects command lines that disable Internet Explorer security features by writing
  specific registry values. The rule fires when a command line contains EITHER the
  IEHarden value set to 0 (disabling IE Enhanced Security, which blocks scripts, ActiveX,
  and downloads) OR DEPOff set to 1 OR DisableFirstRunCustomize set to 2. Legitimate uses
  exist on developer or kiosk builds and in some deployment scripts, but the same edits are
  used to weaken browser defenses ahead of script, ActiveX, or download-based execution.
  The investigation should confirm which value was set, identify the launching process and
  user, and determine whether the edit accompanied other defense-evasion or follow-on
  activity on the host.
type: detection
detection_id: fb50eb7a-5ab1-43ae-bcc9-091818cb8424
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line match the rule — either IEHarden set to 0, DEPOff set to 1, or DisableFirstRunCustomize set to 2?
  context: The rule fires on any one of three independent registry-edit patterns, and which
    one fired determines the rest of the investigation. Read the full command line and confirm
    it contains one of the value pairs the rule keys on. IEHarden=0 disables IE Enhanced
    Security (scripts, ActiveX, downloads); DEPOff=1 turns off Data Execution Prevention;
    DisableFirstRunCustomize=2 suppresses the first-run prompt. Note which branch matched,
    since the impact and downstream questions differ by value.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to modify Internet Explorer security registry settings?
  context: Routine administrative scripting, image-build automation, or developer workstations
    sometimes flip these IE settings deliberately. Knowing whether the account's role and the
    host's function include this kind of browser-hardening change is often the fastest path
    to separating a sanctioned configuration edit from an operator weakening defenses.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which IE security setting was disabled and to what value? Decode the full command line.
  context: Each value pair has a different impact. IEHarden=0 removes IE Enhanced Security so
    the browser will run scripts, ActiveX controls, and downloads it would otherwise block;
    DEPOff=1 disables Data Execution Prevention; DisableFirstRunCustomize=2 suppresses the
    first-run wizard so a scripted browser launch proceeds silently. Identify the exact
    setting and value from the command line, and note the registry path being written, since
    that determines whether the change affects the current user or the whole machine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is IE Enhanced Security (and DEP) currently restored on this host, or is the setting still disabled?
  context: The edit may be temporary, made for a single scripted action, or left in place to
    keep the browser weakened. Check the current value of the affected registry keys
    (IEHarden, DEPOff) on the host. If IE Enhanced Security or DEP is still off, the host
    remains exposed to the script, ActiveX, and download execution these features normally
    block, and the setting should be restored as part of remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What ran on this host in the hour after the IE security settings were changed?
  context: These settings are typically weakened to enable something the browser would
    otherwise block — script execution, an ActiveX download, or a malicious page launch.
    Examining process activity in the window immediately after the edit reveals what the
    change was meant to enable. A browser launch, script host, or download utility starting
    shortly after the registry edit links the tampering to its objective.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-evasion or security-tampering actions performed on this host around the same time?
  context: An operator who weakens one defense often weakens several. Beyond the IE setting,
    look for attempts to stop or disable AV/EDR services, clear event logs, delete shadow
    copies, disable recovery, or change firewall rules in the same window. Multiple tampering
    actions from the same user or parent process point to deliberate preparation rather than
    an isolated configuration change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Did a registry-set event write the IEHarden, DEPOff, or DisableFirstRunCustomize value on this host, and which hive was targeted?
  context: When the value is written programmatically (PowerShell .NET calls, direct API)
    rather than through a command line the rule can see, the process-creation view misses it.
    A registry-set event records the write directly, including the full key path. The hive
    matters — a write under HKCU affects only the current user, while an HKLM write weakens
    the setting machine-wide. Correlate the writer process and timing with the alerting
    command line to confirm the same operation.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'IEHarden'
          - 'DEPOff'
          - 'DisableFirstRunCustomize'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process issued this registry edit, and is that parent chain expected?
  context: The rule keys only on the command line, so the launching process identifies how the
    edit was issued. A predictable parent — an interactive shell a user opened, a known
    deployment agent, or a management tool — fits routine administration. An unusual parent
    such as a script host, Office application, or a freshly written binary points to
    exploitation or a malicious script driving the change. Trace what spawned the parent to
    place the edit in context.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this IE-settings pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine deployment scripts can produce these edits. The query mirrors the
    rule's selection structure scoped to this host, so the parent and user distribution
    reflects how this specific firing pattern — not generic command usage — has historically
    run here. A new parent process, an unexpected account, or an unusual command-line structure
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - ' -name IEHarden '
        - ' -value 0 '
      selection2:
        CommandLine|contains|all:
        - ' -name DEPOff '
        - ' -value 1 '
      selection3:
        CommandLine|contains|all:
        - ' -name DisableFirstRunCustomize '
        - ' -value 2 '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this IE-settings pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a
    fleet-wide count of this specific firing pattern rather than generic command usage. Many
    hosts firing the same pattern points to scripted deployment or image automation; one host
    or a small unrelated set points to manual operator activity. Use the host spread and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - ' -name IEHarden '
        - ' -value 0 '
      selection2:
        CommandLine|contains|all:
        - ' -name DEPOff '
        - ' -value 1 '
      selection3:
        CommandLine|contains|all:
        - ' -name DisableFirstRunCustomize '
        - ' -value 2 '
      condition: 1 of selection*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - ' -name IEHarden '
        - ' -value 0 '
      selection2:
        CommandLine|contains|all:
        - ' -name DEPOff '
        - ' -value 1 '
      selection3:
        CommandLine|contains|all:
        - ' -name DisableFirstRunCustomize '
        - ' -value 2 '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - ' -name IEHarden '
        - ' -value 0 '
      selection2:
        CommandLine|contains|all:
        - ' -name DEPOff '
        - ' -value 1 '
      selection3:
        CommandLine|contains|all:
        - ' -name DisableFirstRunCustomize '
        - ' -value 2 '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user drove
    similar registry edits or other tooling elsewhere in the window, the scope is larger than
    this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains|all:
        - ' -name IEHarden '
        - ' -value 0 '
      selection2:
        CommandLine|contains|all:
        - ' -name DEPOff '
        - ' -value 1 '
      selection3:
        CommandLine|contains|all:
        - ' -name DisableFirstRunCustomize '
        - ' -value 2 '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the edit reveals what
    led to it and what followed — reconnaissance, a browser or script launch, or further
    tampering. Aggregating by process and parent collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts, which is what to
    scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the stages that preceded this edit and help reconstruct the
    timeline. A weakening of browser defenses that follows an initial-access or execution
    alert tells a different story than one that appears with no prior context.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
