name: Execution of Powershell Script in Public Folder
id: 5901e9af-4603-4d69-9d44-880227e54113
description: |
  Detects powershell.exe or pwsh.exe launching a script with a -File argument
  pointing at C:\Users\Public (including the %Public% variable and quoted and
  abbreviated -f / -fi / -fil forms). C:\Users\Public is world-writable and
  requires no elevation, which makes it a convenient staging directory for
  dropped scripts; legitimate software occasionally stages helper scripts there,
  but interactive or automated PowerShell execution of a script from that
  location is uncommon in normal operations. Determine what the script does,
  whether the command line was encoded or obfuscated, what launched PowerShell,
  and whether the host and user have a history of this pattern.
type: detection
detection_id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show powershell.exe or pwsh.exe running a script file out of C:\Users\Public?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires
    when PowerShell is launched with a -File argument (in its -f, -fi, -fil, or
    -file forms, quoted or unquoted, including the %Public% variable) that points
    into C:\Users\Public. Verify the exact Image and command line match that
    pattern and note the referenced script path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run PowerShell scripts staged in C:\Users\Public?
  context: >-
    Legitimate administrative or software-deployment activity can stage scripts
    in the public profile. Knowing whether the user role and host function are
    consistent with running PowerShell scripts from a world-writable directory is
    often the fastest way to separate routine operations from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the referenced .ps1 script still on disk for analysis?
  context: >-
    The command line names a script under C:\Users\Public. Checking whether that
    file still exists enables deeper analysis -- hash lookups, sandbox submission,
    or content review. Scripts staged in public directories are frequently
    deleted after execution, so an early check preserves the artifact.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What exactly did this PowerShell invocation do? Decode the full command line and the script path it referenced.
  context: >-
    The full command line reveals the specific action taken. Decode any flags,
    the referenced script path, encoded content, and any inline arguments passed
    to the script. Because powershell.exe is too common to scope by Image alone
    on a busy host, this query narrows to executions carrying the rule's
    Public-folder -File pattern so the result reflects the firing behavior rather
    than all PowerShell on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \powershell.exe
          - \pwsh.exe
        CommandLine|contains:
          - '-f C:\Users\Public'
          - '-f "C:\Users\Public'
          - '-f %Public%'
          - '-fi C:\Users\Public'
          - '-fi "C:\Users\Public'
          - '-fi %Public%'
          - '-fil C:\Users\Public'
          - '-fil "C:\Users\Public'
          - '-fil %Public%'
          - '-file C:\Users\Public'
          - '-file "C:\Users\Public'
          - '-file %Public%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: >-
    PowerShell invocations frequently hide intent with -EncodedCommand (-enc),
    string concatenation, backtick escaping, or variable substitution. Even when
    the -File path is plain text, the script it launches or inline arguments may
    be encoded. Decoding reveals the actual payload -- download cradles, reverse
    shells, or in-memory loading of .NET assemblies.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is inside the referenced .ps1 script? Check for obfuscation, encoded strings, and known malware indicators.
  context: >-
    Read and analyze the script's actual content. Check for base64 encoding,
    obfuscated strings, embedded URLs or IP addresses, download cradles, and
    reflective-load patterns. This content analysis answers "what is IN the
    script?" and is distinct from a hash or reputation lookup. Actual retrieval
    requires manual access to the endpoint or an EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did the Public-folder script launch, and what is its hash?
  context: >-
    A PowerShell script is interpreted in the powershell process, so the .ps1 file itself has no execution hash -- its content
    is the artifact (see the content question and script-block logging). What carries a hash is anything the script then
    spawns -- scripts staged in Public are often download-and-run cradles. This returns the processes the powershell session
    launched, and those its parent launched (its children and siblings), with their hashes; submit any to VirusTotal, Hybrid
    Analysis, or internal threat intel. If the script ran entirely in-process and spawned nothing, this is empty -- retrieve
    the .ps1 from the Public path and hash it by hand, and read its content.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: >-
    Script block logging (Event ID 4104) records the deobfuscated content
    PowerShell actually executes, even when the command line or script is
    encoded, giving ground truth about what ran. The logged script-block length
    threshold determines how much is captured. If PowerShell operational logs are
    not ingested in this environment, treat zero results as a visibility gap
    rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell or endpoint security controls bypassed or weakened before this execution?
  context: >-
    Operators often disable or bypass protection before running a payload. Common
    techniques include AMSI bypass, execution-policy changes (Set-ExecutionPolicy
    or -ep bypass), Defender preference changes, and PowerShell downgrade attacks
    that fall back to the v2 engine that lacks logging. Finding these precursor
    events on the host in the hour before the alert strengthens the case for
    malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: >-
    The parent process reveals how PowerShell was invoked. Legitimate usage has
    predictable parents (explorer.exe for interactive use, a service or scheduler
    for automation). Office applications, mshta.exe, wscript.exe, or a browser as
    the parent point toward a delivery mechanism such as a malicious document or
    download.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run powershell.exe or pwsh.exe?
  context: >-
    A binary that has rarely or never run on a host is more notable than one that
    runs regularly. Zero or very low historical counts indicate first-time or
    rare execution; high counts suggest PowerShell is part of normal operations
    here, in which case the Public-folder script path is the distinguishing
    signal rather than the interpreter itself.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how the rule's specific firing pattern
    -- PowerShell running a script from C:\Users\Public -- has historically run
    here, not generic PowerShell usage. A new parent process, an unexpected user
    account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - -f C:\Users\Public
        - -f "C:\Users\Public
        - -f %Public%
        - -fi C:\Users\Public
        - -fi "C:\Users\Public
        - -fi %Public%
        - -fil C:\Users\Public
        - -fil "C:\Users\Public
        - -fil %Public%
        - -file C:\Users\Public
        - -file "C:\Users\Public
        - -file %Public%
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this PowerShell instance spawn afterward?
  context: >-
    The processes spawned after PowerShell ran reveal its actual impact.
    Legitimate scripts have predictable children; malicious execution often
    spawns cmd.exe, additional PowerShell, certutil.exe, rundll32.exe, or network
    utilities for post-exploitation. Walk the children to see what the script
    actually did.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - -f C:\Users\Public
        - -f "C:\Users\Public
        - -f %Public%
        - -fi C:\Users\Public
        - -fi "C:\Users\Public
        - -fi %Public%
        - -fil C:\Users\Public
        - -fil "C:\Users\Public
        - -fil %Public%
        - -file C:\Users\Public
        - -file "C:\Users\Public
        - -file %Public%
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - -f C:\Users\Public
        - -f "C:\Users\Public
        - -f %Public%
        - -fi C:\Users\Public
        - -fi "C:\Users\Public
        - -fi %Public%
        - -fil C:\Users\Public
        - -fil "C:\Users\Public
        - -fil %Public%
        - -file C:\Users\Public
        - -file "C:\Users\Public
        - -file %Public%
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or
    parallel activity on multiple endpoints. If the same user triggered similar
    PowerShell or staging activity on other hosts in the same window, the scope
    of the activity is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains:
        - -f C:\Users\Public
        - -f "C:\Users\Public
        - -f %Public%
        - -fi C:\Users\Public
        - -fi "C:\Users\Public
        - -fi %Public%
        - -fil C:\Users\Public
        - -fil "C:\Users\Public
        - -fil %Public%
        - -file C:\Users\Public
        - -file "C:\Users\Public
        - -file %Public%
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host --
    defense tampering, reconnaissance, credential access -- may reveal the attack
    stages that preceded PowerShell running a script from the public folder and
    help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
