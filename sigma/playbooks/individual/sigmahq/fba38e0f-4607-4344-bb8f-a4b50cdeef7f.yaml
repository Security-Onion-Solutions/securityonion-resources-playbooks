name: Diamond Sleet APT DNS Communication Indicators
id: 4e4db2c4-c5e0-4b2e-ba79-9481d80e24d8
description: |
  Detects DNS queries for domains tied to Diamond Sleet command-and-control infrastructure — a query name containing
  3dkit.org, dersmarketim.com, galerielamy.com, or olidhealth.com. Because the alert is a DNS lookup rather than a
  connection, investigation centers on the queried name and the process that issued it: confirm the domain, establish
  whether the host normally resolves it, check whether it resolved and whether the process then connected outbound,
  and look for the host-side artifacts this operator leaves — a signed executable side-loaded by a malicious DLL from
  ProgramData, staged payloads such as Forest64.exe, a "Windows TeamCity Settings User Interface" scheduled task, and
  a look-alike "krtbgt" local account. A single host resolving one of these domains warrants treating the endpoint as
  potentially compromised until the surrounding activity is explained.
type: detection
detection_id: fba38e0f-4607-4344-bb8f-a4b50cdeef7f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the queried name contain one of the flagged C2 domains, and which process issued it?
  context: >-
    Confirm the alert is a true positive before deeper work. The rule fires when a DNS query name contains 3dkit.org,
    dersmarketim.com, galerielamy.com, or olidhealth.com. Record the exact QueryName, note which of the four domains
    matched, identify the querying process, and note whether the lookup resolved. These are named-infrastructure
    indicators, so a match is high-signal rather than a pattern coincidence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this contact part of an authorized red team engagement or threat-emulation exercise?
  context: >-
    Named C2 domains occasionally appear in sanctioned adversary-emulation exercises or detection tests. Before
    treating this as a live intrusion, check whether an authorized red team or purple team activity scoped to this host
    is running domains from this indicator set. A matching engagement resolves the alert; the absence of one, given the
    named infrastructure, points to genuine command-and-control.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this process and host expected to resolve external domains of this kind?
  context: >-
    The querying process is the first attribution clue. A browser or updater resolving external names is routine; a
    service-account process, a signed system binary like wsmprovhost.exe or clip.exe, or an unfamiliar executable
    issuing the lookup is not. Knowing whether the process and host role fit the behavior separates a stray match from
    a beaconing implant. When the user is a machine or service account, judge by the process and host role.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which flagged domain was queried, did it resolve, and to what address?
  context: >-
    The alert is a DNS lookup, so investigate the domain. Identify which of the four indicator domains matched, check
    its current resolution and passive-DNS history, and confirm whether this lookup returned an address. If it
    resolved, carry the resolved IP forward to check whether the host actually connected. These are attacker-controlled
    or previously-compromised domains rather than algorithmically-generated ones, so the parent domain itself is the
    indicator.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What is the querying process, and does it match a known Diamond Sleet loader or a side-loaded host?
  context: >-
    Identify the process behind the lookup and what it is. This operator reaches C2 through side-loaded signed binaries
    — wsmprovhost.exe paired with a malicious DSROLE.dll, or clip.exe paired with a malicious Version.dll, both loaded
    from ProgramData — and through staged tools such as Forest64.exe and a HazyLoad proxy dropped to
    C:\Windows\Temp\temp.exe. A signed system binary issuing external lookups from an unusual directory or context is
    the capability worth confirming; use the command line and image path to place it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process launched the querying process, and is that parent chain expected?
  context: >-
    The parent lineage shows how the beaconing process was created. A side-loaded host such as wsmprovhost.exe or
    clip.exe launched by PowerShell, a service account, or another unexpected parent is the deviation to chase. Because
    parent identifiers are frequently absent on DNS-lookup telemetry, this pivots on the querying process's own record
    to expose its parent and creating command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: What other domains did this process query, and did any hit the rest of this indicator set?
  context: >-
    A single indicator hit rarely stands alone. List every name this process resolved in the window: additional
    lookups for the other flagged domains, or for previously-unseen external infrastructure, extend the picture of the
    beacon's contact points. A process reaching several external domains it has no business reason to contact is the
    beaconing signature.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: After resolving, did the querying process make outbound network connections?
  context: >-
    A DNS lookup is not the connection. The implant resolves the name and then connects to the returned address, and
    this operator's HazyLoad tool maintains a persistent proxy channel to attacker infrastructure. This query lists
    outbound connections initiated by the querying process around the alert so the analyst can see whether the DNS
    activity was followed by real egress and to which external addresses. If endpoint network telemetry is not
    collected, treat zero results as a visibility gap rather than proof nothing connected.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: What files did the querying process write on this host?
  context: >-
    A beaconing process often stages follow-on payloads. This operator drops tools such as Forest64.exe and an
    encrypted configuration file into C:\ProgramData and a HazyLoad proxy into C:\Windows\Temp or C:\Windows\ADFS. List
    files written by the querying process on this host and inspect the paths and names against those staging
    locations; unfamiliar executables in ProgramData or the Windows directory are the artifacts to collect.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Has this host queried this domain before?
  context: >-
    First-time resolution of one of these domains is more suspicious than a name the host looks up routinely — though
    for named C2 infrastructure any resolution is notable. A 90-day history of zero counts confirms the domain is new
    to this host; a long history would instead suggest a benign string coincidence to rule out. The querying process
    over time also shows whether something other than the alerting process has resolved it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Did other hosts in the environment query these domains?
  context: >-
    The cross-host distribution scopes the response. A single host resolving this infrastructure points to a targeted
    compromise of that endpoint; several hosts resolving domains from the set points to a broader intrusion with
    multiple footholds. Use the host set to find other compromised endpoints that have not alerted individually and to
    bound containment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Are Diamond Sleet host artifacts present around this activity?
  context: >-
    This operator leaves distinctive traces even when the beacon is memory-resident. Look for staged files written by
    the querying process, and pair that with a review of the operator's known artifacts: Forest64.exe and an encrypted
    config in C:\ProgramData, DSROLE.dll or Version.dll side-loaded from C:\ProgramData, a HazyLoad proxy in
    C:\Windows\Temp or C:\Windows\ADFS, a "Windows TeamCity Settings User Interface" scheduled task, and a look-alike
    "krtbgt" local account. Confirming any of these establishes which capabilities ran.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a malicious DLL side-loaded from ProgramData by a signed host binary?
  context: >-
    A core Diamond Sleet technique pairs a legitimate signed executable with a malicious DLL dropped beside it in
    ProgramData — DSROLE.dll loaded by wsmprovhost.exe, or Version.dll loaded by clip.exe — which then decrypts and
    runs the final payload in memory. This query looks for those module names loading from a ProgramData path on the
    host; an unsigned or unexpectedly-signed DLL of these names outside its normal system location confirms the
    side-load. Check the signature status and hash of any match.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: '\ProgramData\'
        ImageLoaded|endswith:
          - '\DSROLE.dll'
          - '\Version.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - Hashes
- question: Were this operator's persistence or account-manipulation commands run on the host?
  context: >-
    Beyond the beacon, this operator establishes persistence and access with recognizable commands: creating a
    "krtbgt" look-alike local account and adding it to Administrators, and registering a "Windows TeamCity Settings
    User Interface" scheduled task that relaunches its loader. This query looks for those specific strings in process
    command lines on the host around the alert; a hit corroborates hands-on-keyboard activity and marks accounts and
    tasks to remediate.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'krtbgt'
          - 'Windows TeamCity Settings User Interface'
          - 'Forest64.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A beacon lookup rarely stands alone. Aggregating the host's process activity in a tight window around the alert
    surfaces the immediate context — what launched the beaconing process, what it spawned, and any discovery,
    credential-access, or persistence tooling running alongside it. Novel parent-child pairs stand out at low counts
    against the routine agent-telemetry background.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Command-and-control usually follows earlier attack stages. Sigma alerts on this host in the preceding hours —
    public-facing exploitation, PowerShell payload staging, credential access, or discovery — help reconstruct how the
    implant arrived and what the operator did before it began calling out. The alert timeline is the spine of the
    incident narrative.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
