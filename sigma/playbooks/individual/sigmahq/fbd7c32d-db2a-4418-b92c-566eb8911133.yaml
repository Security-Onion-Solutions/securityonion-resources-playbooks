name: SyncAppvPublishingServer Execute Arbitrary PowerShell Code
id: 07f684ed-84b9-44ef-b8e4-54cbd8bebb13
description: |
  Detects SyncAppvPublishingServer.exe invoked with a command line containing the `"n; ` marker, which causes
  this signed Windows binary to act as a PowerShell host and execute arbitrary inline PowerShell code. The
  binary normally ships with App-V client functionality and should only run where App-V is deployed; abused, it
  is a living-off-the-land proxy that runs PowerShell under a trusted, Microsoft-signed process to evade
  controls that scrutinize powershell.exe directly. The rule fires when the image (or original filename) is
  SyncAppvPublishingServer.exe AND the command line carries the `"n; ` PowerShell-injection marker.
  Investigation should decode the inline PowerShell, confirm whether App-V is actually deployed here, identify
  the parent that launched the binary, and check for any download or follow-on execution the script performed.
type: detection
detection_id: fbd7c32d-db2a-4418-b92c-566eb8911133
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Did SyncAppvPublishingServer.exe run with a command line carrying the `"n; ` PowerShell-injection marker?
  context: Confirm the alert is a true positive by reviewing the exact command line and process details against
    the rule's criteria. The rule fires when the image or original filename is SyncAppvPublishingServer.exe AND
    the command line contains `"n; `, the marker that turns the binary into a PowerShell host. Read the full
    command line now — the inline PowerShell after that marker is the payload you will track through the rest
    of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is App-V deployed on this host, and is this user/host expected to run SyncAppvPublishingServer.exe?
  context: This binary is an App-V client component; on hosts where App-V is not deployed it has no legitimate
    reason to run, and it should never be a PowerShell host regardless. Knowing whether App-V is in use here and
    whether this user's role involves App-V administration is often the fastest way to separate a routine App-V
    operation from living-off-the-land execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What PowerShell code did the SyncAppvPublishingServer.exe command line carry after the `"n; ` marker?
  context: The text after the `"n; ` marker is the inline PowerShell the binary executes. Decode it fully —
    identify any cmdlets, download cradles (Net.WebClient.DownloadString, IWR/IEX), URLs, file paths, or
    in-memory assembly loads. A download-and-execute one-liner or reflective load is consistent with
    living-off-the-land staging; a simple App-V server-list query is the benign case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the inline PowerShell encoded or obfuscated, and what does it decode to?
  context: PowerShell payloads passed inline are frequently obfuscated with base64 (-EncodedCommand/-enc),
    backtick escaping, string concatenation, or variable substitution to hide intent. Decode any encoding and
    deobfuscate the script to reveal the actual payload — a download cradle, reverse shell, or in-memory
    execution of a .NET assembly. If the code is already plain text, focus on the source URL being fetched and
    what gets executed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated script content?
  context: Script block logging records the deobfuscated script content PowerShell actually executed, even when
    the inline command was encoded or obfuscated — and even when PowerShell ran inside this proxy binary rather
    than powershell.exe. This is ground truth about what ran. If PowerShell operational logs are not ingested in
    this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell security controls before running a payload — AMSI bypass
    (patching amsi.dll in memory), execution policy changes (-ExecutionPolicy Bypass / -ep bypass), constrained
    language mode escapes, and version-2 downgrade attacks that evade logging. Finding these precursor events on
    the host strengthens the case that the proxied PowerShell execution was malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned SyncAppvPublishingServer.exe, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Legitimate App-V activity tends to have
    predictable parents tied to App-V management; unusual parents like mshta.exe, wscript.exe, cmd.exe, or an
    Office application point to script- or macro-driven invocation of the proxy. Note what spawned the parent and
    what else the parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did the PowerShell automation libraries load into SyncAppvPublishingServer.exe on this host?
  context: When this binary acts as a PowerShell host rather than a normal App-V component, the .NET PowerShell
    automation and AMSI libraries are loaded into the process. Their presence is confirmation the binary hosted
    PowerShell in-process; normal App-V usage does not load these. If module-load telemetry is not ingested in
    this environment, treat zero results as a visibility gap rather than evidence the libraries did not load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
        Image|endswith: \SyncAppvPublishingServer.exe
      selection_modules:
        ImageLoaded|contains:
          - 'System.Management.Automation'
          - 'amsi.dll'
          - 'clr.dll'
          - 'mscoree.dll'
      condition: selection_host and selection_modules
    fields:
      - ImageLoaded
      - Image
- question: Did SyncAppvPublishingServer.exe make outbound network connections around the time of the alert?
  context: A common abuse of this proxy is an inline download cradle that fetches and executes remote PowerShell.
    Outbound connections originating from the binary itself indicate the hosted PowerShell reached out to a
    remote endpoint. Resolve the destination addresses and compare them against expected enterprise destinations;
    connections to unfamiliar external hosts are consistent with payload retrieval.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \SyncAppvPublishingServer.exe
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run SyncAppvPublishingServer.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. On hosts
    without App-V deployed this binary should have zero history; a population of prior executions tied to genuine
    App-V administration is the benign baseline that an allowlist would reflect. Zero or very low historical
    counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host previously fired this rule's pattern, what parents and users drove it, and does the
    current alert fit that pattern?
  context: Even on a host that runs this binary, the PowerShell-injection pattern is the part that matters. The
    query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects
    how this specific firing pattern has historically run here. A new parent process, an unexpected user account,
    or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SyncAppvPublishingServer.exe
      - OriginalFileName: syncappvpublishingserver.exe
      selection_cli:
        CommandLine|contains: '"n; '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did SyncAppvPublishingServer.exe spawn afterward?
  context: The processes spawned by the proxy reveal the actual impact of the hosted PowerShell. Benign App-V use
    spawns little or nothing; living-off-the-land usage often spawns cmd.exe, powershell.exe, certutil.exe, or
    other tooling for post-exploitation. Unexpected children are a strong lead for the next stage of the
    investigation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Proxy execution of PowerShell rarely occurs alone. Activity surrounding the detected binary may reveal
    reconnaissance, privilege escalation, persistence installation, or data staging that provides broader context.
    Scan for novel parent-child pairs that stand out against routine host activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SyncAppvPublishingServer.exe
      - OriginalFileName: syncappvpublishingserver.exe
      selection_cli:
        CommandLine|contains: '"n; '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SyncAppvPublishingServer.exe
      - OriginalFileName: syncappvpublishingserver.exe
      selection_cli:
        CommandLine|contains: '"n; '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple
    endpoints. If the same user triggered similar activity on multiple hosts, the scope of the activity may be
    larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SyncAppvPublishingServer.exe
      - OriginalFileName: syncappvpublishingserver.exe
      selection_cli:
        CommandLine|contains: '"n; '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
