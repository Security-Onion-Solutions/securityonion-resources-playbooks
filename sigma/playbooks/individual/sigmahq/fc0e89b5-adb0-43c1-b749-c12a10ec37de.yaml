name: SafeBoot Registry Key Deleted Via Reg.EXE
id: 6312c5e4-75cb-46df-b851-d419949a021c
description: |
  Detects reg.exe executed with the 'delete' flag against a key under HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot.
  The rule fires when both the reg.exe image (or OriginalFileName reg.exe) AND a command line containing both ' delete '
  and \SYSTEM\CurrentControlSet\Control\SafeBoot are present. Deleting SafeBoot\Minimal or SafeBoot\Network subkeys for a
  security service prevents that service from loading when the host boots into Safe Mode, a step that often precedes a
  reboot-into-safe-mode action used to defeat AV/EDR before impact. Legitimate use is rare; determine which service entry
  was removed, what else the same operator did on the host, and whether the host was being prepared for a Safe Mode reboot.
type: detection
detection_id: fc0e89b5-adb0-43c1-b749-c12a10ec37de
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show reg.exe deleting a key under \SYSTEM\CurrentControlSet\Control\SafeBoot?
  context: Confirm the alert is a true positive before investing investigation time. The rule requires both the reg.exe image
    (or OriginalFileName reg.exe) and a command line containing both ' delete ' and the SafeBoot control path. Read the exact
    command line and verify which SafeBoot subkey was targeted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to delete SafeBoot registry keys?
  context: Removing SafeBoot service entries is not a routine administrative action. Knowing whether the user role and host
    function involve boot-configuration or security-product management is often the fastest path to separating a true positive
    from sanctioned maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which SafeBoot service entry was deleted, and does removing it disable a security product in Safe Mode?
  context: The command line reveals the exact key path. Entries under SafeBoot\Minimal and SafeBoot\Network list the services
    allowed to start in Safe Mode; deleting the entry for an AV/EDR service means that product will not load if the host is
    booted into Safe Mode. Identify the specific service name in the deleted path to determine which protection was targeted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What registry key and value were affected, and is the SafeBoot path a known evasion location?
  context: SafeBoot\Minimal\<svc> and SafeBoot\Network\<svc> control which drivers and services load in Safe Mode, so removing
    a security service entry there is an evasion action rather than persistence. A reg.exe key delete produces no registry value-set
    event, so the registry_set view may be empty; in that case the deleted path must be read from the command line instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the affected security service still configured to load, or does the host remain unable to start it in Safe Mode?
  context: The deletion may have been reverted or may still be in effect. Confirm whether the SafeBoot entry for the targeted
    service has been restored and whether the service itself is running. If the entry is still missing, the host will fail
    to load that protection on a Safe Mode boot and the key should be restored before further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the SafeBoot key was deleted?
  context: SafeBoot entries are usually removed to prepare a host for a Safe Mode reboot where AV/EDR will not load, so the
    actions that follow reveal intent. Look for a forced reboot, additional service or recovery tampering, or staging of an
    encryptor or other payload in the window after the deletion.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host in the same window?
  context: Operators who delete SafeBoot entries often stack tampering actions in one operation, for example clearing event
    logs, deleting shadow copies, disabling recovery, or stopping security services. Multiple tampering events from the same
    user or parent process indicate a broader effort to weaken the host rather than an isolated change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry write or delete operations made on this host in the same session?
  context: A SafeBoot deletion is frequently part of a cluster of registry changes, for example adding a Run key for persistence
    or disabling Defender policy keys alongside it. Finding additional reg.exe add, delete, or import operations from the same
    user within a short window reveals the full scope of configuration changes.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: What process spawned this reg.exe instance, and is that parent chain expected?
  context: The parent process shows how the deletion was launched. A reg.exe delete invoked by explorer.exe or a console an
    administrator opened looks different from one spawned by cmd.exe running a batch script, powershell.exe, or an unexpected
    application, which point to scripted or pushed tampering. Walk up to the parent's own parent if the immediate parent is
    itself a shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously deleted SafeBoot keys via reg.exe, what parents and users drove it, and does the current
    alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how this
    specific SafeBoot-delete pattern has run here before rather than generic reg.exe usage. A new parent process, an unexpected
    account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: reg.exe
      - OriginalFileName: reg.exe
      selection_delete:
        CommandLine|contains|all:
        - ' delete '
        - \SYSTEM\CurrentControlSet\Control\SafeBoot
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: reg.exe
      - OriginalFileName: reg.exe
      selection_delete:
        CommandLine|contains|all:
        - ' delete '
        - \SYSTEM\CurrentControlSet\Control\SafeBoot
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: reg.exe
      - OriginalFileName: reg.exe
      selection_delete:
        CommandLine|contains|all:
        - ' delete '
        - \SYSTEM\CurrentControlSet\Control\SafeBoot
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel tampering on multiple endpoints.
    If the same user deleted SafeBoot keys or performed other tampering on several hosts in the same window, the scope of the
    operation is broader than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: reg.exe
      - OriginalFileName: reg.exe
      selection_delete:
        CommandLine|contains|all:
        - ' delete '
        - \SYSTEM\CurrentControlSet\Control\SafeBoot
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Was reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe run from outside System32 or SysWOW64 may have been copied or renamed to evade path-based allowlists. The
    rule matches on OriginalFileName as well as Image, so a relocated or renamed reg.exe still fires; confirming the on-disk
    path distinguishes a normal system binary from a planted copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host deleted SafeBoot keys via reg.exe over the past 90 days, and what command-line structures are
    typical?
  context: A SafeBoot-delete pattern with no prior history on a host is more notable than one seen regularly under stable parents.
    The query mirrors the rule's selection scoped to this host, so the count reflects this specific firing pattern rather than
    generic reg.exe usage. The command-line projection lets the analyst compare typical invocations against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: reg.exe
      - OriginalFileName: reg.exe
      selection_delete:
        CommandLine|contains|all:
        - ' delete '
        - \SYSTEM\CurrentControlSet\Control\SafeBoot
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Tampering rarely happens in isolation. Earlier detections on the same host, such as reconnaissance, credential access,
    or other defense-evasion activity, may reveal the attack stages that preceded the SafeBoot deletion and help reconstruct
    the timeline leading to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
