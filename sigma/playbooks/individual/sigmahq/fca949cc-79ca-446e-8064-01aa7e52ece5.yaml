name: HackTool - PCHunter Execution
id: c016d0cd-b81d-4f72-a63e-6e82c5315d86
description: |
  Detects execution of PCHunter (also branded XueTr), a kernel-level anti-rootkit and process/driver inspection utility. The rule fires when at least one of three independent conditions matches: the image name ends in PCHunter64.exe or PCHunter32.exe, the PE metadata carries the OriginalFileName PCHunter.exe or the Epoolsoft description, or one of the known file hashes is present. PCHunter is dual-use: legitimate responders use it to triage rootkit infections, while operators weaponize the same kernel primitives to enumerate and remove security-product callbacks, SSDT entries, and minifilters before disabling endpoint protection. Determine who launched it, whether the binary is genuinely PCHunter or a renamed copy, what kernel and process structures it touched, and whether defense tampering or other reconnaissance surrounded the event.
type: detection
detection_id: fca949cc-79ca-446e-8064-01aa7e52ece5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does this process match what this rule detects as PCHunter execution?
  context: >-
    Confirm the alert is a true positive before investing investigation time. The rule fires on any one of three branches,
    so note which one matched: the image name ends in PCHunter64.exe or PCHunter32.exe, the PE metadata carries the
    OriginalFileName PCHunter.exe or the Epoolsoft Windows Information View Tools description, or one of the known file
    hashes is present. The branch that fired determines how much weight to put on the binary-identity questions downstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
      - Hashes
- question: Is this PCHunter execution part of an authorized penetration test, red team engagement, or sanctioned IR triage?
  context: >-
    PCHunter is a legitimate rootkit-hunting and kernel-inspection tool that incident responders and researchers run during
    triage. Before deeper analysis, check whether an authorized engagement or IR effort is active on this host or segment.
    A sanctioned activity with matching timing resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run a kernel-inspection tool like PCHunter?
  context: >-
    Responders and a small set of administrators legitimately run anti-rootkit utilities; standard users and most servers
    have no routine need for kernel-level process and driver inspection. The user's role and the host's function determine
    whether this execution is routine maintenance or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What did PCHunter inspect or manipulate, and how was it launched?
  context: >-
    PCHunter is multi-purpose: it can enumerate processes, kernel modules, and services, but it can also remove
    CreateProcess and registry-callback notify routines, restore or strip SSDT and inline hooks, and delete minifilter
    and disk filter drivers. The command-line arguments, any companion configuration, and the launch context reveal whether
    the run was passive inspection or active tampering with security instrumentation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What were all PCHunter invocations on this host around the alert, and what did each command do?
  context: >-
    The triggering event shows one invocation; PCHunter operations are often driven through several sequential runs or a
    wrapping script. Reviewing every execution of the binary on this host in the surrounding window reveals the full
    operation, including whether the driver was loaded and which kernel or process structures were targeted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this binary genuinely PCHunter, or a renamed or repacked copy carrying its metadata or hashes?
  context: >-
    The rule fires on three independent signals, and they do not always agree. A binary whose PE metadata or hash matches
    PCHunter but whose on-disk name is something innocuous indicates an operator renamed the tool to blend in; a file named
    PCHunter that lacks the expected metadata and hashes may be a decoy or a tampered build. Compare image name, OriginalFileName,
    description, and hashes against each other to establish true identity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
      - Hashes
- question: Did PCHunter or a process it spawned write any files to disk, such as its kernel driver or output logs?
  context: >-
    PCHunter's process-inspection and termination primitives work by opening handles directly into other processes
    in memory — an action with no artifact of its own, so a query for it would always return zero results regardless
    of whether AV/EDR, LSASS, or another protected process was actually targeted. What is observable is file activity
    from the tool itself or a process it spawned: PCHunter typically drops a kernel driver to reach ring 0, and any
    output or log files it writes appear here. A zero result is not evidence the tool did not enumerate or attempt
    to terminate security tooling, only that no file activity accompanied it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were registry keys for services, callbacks, or execution hijacks modified on this host around the alert?
  context: >-
    Beyond reading the registry for environment discovery, PCHunter can edit service entries, Image File Execution Options,
    and startup items, and its driver registers under a service key. Registry modifications to service, callback, or IFEO
    keys in the same window indicate the tool moved from inspection to persistence or defense evasion.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_target:
        TargetObject|contains:
          - '\Services\'
          - '\Image File Execution Options\'
          - '\CurrentVersion\Run'
          - '\Control\Session Manager'
      condition: selection_host and selection_target
    fields:
      - TargetObject
      - Details
      - Image
- question: What process spawned PCHunter, and is that parent chain expected?
  context: >-
    Legitimate triage runs PCHunter from an interactive shell launched by explorer.exe or from a known management tool.
    Launch from a script interpreter (wscript.exe, mshta.exe), Office application, wmiprvse.exe, or wsmprovhost.exe points
    to automated or remote post-exploitation rather than a hands-on responder.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single discovery action may be benign, but multiple native enumeration commands in rapid succession -- whoami,
    systeminfo, tasklist, net, nltest -- is a signature of post-compromise enumeration. PCHunter running alongside a burst
    of native recon binaries strengthens the case that an operator is surveying the host before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What files did the PCHunter process create on this host?
  context: >-
    Kernel-inspection tools leave artifacts: examination reports, exported dumps, the unpacked driver written to disk
    before loading, and configuration or key files dropped alongside the binary. File-creation events from the PCHunter
    image confirm execution scope and reveal staged output even after the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
        Image|endswith:
        - \PCHunter64.exe
        - \PCHunter32.exe
      selection_pe:
      - OriginalFileName: PCHunter.exe
      - Description: Epoolsoft Windows Information View Tools
      selection_hashes:
        Hashes|contains:
        - SHA1=5F1CBC3D99558307BC1250D084FA968521482025
        - MD5=987B65CD9B9F4E9A1AFD8F8B48CF64A7
        - SHA256=2B214BDDAAB130C274DE6204AF6DBA5AEEC7433DA99AA950022FA306421A6D32
        - IMPHASH=444D210CEA1FF8112F256A4997EED7FF
        - SHA1=3FB89787CB97D902780DA080545584D97FB1C2EB
        - MD5=228DD0C2E6287547E26FFBD973A40F14
        - SHA256=55F041BF4E78E9BFA6D4EE68BE40E496CE3A1353E1CA4306598589E19802522C
        - IMPHASH=0479F44DF47CFA2EF1CCC4416A538663
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
        Image|endswith:
        - \PCHunter64.exe
        - \PCHunter32.exe
      selection_pe:
      - OriginalFileName: PCHunter.exe
      - Description: Epoolsoft Windows Information View Tools
      selection_hashes:
        Hashes|contains:
        - SHA1=5F1CBC3D99558307BC1250D084FA968521482025
        - MD5=987B65CD9B9F4E9A1AFD8F8B48CF64A7
        - SHA256=2B214BDDAAB130C274DE6204AF6DBA5AEEC7433DA99AA950022FA306421A6D32
        - IMPHASH=444D210CEA1FF8112F256A4997EED7FF
        - SHA1=3FB89787CB97D902780DA080545584D97FB1C2EB
        - MD5=228DD0C2E6287547E26FFBD973A40F14
        - SHA256=55F041BF4E78E9BFA6D4EE68BE40E496CE3A1353E1CA4306598589E19802522C
        - IMPHASH=0479F44DF47CFA2EF1CCC4416A538663
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the kernel-inspection activity is isolated or part of
    movement across multiple endpoints. The same user driving similar activity on several hosts widens the potential scope
    of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
        Image|endswith:
        - \PCHunter64.exe
        - \PCHunter32.exe
      selection_pe:
      - OriginalFileName: PCHunter.exe
      - Description: Epoolsoft Windows Information View Tools
      selection_hashes:
        Hashes|contains:
        - SHA1=5F1CBC3D99558307BC1250D084FA968521482025
        - MD5=987B65CD9B9F4E9A1AFD8F8B48CF64A7
        - SHA256=2B214BDDAAB130C274DE6204AF6DBA5AEEC7433DA99AA950022FA306421A6D32
        - IMPHASH=444D210CEA1FF8112F256A4997EED7FF
        - SHA1=3FB89787CB97D902780DA080545584D97FB1C2EB
        - MD5=228DD0C2E6287547E26FFBD973A40F14
        - SHA256=55F041BF4E78E9BFA6D4EE68BE40E496CE3A1353E1CA4306598589E19802522C
        - IMPHASH=0479F44DF47CFA2EF1CCC4416A538663
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even legitimate tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here. A new
    parent process, an unexpected user account, or an unusual launch pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
        Image|endswith:
        - \PCHunter64.exe
        - \PCHunter32.exe
      selection_pe:
      - OriginalFileName: PCHunter.exe
      - Description: Epoolsoft Windows Information View Tools
      selection_hashes:
        Hashes|contains:
        - SHA1=5F1CBC3D99558307BC1250D084FA968521482025
        - MD5=987B65CD9B9F4E9A1AFD8F8B48CF64A7
        - SHA256=2B214BDDAAB130C274DE6204AF6DBA5AEEC7433DA99AA950022FA306421A6D32
        - IMPHASH=444D210CEA1FF8112F256A4997EED7FF
        - SHA1=3FB89787CB97D902780DA080545584D97FB1C2EB
        - MD5=228DD0C2E6287547E26FFBD973A40F14
        - SHA256=55F041BF4E78E9BFA6D4EE68BE40E496CE3A1353E1CA4306598589E19802522C
        - IMPHASH=0479F44DF47CFA2EF1CCC4416A538663
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern. Many hosts firing the same pattern points to scripted deployment or sanctioned tool rollout; one host
    or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
        Image|endswith:
        - \PCHunter64.exe
        - \PCHunter32.exe
      selection_pe:
      - OriginalFileName: PCHunter.exe
      - Description: Epoolsoft Windows Information View Tools
      selection_hashes:
        Hashes|contains:
        - SHA1=5F1CBC3D99558307BC1250D084FA968521482025
        - MD5=987B65CD9B9F4E9A1AFD8F8B48CF64A7
        - SHA256=2B214BDDAAB130C274DE6204AF6DBA5AEEC7433DA99AA950022FA306421A6D32
        - IMPHASH=444D210CEA1FF8112F256A4997EED7FF
        - SHA1=3FB89787CB97D902780DA080545584D97FB1C2EB
