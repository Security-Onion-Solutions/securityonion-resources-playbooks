name: Suspicious File Created Via OneNote Application
id: 8cc1fcaa-2aeb-4ee2-b968-d9024f5f22ee
description: |
  Detects onenote.exe, onenotem.exe, or onenoteim.exe writing a script, executable, or shortcut
  (.bat, .cmd, .dll, .exe, .hta, .htm/.html, .js, .lnk, .ps1, .vbe, .vbs, .wsf, .chm) into the OneNote
  attachment temp folder (\AppData\Local\Temp\OneNote\). Legitimately, OneNote rarely extracts embedded
  content to this path — it happens when a user opens or shares an embedded document. Maliciously, OneNote
  attachments embed script or executable payloads that OneNote drops here when the user clicks the "double
  click to view" lure, then Windows hands the file to a script host or the payload runs directly. The
  investigation should determine what was dropped, whether it executed, and which child processes followed.
type: detection
detection_id: fcc6d700-68d9-4241-9a1a-06874d621b06
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file match this rule's pattern — a script or executable written into the OneNote temp attachment folder by onenote.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path, the file extension, the operation performed (created/deleted/renamed), and the responsible process against the rule's criteria — onenote.exe/onenotem.exe/onenoteim.exe writing an executable, script, or shortcut into \AppData\Local\Temp\OneNote\.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have OneNote extract and run an embedded attachment?
  context: Legitimate OneNote use rarely writes executables or script files into the attachment temp folder. Knowing whether the user routinely receives OneNote documents with embedded objects, and whether this host is a normal user endpoint, is often the fastest way to separate a benign share from a maldoc. When the user is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting dropper and shifts the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the content of this dropped file? Check for obfuscation, encoded strings, and embedded URLs or commands.
  context: 'Read and analyze the dropped file''s actual content, retrieved from the endpoint. For scripts (.hta, .js, .vbs, .vbe, .wsf, .ps1, .bat, .cmd): check for base64 or otherwise obfuscated strings, embedded URLs or IP addresses, WMI calls, and staged download-and-execute logic. For .lnk/.chm: inspect the embedded command target. For binaries (.exe, .dll): check imports, embedded strings, packer signatures, and signing status. A right-to-left-override character in the filename that hides the real extension is itself an indicator.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file has executed, what is its hash — and does it have known AV or threat intel detections?
  context: A file's hash is recorded when it runs, not when it is written (file-creation events carry no hash). This query looks for the dropped file executing and reads its hash; submit that to reputation or internal threat intel to determine whether it is known malicious, benign, or previously unseen. If the file is present but has not executed, retrieve it from its on-disk path and hash it manually. For a dropped .dll, the load event carries the hash instead.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What child processes did OneNote spawn afterward?
  context: The OneNote maldoc pattern hands the dropped file to a script host or interpreter — mshta.exe, wscript.exe, cscript.exe, cmd.exe, or powershell.exe launched as a child of onenote.exe is the execution step that turns a dropped file into running code. A OneNote process that spawns one of these shortly after writing an attachment is the high-value pivot; legitimate OneNote sessions rarely spawn interpreters.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process launched OneNote, and is that parent chain expected?
  context: The parent of onenote.exe reveals how it was invoked. An interactive launch from explorer.exe is routine; onenote.exe parented by an email client or another Office application can indicate the attachment was opened directly from a message. The parent chain helps place this drop within a delivery sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did OneNote write or delete around the alert?
  context: A OneNote session that extracts one embedded attachment often extracts several — a decoy document alongside the live payload, or multiple staged scripts. The breadth, paths, and extensions of the process's other file activity distinguish a single artifact from a multi-file drop and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the OneNote attachment temp folder recently, and by which processes?
  context: The OneNote attachment temp folder (\AppData\Local\Temp\OneNote\) should only receive files written by OneNote itself when a user opens embedded content. Other recent arrivals in that directory — and any writer that is not onenote.exe — reveal whether this is an isolated extraction or a location under repeated use, and which other artifacts belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\OneNote\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a file with this name been seen before on this host or in the environment?
  context: A file that has never appeared on a host is more suspicious than one that is part of normal operations. First-time appearance of an executable or script dropped into the OneNote temp folder should be checked even if the filename seems benign, since the extracted attachment name is attacker-controlled.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously produced this rule's pattern, what programs and users normally drive it, and does the current alert fit that history?
  context: The query mirrors the rule's selection structure scoped to this host — the resulting program/user distribution reflects how this specific OneNote-drop pattern (not generic OneNote usage) has historically run here. A new acting program process, an unexpected user account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \onenote.exe
        - \onenotem.exe
        - \onenoteim.exe
        TargetFilename|contains: \AppData\Local\Temp\OneNote\
        TargetFilename|endswith:
        - .bat
        - .chm
        - .cmd
        - .dll
        - .exe
        - .hta
        - .htm
        - .html
        - .js
        - .lnk
        - .ps1
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced this rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's 90-day history of this specific OneNote-drop pattern (not generic OneNote usage), aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and how often they receive OneNote documents with embedded content.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \onenote.exe
        - \onenotem.exe
        - \onenoteim.exe
        TargetFilename|contains: \AppData\Local\Temp\OneNote\
        TargetFilename|endswith:
        - .bat
        - .chm
        - .cmd
        - .dll
        - .exe
        - .hta
        - .htm
        - .html
        - .js
        - .lnk
        - .ps1
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this rule's pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service or machine account, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped to the alerting program, so the result is the 90-day history of this program driving this specific pattern (not generic program/binary co-occurrence). A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is routine automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \onenote.exe
        - \onenotem.exe
        - \onenoteim.exe
        TargetFilename|contains: \AppData\Local\Temp\OneNote\
        TargetFilename|endswith:
        - .bat
        - .chm
        - .cmd
        - .dll
        - .exe
        - .hta
        - .htm
        - .html
        - .js
        - .lnk
        - .ps1
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the incident may be larger than a single drop.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window — is this a coordinated rollout, or isolated to this host?
  context: 'Under a service or machine account, "what else did this user do across the network" returns agent-telemetry noise. The meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to a mass delivery or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \onenote.exe
        - \onenotem.exe
        - \onenoteim.exe
        TargetFilename|contains: \AppData\Local\Temp\OneNote\
        TargetFilename|endswith:
        - .bat
        - .chm
        - .cmd
        - .dll
        - .exe
        - .hta
        - .htm
        - .html
        - .js
        - .lnk
        - .ps1
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining process activity around the alert reveals the immediate context: what led to the drop, what ran after, and whether it is part of a larger sequence. Look for script hosts, reconnaissance, or persistence mechanisms appearing near the alert time.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts produced this rule's pattern in the past week, and does the cross-host distribution look like a mass delivery or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this OneNote-drop pattern (not generic OneNote usage). Many hosts producing the same pattern in a short window points to a mass phishing delivery; one host or a small unrelated set points to isolated activity. Use the host distribution to calibrate scope and severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \onenote.exe
        - \onenotem.exe
        - \onenoteim.exe
        TargetFilename|contains: \AppData\Local\Temp\OneNote\
        TargetFilename|endswith:
        - .bat
        - .chm
        - .cmd
        - .dll
        - .exe
        - .hta
        - .htm
        - .html
        - .js
        - .lnk
        - .ps1
        - .vbe
        - .vbs
        - .wsf
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — phishing indicators, script-host execution, defense tampering — may reveal the stages that preceded this drop and help reconstruct the delivery timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
