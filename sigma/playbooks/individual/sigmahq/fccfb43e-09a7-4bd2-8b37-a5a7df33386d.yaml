name: .RDP File Created By Uncommon Application
id: 06328025-9716-46a9-a45c-7dd822a6e777
description: |
  Detects a browser, email client, or chat application writing a file that ends in .rdp — programs
  that render web pages or messages but do not normally author Remote Desktop connection files. A
  weaponized .rdp file delivered as a phishing attachment or drive-by download is an initial-access
  vector: when opened, mstsc.exe connects to an attacker-controlled server and, if the file enables
  device redirection, the remote session can browse the victim's local drives, clipboard, printers,
  and smartcards and drop payloads back onto disk. Legitimate saves of a .rdp file from a web portal
  do occur but are uncommon from these applications; the investigation should decode the .rdp file's
  connection options, determine whether mstsc.exe subsequently opened it and connected outbound, and
  check whether that session wrote any executable or script artifacts.
type: detection
detection_id: fccfb43e-09a7-4bd2-8b37-a5a7df33386d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did one of the listed browser, email, or chat applications create a file ending in .rdp?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact file path, the operation performed, and the responsible application against the rule's
    criteria — the file name ends in .rdp and the creating process is a browser, email client, or
    chat client that does not normally author Remote Desktop connection files.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to save .rdp connection files from a browser or email client?
  context: Legitimate activity can trigger this detection — a user saving a connection file offered by
    an internal remote-access portal, for example. Knowing whether the user's role and the host's
    function involve Remote Desktop connection files is often the fastest way to separate a routine
    save from a delivered phishing artifact. When the user is a machine or service account, judge by
    the writing application and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What connection settings does this .rdp file contain?
  context: The .rdp file is a plain-text configuration; its options determine whether it is benign or
    weaponized. Retrieve the file and read its contents. A full-address entry points at the destination
    host and port — a non-standard high port is used to evade scanning and outbound RDP blocks. Device
    redirection keys (drivestoredirect, redirectclipboard, redirectprinters, redirectsmartcards,
    redirectposdevices) push local peripherals and drives to the remote session, and a suppressed
    credential prompt lets the connection auto-authenticate. Compare the destination against known
    corporate Remote Desktop endpoints.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the .rdp file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives urgency and next steps. A .rdp file still on disk can
    be retrieved and its options decoded; one deleted seconds after creation suggests cleanup after the
    connection was opened. Interpret the operation type — a deletion shortly after creation is the
    cleanup signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did mstsc.exe launch with a .rdp file on this host after the alert?
  context: A written .rdp file is only actionable once it is opened. mstsc.exe launched with a .rdp path
    on its command line is the execution step that turns a delivered file into a live Remote Desktop
    session. Note the parent process and user, and whether the .rdp path matches the file that was just
    written.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \mstsc.exe
        CommandLine|contains: .rdp
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - User
- question: What outbound network connections did mstsc.exe make on this host around the alert?
  context: A Remote Desktop session opened from a delivered .rdp file connects to the destination the
    file names. An outbound connection to an external address, or to a non-standard port rather than
    3389, is the pattern a weaponized file produces to reach attacker infrastructure and evade port
    blocks. Compare the destination against expected internal Remote Desktop hosts.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \mstsc.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Did mstsc.exe write any executable or script files on this host?
  context: A legitimate Remote Desktop session almost never writes executable artifacts. When device
    redirection is enabled, the remote side can push files back onto the local disk through the client
    process — dropped .lnk, .exe, .dll, .config, or script files from mstsc.exe indicate payload
    delivery over the session and enumerate what else needs review.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \mstsc.exe
        TargetFilename|endswith:
          - .lnk
          - .exe
          - .dll
          - .config
          - .ps1
          - .vbs
          - .bat
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: What other files did the creating application write or delete around the alert?
  context: An application that drops one file often drops several. The breadth, paths, and extensions of
    the responsible process's other file activity distinguish a single saved connection file from a
    staging burst, and reveal what else arrived alongside the .rdp file. Browsers and chat clients are
    high-volume writers, so volume alone is not suspicion — look at where the writes land, especially
    Downloads, Temp, Desktop, and Startup.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other .rdp files have been written on this host recently, and by which processes?
  context: The rule pins the .rdp extension rather than a directory, so the useful baseline is which
    processes write Remote Desktop connection files on this host at all. A steady set of writers may be
    a management tool; a browser, email client, or chat application appearing among them is the arrival
    worth chasing, and other recent .rdp files may belong to the same delivery.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: .rdp
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously seen this application write a .rdp file, what programs and users
    drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and user
    distribution reflects how this specific pattern — a browser, email, or chat application writing a
    .rdp file — has historically run here. A new writing application, an unexpected user account, or a
    first appearance of the pattern is the deviation worth chasing; file events carry no parent lineage,
    so pivot to the application's start event if lineage matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .rdp
        Image|endswith:
        - \brave.exe
        - \CCleaner Browser\Application\CCleanerBrowser.exe
        - \chromium.exe
        - \firefox.exe
        - \Google\Chrome\Application\chrome.exe
        - \iexplore.exe
        - \microsoftedge.exe
        - \msedge.exe
        - \Opera.exe
        - \Vivaldi.exe
        - \Whale.exe
        - \olk.exe
        - \Outlook.exe
        - \RuntimeBroker.exe
        - \Thunderbird.exe
        - \Discord.exe
        - \Keybase.exe
        - \msteams.exe
        - \Slack.exe
        - \teams.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts seen this pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count
    of the same pattern — one of these applications writing a .rdp file. Many hosts firing the same
    pattern points to a portal or automation that legitimately hands out connection files; one host or a
    small unrelated set points to targeted delivery. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .rdp
        Image|endswith:
        - \brave.exe
        - \CCleaner Browser\Application\CCleanerBrowser.exe
        - \chromium.exe
        - \firefox.exe
        - \Google\Chrome\Application\chrome.exe
        - \iexplore.exe
        - \microsoftedge.exe
        - \msedge.exe
        - \Opera.exe
        - \Vivaldi.exe
        - \Whale.exe
        - \olk.exe
        - \Outlook.exe
        - \RuntimeBroker.exe
        - \Thunderbird.exe
        - \Discord.exe
        - \Keybase.exe
        - \msteams.exe
        - \Slack.exe
        - \teams.exe
      condition: selection
    fields:
    - host.name
- always_include: true
  question: Has this user previously produced this pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day
    history of the same pattern — one of these applications writing a .rdp file — aggregated by host. A
    user who has never produced this pattern is more suspicious than one who does so regularly; weigh the
    count against the user's role and whether Remote Desktop connection files are part of their normal
    work.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .rdp
        Image|endswith:
        - \brave.exe
        - \CCleaner Browser\Application\CCleanerBrowser.exe
        - \chromium.exe
        - \firefox.exe
        - \Google\Chrome\Application\chrome.exe
        - \iexplore.exe
        - \microsoftedge.exe
        - \msedge.exe
        - \Opera.exe
        - \Vivaldi.exe
        - \Whale.exe
        - \olk.exe
        - \Outlook.exe
        - \RuntimeBroker.exe
        - \Thunderbird.exe
        - \Discord.exe
        - \Keybase.exe
        - \msteams.exe
        - \Slack.exe
        - \teams.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this creating application historically produced this pattern on this host or across the
    environment, or is the writing process new for this activity?
  context: When the alert fires under a machine or service account, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped
    to the creating application, so the result is the 90-day history of that process producing this
    specific pattern. A new or rare writer for this pattern is the deviation; a process that already
    accounts for many prior events is routine software behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .rdp
        Image|endswith:
        - \brave.exe
        - \CCleaner Browser\Application\CCleanerBrowser.exe
        - \chromium.exe
        - \firefox.exe
        - \Google\Chrome\Application\chrome.exe
        - \iexplore.exe
        - \microsoftedge.exe
        - \msedge.exe
        - \Opera.exe
        - \Vivaldi.exe
        - \Whale.exe
        - \olk.exe
        - \Outlook.exe
        - \RuntimeBroker.exe
        - \Thunderbird.exe
        - \Discord.exe
        - \Keybase.exe
        - \msteams.exe
        - \Slack.exe
        - \teams.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account was active on
    multiple endpoints. If the user triggered similar activity elsewhere, the scope may be larger than a
    single delivered file.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same application-driven pattern fire on other hosts in the same window — is this a
    coordinated rollout or isolated to this host?
  context: Under a machine or service account, tracking activity across the network returns agent
    telemetry noise. The meaningful question is whether the same writing process produced this pattern
    elsewhere in the alert window. Multiple hosts in the same window points to a pushed configuration or
    portal handout; a single host points to a host-local delivery.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .rdp
        Image|endswith:
        - \brave.exe
        - \CCleaner Browser\Application\CCleanerBrowser.exe
        - \chromium.exe
        - \firefox.exe
        - \Google\Chrome\Application\chrome.exe
        - \iexplore.exe
        - \microsoftedge.exe
        - \msedge.exe
        - \Opera.exe
        - \Vivaldi.exe
        - \Whale.exe
        - \olk.exe
        - \Outlook.exe
        - \RuntimeBroker.exe
        - \Thunderbird.exe
        - \Discord.exe
        - \Keybase.exe
        - \msteams.exe
        - \Slack.exe
        - \teams.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining what ran on the host around the file write reveals
    what led to it and what happened after — in particular whether mstsc.exe launched, and whether
    reconnaissance, credential access, or persistence followed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — phishing delivery, reconnaissance, or execution — may
    reveal the stages that preceded the .rdp file write and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
