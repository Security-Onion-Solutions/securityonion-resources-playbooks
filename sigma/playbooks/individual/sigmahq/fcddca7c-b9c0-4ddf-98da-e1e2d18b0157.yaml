name: Disabled Windows Defender Eventlog
id: 32aff169-5f27-47a6-b703-c8bd05625c5d
description: |
  Detects a registry modification that sets the Enabled value of the Microsoft-Windows-Windows Defender/Operational
  event log channel to DWORD 0, which stops that channel from recording Defender detections and actions. Third-party
  antivirus installations sometimes disable this channel when they take over endpoint protection, but attackers —
  particularly ransomware operations — disable it to blind defenders before deploying payloads. The investigation
  should identify the process that wrote the value, whether other logging channels or security controls were tampered
  with in the same window, and what ran on the host after Defender logging went dark.
type: detection
detection_id: fcddca7c-b9c0-4ddf-98da-e1e2d18b0157
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry write match the Defender Operational log channel being disabled?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when a registry
    value whose path contains \Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational\Enabled
    is set to DWORD (0x00000000). Review the exact key path (TargetObject) and value data (Details) against these criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to change event log channel configuration?
  context: WINEVT channel settings are rarely touched outside OS servicing and security product installations — a
    third-party antivirus install can legitimately disable the Defender Operational channel when it takes over
    protection. Check whether a software deployment, endpoint protection migration, or administrative change was
    scheduled for this host, and whether the user and writing process are part of your expected administrative tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exactly was written to the WINEVT channel key, and what does that value change?
  context: Keys under \Microsoft\Windows\CurrentVersion\WINEVT\Channels\ control whether individual event log channels
    record events at all — this is logging configuration, not malware persistence. Enabled set to DWORD 0 on the
    Microsoft-Windows-Windows Defender/Operational channel means Defender detection and remediation events stop being
    written on the host. Confirm the value data and note the writing process for the parent-chain and baseline checks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which process disabled the Defender Operational channel, and what was its full command line?
  context: The writing process reveals how the tampering was performed. reg.exe or PowerShell with an explicit
    WINEVT\Channels path indicates a hands-on or scripted action; an installer or security product binary points
    toward a protection-stack change; an unrecognized executable writing logging configuration points toward malware
    preparing the host before payload deployment. Decode any flags or script content in the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What spawned the process that wrote this value, and is that parent chain expected?
  context: The parent chain shows how the writing process was invoked. Installer services and software deployment
    agents are consistent with a legitimate protection change; a chain through a user application, script host, or
    an unrecognized binary in a user-writable path is consistent with post-exploitation tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - ParentProcessGuid
      - User
- question: Was the Enabled value modified again after the alert?
  context: Re-modification history shows whether the change stuck. A later write restoring the value to 1 suggests
    remediation or a protection product settling its configuration; the value staying at 0 means the channel remains
    silenced. Key or value deletion is not observable in this telemetry, so judge persistence from the modification
    history rather than expecting a removal event.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the Defender Operational channel currently enabled, or is the host still not recording Defender events?
  context: Tampering may be temporary or persistent. Check the channel's current state directly on the host (for
    example, wevtutil gl "Microsoft-Windows-Windows Defender/Operational" or Get-WinEvent -ListLog) and confirm whether
    Defender detection events are being recorded again. If the channel is still disabled, restore it before continuing
    the investigation — the host is otherwise accumulating a blind spot. The query redisplays the writing process for
    reference.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other registry modifications occurred on this host in the same session?
  context: Attackers who silence one control often change several settings in one pass — Defender policy keys,
    service start values, Run keys, or firewall configuration landing within the same half-hour indicates a hands-on
    session or an installer-style implant rather than an isolated configuration change. The triggering key will appear
    in the results; the signal is what else was modified alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other event log channels disabled on this host?
  context: Operators who disable the Defender Operational channel frequently disable other WINEVT channels in the
    same operation — Sysmon, PowerShell Operational, or task scheduler logs — to blind multiple telemetry sources at
    once. Multiple channels set to 0 in one window is a much stronger tampering pattern than a single channel change,
    which protection-stack migrations can explain.
  range: +/-24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\WINEVT\Channels\'
        Details: 'DWORD (0x00000000)'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense tampering commands run on this host?
  context: Disabling Defender logging often accompanies broader tampering — stopping Defender services (WinDefend,
    WdNisSvc, WdFilter, Sense) via sc or Stop-Service, clearing event logs with wevtutil, deleting shadow copies,
    disabling recovery, or changing firewall rules. Multiple tampering actions from the same user or window indicate
    a deliberate effort to degrade defenses rather than a one-off configuration change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What ran on this host after Defender logging was disabled?
  context: Logging is disabled for a reason — to hide malware execution, credential access, or payload deployment
    that would otherwise generate Defender detection events. With the channel silenced, Defender's own record of what
    it saw is gone; process telemetry in the hour after the change is the primary view of what the tampering was
    meant to cover.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: The minutes around the modification reveal its immediate context — what led to the change and what followed.
    Repetitive agent telemetry collapses into high-count rows in the aggregation, while novel parent-child process
    pairs stand out at low counts; those are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does this host normally run the process that made this change?
  context: A writing process that has executed regularly on this host for months reads very differently from one
    appearing for the first time alongside the tampering. Zero or very low historical counts indicate first-time or
    rare execution of the writer.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has the Defender Operational channel value been modified before on this host?
  context: WINEVT channel Enabled values should almost never change after provisioning. Prior modifications may
    correspond to earlier protection-product installs or upgrades on this host — useful for calibrating the
    false-positive likelihood — while zero history means this key has never been touched in the retention window.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — initial access, reconnaissance, credential access, or other defense
    tampering — reveal the stages that preceded the logging change and help reconstruct the timeline. Defense
    tampering typically comes after a foothold is established and before the main payload.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was the Defender Operational channel disabled on other hosts?
  context: The same value written on many hosts in a short window is consistent with either a managed rollout (GPO,
    protection-product deployment) or ransomware staging across the fleet — the writing process and account
    distinguish the two. A single-host modification with no deployment context points toward targeted tampering.
    Compare Details values across hosts.
  range: +/-24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were process-based persistence mechanisms installed on this host around the tampering?
  context: Operators who tamper with defenses commonly install persistence in the same operation — scheduled tasks,
    services, registry Run keys, BITS jobs, or WMI subscriptions. Persistence tool executions clustered around the
    logging change indicate intentional foothold-building rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations on this host?
  context: File-based persistence bypasses command-line tooling entirely — an executable or script placed in a
    Startup folder runs at the next logon without schtasks, sc, or reg ever executing. File writes to these locations
    around the tampering window capture that quieter variant.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
