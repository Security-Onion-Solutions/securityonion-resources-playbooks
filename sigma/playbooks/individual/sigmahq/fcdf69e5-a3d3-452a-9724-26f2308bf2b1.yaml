name: Phishing Pattern ISO in Archive
id: 2c1e95ff-6583-4586-96c9-7a64b9c8e88c
description: |
  Fires when an archive utility (WinRAR, 7-Zip File Manager, or PeaZip) spawns an ISO or
  disk-image handler (isoburn.exe, PowerISO.exe, or ImgBurn.exe). Threat actors nest a small
  ISO or IMG file inside an emailed archive so that mounting the image strips the
  mark-of-the-web from the contained payload, sidestepping attachment filters and
  SmartScreen-style protections. Legitimately, a user may double-click an image file inside an
  archive instead of extracting it. Determine what archive was opened, where it came from, what
  the mounted image contained, and whether anything executed from it afterward.
type: detection
detection_id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Did an archive utility spawn an ISO or disk-image handler as the rule expects?
  context: Confirm the alert is a true positive by reviewing the actual parent and child binaries.
    The rule requires the parent to end in Winrar.exe, 7zFM.exe, or peazip.exe AND the child to
    end in isoburn.exe, PowerISO.exe, or ImgBurn.exe. Verify both halves of the pairing matched
    rather than an unrelated launch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to open disk images out of archive utilities?
  context: Opening an ISO or IMG directly from inside a WinRAR or 7-Zip window is unusual for most
    business workflows. Software packagers, IT imaging staff, or developers may do it routinely;
    a finance or HR endpoint doing it shortly after receiving an email attachment is far more
    likely phishing. Knowing the user role and host function is often the fastest triage step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the archive utility expected to spawn this image handler, and what started the
    archive utility itself?
  context: The archive-spawns-image-handler pairing is the core signal. Tracing the archiver's own
    parent reveals whether the chain is benign (the user double-clicked an emailed or downloaded
    archive from explorer.exe) or part of a delivery chain. Look at what opened the archive and
    where that archive file lives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same archive utility instance spawn?
  context: If the archive utility opened the image handler, it may also have launched other
    processes from the same archive session. Sibling processes reveal the full scope of what the
    user opened or what auto-executed once the image was mounted.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What archive was opened, and how did it reach this host?
  context: Initial access here begins with an archive attachment containing a nested ISO or IMG.
    Identifying the archive file, its name, and how it arrived (email attachment, web download,
    USB) enables blocking at the perimeter and searching for other recipients. The parent command
    line and parent's working directory point to the archive file path; correlate with email and
    web-proxy records for the original delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the archive utility patched against known mark-of-the-web bypass flaws?
  context: Archive utilities have carried flaws that let a crafted archive bypass mark-of-the-web
    propagation or execute a payload alongside the file the user opened. An out-of-date archiver
    raises the likelihood that opening the archive itself, not just mounting the image, advanced
    the intrusion. Confirm the installed version and patch level of the parent utility.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Did the same detection fire on other hosts or for other users?
  context: Phishing waves rarely target a single recipient. If one user opened an ISO-in-archive
    attachment, others likely received the same lure. Correlating this rule across hosts and users
    reveals the breadth of the campaign and identifies additional endpoints that need to be checked
    for follow-on execution.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the image handler do? Decode its full command line and working
    directory.
  context: The image handler's command line and working directory show which ISO or IMG file was
    mounted or burned and from what path. The query scopes to all executions of this binary on the
    host within a few minutes so multi-step image operations are captured together. Identify the
    image file path so it can be located, hashed, and inspected for the staged payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Has this archive utility ever spawned this image handler on this host before?
  context: A first-time or rare archiver-to-image-handler pairing on this host is a stronger
    signal than a recurring one. Imaging or packaging workstations may show this pair regularly;
    a zero or near-zero historical count on a general-purpose endpoint points to novel activity
    consistent with a phishing lure.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What other activity did this archive utility generate around the time of the alert?
  context: Beyond the image handler, the archive utility may have produced file events or other
    process launches in the same window. This reveals what else the user opened from the archive
    and whether the archive session led to additional execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the same archive-utility-to-image-handler pairing occurring on other hosts?
  context: The same parent-child pairing appearing across multiple hosts points to a phishing wave
    rather than a one-off. Enterprise-wide comparison helps gauge campaign scope and identify other
    recipients who opened the same nested-image attachment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \Winrar.exe
        - \7zFM.exe
        - \peazip.exe
        Image|endswith:
        - \isoburn.exe
        - \PowerISO.exe
        - \ImgBurn.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \Winrar.exe
        - \7zFM.exe
        - \peazip.exe
        Image|endswith:
        - \isoburn.exe
        - \PowerISO.exe
        - \ImgBurn.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same person triggered
    similar activity on multiple endpoints. If the user opened the same attachment on more than one
    host, the scope of exposure is larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith:
        - \Winrar.exe
        - \7zFM.exe
        - \peazip.exe
        Image|endswith:
        - \isoburn.exe
        - \PowerISO.exe
        - \ImgBurn.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, defense tampering, or other
    delivery activity — may reveal stages that preceded this event and help reconstruct the
    timeline. Initial-access alerts gain meaning when read alongside what came before and after.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
