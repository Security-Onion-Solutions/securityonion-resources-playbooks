name: Potential Persistence Via Custom Protocol Handler
id: 5b80f4ce-c302-40b8-9e1f-df0181f0a467
description: |
  Detects the registration of a new custom URL protocol handler — a registry value under HKCR\ whose data starts
  with "URL:" — excluding Microsoft's own ms-* schemes and writers running from standard program locations. Legitimate
  applications register protocol handlers routinely during installation, but the same mechanism serves as event-triggered
  persistence: once a scheme is registered, any invocation of that URI (from a browser, document link, or another
  application) launches the executable configured under the handler's shell\open\command key. The investigation should
  identify what command the handler points to, whether the writing process belongs to a legitimate install, and whether
  the handler was subsequently invoked.
type: detection
detection_id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry write match a new custom protocol handler registration?
  context: The rule fires when a value under HKCR\ is written with data starting with "URL:", excluding Microsoft's
    ms-* schemes and writing processes that run from C:\Program Files, C:\Program Files (x86), C:\Windows\System32, or
    C:\Windows\SysWOW64. Confirm the key path and value data match, and note that neither exclusion applies — the
    writer's location outside standard program directories is part of what makes this alert-worthy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to be installing software that registers protocol handlers?
  context: Handler registration is normal during application installs — chat clients, conferencing tools, and developer
    utilities all do it. A developer workstation or a host inside a deployment window makes this routine; a server or
    kiosk host with no expected software changes makes the same write far more interesting. When the user is a machine
    account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was this handler registration part of a documented software deployment?
  context: A corresponding deployment record, packaging manifest, or change ticket for new software on this host
    suggests authorized installation; absence of one when policy requires it points toward unmanaged or unauthorized
    software. This check can quickly close false positives, since many legitimate applications register custom schemes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user recall installing the application that registered this handler?
  context: Direct confirmation from the person behind the account is often the fastest path to legitimacy. If they
    installed something around the alert time, get the application name and compare it against the scheme name and the
    writing process; if they recall nothing, treat the registration as unexplained and weigh the technical evidence
    more heavily.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What started the process that wrote this handler, and is that chain expected?
  context: Installer chains (msiexec.exe, setup executables under explorer.exe) are the expected origin for handler
    registration. A script host, Office application, or an unrecognized binary writing HKCR values points toward
    post-exploitation activity. If the parent linkage is unavailable on the registry event, pivot from the writing
    process's own creation event to recover its parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What scheme was registered, and does its registry location match a real application install?
  context: The alerting value is the handler's root — a key directly under HKCR\ (merged from HKLM or HKCU
    Software\Classes) whose default value declares the scheme with "URL:". The scheme name itself is a signal — a
    recognizable product name reads differently from a random or generic string. System-wide registration (HKLM-backed)
    affects all users; per-user registration (HKCU-backed) affects only the interactive user and needs no elevation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command was registered under the new handler's shell open command key?
  context: The executable a handler launches lives under HKCR\<scheme>\shell\open\command, typically a path followed
    by "%1" for the invoked URI. This value — usually written moments before or after the alerting one — is what
    actually runs when the scheme is invoked. A command pointing to a user-writable path (AppData, Temp, Public), a
    script host, or a LOLBIN with arguments is the persistence payload; a path into an installed application's
    directory supports a legitimate install.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\shell\open\command'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was this handler key modified again after the alert?
  context: Re-modification history shows whether the registration stuck or was overwritten — a later write from a
    different process may be a legitimate application reclaiming its scheme, or cleanup. Key and value deletions are
    not observable in this telemetry, so judge persistence from the modification history and from whether the handler
    was invoked, rather than expecting a removal event.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did the registering process drop files, and is the handler's target still present on disk?
  context: Handler persistence only works if the executable configured under shell\open\command exists at that path.
    The registering process or its children usually drop the payload in the same session as the registry write. The
    file-write event carries no hash; if the target is present, hash it from a later execution or retrieve it for a
    reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the new protocol handler invoked after registration?
  context: Invocation launches the registered command with the URI passed as an argument, typically under a browser,
    Office application, or explorer parent — a command line containing the custom scheme followed by "://" confirms
    the handler fired. Launches of legitimate registered schemes will also appear in these results; focus on the
    scheme named in the alerting value.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '://'
      filter_web:
        CommandLine|contains:
          - 'http://'
          - 'https://'
      condition: selection and not filter_web
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What other registry modifications occurred on this host in the same session?
  context: A real application install writes many related keys — file associations, uninstall entries, COM
    registrations — in a recognizable burst from the same installer. A lone handler registration alongside unrelated
    persistence or policy changes instead suggests a hands-on session or an implant configuring itself. The triggering
    key will appear in the results; the signal is what else was modified with it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: The minutes around the registration reveal its immediate context — an installer chain and the installed
    application starting up support a legitimate install, while download-then-register-then-beacon sequences point the
    other way. Repetitive agent telemetry collapses into high-count rows in the aggregation; novel parent-child pairs
    at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does this host normally run the process that registered the handler?
  context: An installer or updater seen periodically over months reads differently from a binary appearing for the
    first time alongside the registration. Zero or very low historical counts indicate first-time or rare execution
    of the writer — in that case also verify the writing binary's signer and reputation before trusting it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this handler key been modified before on this host?
  context: A scheme that has been registered and re-registered by the same application over time is consistent with
    normal software updates. Zero history means this scheme is new to the host in the retention window, which raises
    the value of the payload and invocation checks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — download activity, script execution, defense tampering — may reveal
    how the registering binary arrived and what stage of an operation the handler registration represents. Persistence
    installation typically follows initial access and precedes longer-term objectives.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was the same handler registered on other hosts?
  context: The same scheme appearing on many hosts in a short window is consistent with a managed software rollout —
    the writing process and account should match your deployment tooling. A single-host registration with no
    deployment context points toward targeted persistence. Compare Details values across hosts to confirm it is the
    same scheme.
  range: +/-24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence mechanisms installed on this host around the registration?
  context: The detected activity is itself registry-based persistence; attackers who establish one foothold commonly
    stack backups using different techniques — scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions.
    Persistence tool executions clustered around the handler registration indicate deliberate foothold-building rather
    than a software install.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
