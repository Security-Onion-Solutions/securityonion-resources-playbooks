name: LSASS Process Reconnaissance Via Findstr.EXE
id: ae8e441c-bceb-4161-af6e-395efd7f0ab4
description: |
  Detects find.exe or findstr.exe invoked against the string "lsass", a pattern operators use to resolve the LSASS process ID
  before dumping its memory for credential theft. The rule fires when EITHER the binary is find/findstr with "lsass" on the
  command line, OR the command line matches one of the case-insensitive findstr-lsass forms directly. Legitimate use is rare:
  administrators and monitoring tools occasionally pipe tasklist output through findstr, but searching specifically for lsass
  is almost always reconnaissance preceding credential access. Investigation should confirm the exact command, identify the
  parent and operator, and determine whether LSASS access or credential dumping followed.
type: detection
detection_id: fe63010f-8823-4864-a96b-a7b4a0f7b929
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the alerting command line match this rule's pattern -- find/findstr searching for "lsass", or a direct findstr-lsass form?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires on EITHER of two branches, so
    note which one matched: the binary resolving to find.exe/findstr.exe with "lsass" anywhere on the command line, OR a direct
    case-insensitive findstr-lsass form such as the /i variants. Which branch fired determines the downstream weight -- a bare
    "findstr lsass" inside a tasklist pipe is the classic PID-resolution recon, while the /i quoted forms suggest a copied
    tradecraft snippet.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run findstr against process names, and is LSASS recon plausible for their role?
  context: >-
    Legitimate administrative scripting can pipe tasklist through findstr, but searching specifically for lsass is rarely a
    routine operation. Knowing whether the user role and host function (a helpdesk workstation versus a domain controller or
    a developer box) are consistent with the detected behavior is often the fastest path to distinguishing a benign script
    from operator reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was the LSASS process the target, and what was the full command around the findstr invocation?
  context: >-
    Findstr searching for lsass typically resolves the LSASS process ID so a follow-on tool can read or dump its memory. Decode
    the full command line to confirm the target is LSASS (not an unrelated string that contains "lsass"), and check whether
    it was piped from tasklist or another enumeration command. Identifying that LSASS memory is the intended credential store
    determines which accounts may be exposed and what remediation is needed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did any process open a handle to the LSASS process on this host around the time of the findstr recon?
  context: >-
    Findstr-on-lsass resolves a PID; the next operator step is opening a handle to LSASS to read its memory. Object-access
    auditing records handle requests against the LSASS executable, so a handle open from a non-system, non-security-tool
    process shortly after the recon is the load-bearing follow-on. If object-access auditing for process objects is not
    enabled in this environment, treat zero results as a visibility gap rather than evidence nothing accessed LSASS.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ObjectName|endswith: '\lsass.exe'
      condition: selection
    fields:
      - ProcessName
      - ObjectName
      - AccessMask
      - SubjectUserName
- question: What process spawned this findstr invocation, and is that parent chain expected?
  context: >-
    The parent process reveals how the search was invoked. A findstr launched by cmd.exe inside an interactive shell session
    or a tasklist pipe is the common recon pattern; a parent such as a remote-execution service, a script host, or an Office
    application points toward an automated or operator-driven sequence. Walk up to what spawned the parent to reconstruct the
    invocation path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run find.exe or findstr.exe?
  context: >-
    find and findstr are common built-ins, so raw counts will rarely be zero -- but the analyst can still gauge whether this
    host runs them at all and at what cadence. A host that almost never invokes findstr makes a sudden lsass search more notable.
    Pair the count with the parent and user distribution to judge whether this fits established usage.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the findstr-lsass pattern, what parents and users drove it, and does this alert fit?
  context: >-
    Even common built-ins get abused. This query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how the findstr-lsass pattern specifically (not generic findstr usage) has run here.
    A new parent process, an unexpected user account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains: lsass
      selection_special:
        CommandLine|contains|windash:
        - ' /i "lsass'
        - ' /i lsass.exe'
        - findstr "lsass
        - findstr lsass
        - findstr.exe "lsass
        - findstr.exe lsass
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_findstr_* or selection_special) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this findstr invocation spawn afterward?
  context: >-
    findstr itself is a leaf process, but the surrounding shell often launches the next stage. Processes appearing on this
    host right after the recon -- procdump, rundll32 invoking comsvcs.dll, taskmgr, a custom dumper, or a script host -- reveal
    whether the PID lookup fed an actual LSASS memory dump.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired the findstr-lsass pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the findstr-lsass pattern
    rather than generic findstr usage. Many hosts firing the same pattern points to a scripted or deployed tool; one host or
    a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains: lsass
      selection_special:
        CommandLine|contains|windash:
        - ' /i "lsass'
        - ' /i lsass.exe'
        - findstr "lsass
        - findstr lsass
        - findstr.exe "lsass
        - findstr.exe lsass
      condition: all of selection_findstr_* or selection_special
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains: lsass
      selection_special:
        CommandLine|contains|windash:
        - ' /i "lsass'
        - ' /i lsass.exe'
        - findstr "lsass
        - findstr lsass
        - findstr.exe "lsass
        - findstr.exe lsass
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_findstr_* or selection_special) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains: lsass
      selection_special:
        CommandLine|contains|windash:
        - ' /i "lsass'
        - ' /i lsass.exe'
        - findstr "lsass
        - findstr lsass
        - findstr.exe "lsass
        - findstr.exe lsass
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_findstr_* or selection_special) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple endpoints.
    If the same user triggered similar recon or credential-access behavior on multiple hosts, the scope of compromise may be
    larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains: lsass
      selection_special:
        CommandLine|contains|windash:
        - ' /i "lsass'
        - ' /i lsass.exe'
        - findstr "lsass
        - findstr lsass
        - findstr.exe "lsass
        - findstr.exe lsass
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_findstr_* or selection_special) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Reconnaissance rarely occurs in isolation. Examining activity around the alert reveals the immediate context -- what led
    to the findstr recon and what happened after. Look for other enumeration commands, privilege escalation, or credential-dumping
    tooling that surrounds the PID lookup.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- defense tampering, broader reconnaissance, or initial access -- may reveal the attack
    stages that preceded the LSASS PID lookup and help reconstruct the timeline. Recon for credential access usually sits in
    the middle of an operation, so prior alerts often explain how the operator arrived here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised if LSASS was dumped, and do any have elevated privileges?
  context: >-
    The severity of LSASS credential theft depends on which sessions are live in memory. Domain admin or service-account
    credentials cached in LSASS on this host require incident escalation; a standalone workstation with only a standard user
    logged on is lower impact. Cross-reference the accounts that have logged on to this host with their group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
