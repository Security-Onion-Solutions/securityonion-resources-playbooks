name: Potential KamiKakaBot Activity - Shutdown Schedule Task Creation
id: e3d07f40-1a2f-4948-8ae3-a9b196039fdb
description: |
  Detects schtasks.exe registering a scheduled task whose command line carries all three of a
  /create switch, the string "shutdown /l /f", and a WEEKLY schedule, when the registering account
  is not a built-in system principal (accounts containing AUTHORI or AUTORI are excluded). The
  task's payload forces a logoff of the interactive session on a recurring schedule; KamiKakaBot
  samples register such a task so that logon-triggered persistence re-executes on a predictable
  cadence, while shutdown.exe and schtasks.exe are also standard administration tools and a weekly
  forced logoff is a routine reset on kiosks, shared workstations, and lab machines. The
  investigation should establish what the task actually runs and when it fires, what launched
  schtasks.exe, whether the task is still registered, and whether other persistence was installed
  on the host in the same window.
type: detection
detection_id: fe9e8ba9-4419-41e6-a574-bd9f7b3af961
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the schtasks.exe command line contain a /create switch, the command "shutdown /l /f", and
    a WEEKLY schedule together?
  context: >-
    The rule requires all three elements in the same command line, and it does not fire when the
    registering account is a built-in system principal. Read the arguments in order and confirm
    each element is present rather than inferring one from another. In the shutdown payload, /l
    ends the interactive session and /f closes applications without prompting to save, so the task
    is a recurring forced logoff rather than a shutdown or restart.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to register a scheduled task that forces a weekly logoff?
  context: >-
    Recurring forced logoffs are a normal reset routine on kiosks, shared or classroom
    workstations, VDI images, and lab machines, and are usually pushed by whoever administers those
    fleets. The same task on a single general-purpose endpoint, registered by an ordinary user
    account, is a different proposition. Knowing the host's function and the account's role is
    usually the fastest way to separate the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Does the user or an administrator recall registering this task?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to
    legitimacy. If someone registered it, ask what the weekly logoff is for, why it was created
    from a command line, and who asked for it. If nobody recalls it, the account may be running
    code it did not initiate, and the task's own arguments become the primary evidence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: >-
    Is command-line registration with schtasks.exe consistent with how this organization normally
    deploys scheduled tasks?
  context: >-
    Many environments deploy recurring tasks through group policy, a configuration-management
    system, or an imaging process, and rarely by typing schtasks.exe on an endpoint. Where that is
    the norm, a direct command-line registration is either an administrator taking a shortcut or
    code registering its own task; where there is no standard procedure, this check carries little
    weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What task name, run-as account, and schedule were configured, and what exactly does it execute?
  context: >-
    Read the arguments individually - /TN for the task name, /TR for the command it runs, /SC, /d
    and /ST for the schedule, /RU for the run-as account, and /f for silent overwrite of an
    existing task of the same name. Task names that imitate an operating-system or vendor
    maintenance job are common cover for a registration that no administrator made. A /TR that
    only calls shutdown is a timing mechanism rather than a payload, so its value lies in what the
    forced logoff sets up on the next logon.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What process spawned schtasks.exe, and is that parent chain expected?
  context: >-
    The parent shows how the registration was invoked. An interactive shell under explorer.exe, a
    management agent, or a deployment tool fits routine administration. A script host, build
    utility, or library loader as the parent - powershell.exe, msbuild.exe, wscript.exe,
    rundll32.exe - points at a scripted chain registering its own task, which is how this family's
    loader reaches schtasks.exe. Read the parent's own command line for the stage above it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    What scheduled tasks were registered, updated, or deleted on this host around the alert, and
    under which account?
  context: >-
    Task registration is recorded independently of the process that requested it, so these events
    corroborate the command line and remain after the task itself is removed. Event ID 4698 records
    creation, 4702 an update, and 4699 a deletion, and the subject account names who registered the
    task, which may differ from the account that owns the calling shell. Several registrations in
    the same window point at a set of tasks rather than one. If the Security channel is not
    collected from this host, treat an empty result as a visibility gap rather than evidence that
    nothing was registered.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4699
          - 4702
      condition: selection
    fields:
      - EventID
      - TaskName
      - SubjectUserName
  answer_sources:
  - manual_review
- question: When is the task set to fire, and has the Task Scheduler already run it?
  context: >-
    The /SC WEEKLY schedule with its /d day list and /ST start time fixes the next fire time, which
    may be days away. Scheduled tasks run as children of the Task Scheduler service, so a
    shutdown.exe launched from that service marks an execution that already happened. The timing
    matters mechanically for two reasons - a forced logoff ends interactive sessions on the host,
    including a live response session, and it delivers the next logon, at which point any
    logon-triggered persistence on the host runs. Weigh that against the schedule when planning
    host-side collection.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is the task still registered on the host?
  context: >-
    The recurrence only continues while the task exists. Query the task by the name from the /TN
    argument on the host, or through an endpoint management console, and read its action, trigger,
    and author. A task that is gone points at cleanup or an operator removing it, and the
    registration record on the Security channel is then the remaining evidence. A task that is
    present and its on-disk definition are what remediation removes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: >-
    When this host has previously produced the rule's pattern, what parents and users drove that
    activity, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution reflects how this specific registration pattern - not schtasks.exe generally - has
    run here before. A host that resets itself weekly by policy will show a consistent parent and
    account across prior events. A first occurrence, a new parent, or an account that has never
    registered this task before is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /create '
        - shutdown /l /f
        - WEEKLY
      filter_main_system_user:
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this specific registration pattern, aggregated by host. An
    administrator who provisions kiosk or lab machines will show this across several hosts; a user
    who has never registered a forced-logoff task is a different proposition. Weigh the count and
    the host spread against the account's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /create '
        - shutdown /l /f
        - WEEKLY
      filter_main_system_user:
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven the rule's pattern here or across the environment,
    or is the parent new for this activity?
  context: >-
    When the alert fires under an account that names no person, user identity does not attribute
    the behavior and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection structure scoped to the alerting parent, so the result is the 90-day history of this
    parent driving this registration, aggregated by host. A parent that already accounts for the
    pattern across many hosts is deployment tooling; a parent that is new or rare for it is the
    deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /create '
        - shutdown /l /f
        - WEEKLY
      filter_main_system_user:
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the
    registration is a local event or one step in activity spanning several endpoints. The same
    account driving script hosts or persistence tooling on multiple hosts within the hour points at
    a rollout, scripted or otherwise. If the alert fired under an account that names no person,
    this view returns routine agent telemetry and the parent-driven pivot is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under an account that names no person, asking what else the user did returns agent telemetry
    from every host. The useful question is whether the same launch mechanism registered the same
    task elsewhere: the query mirrors the rule's selection structure scoped to the alerting parent,
    fleet-wide, in the alert window. Multiple hosts in the same window points at scheduled or
    pushed automation; a single host points at a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /create '
        - shutdown /l /f
        - WEEKLY
      filter_main_system_user:
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A task registration is one step, and what surrounds it gives it meaning. Script hosts, library
    loaders, archive or download utilities, and other administration tooling running in the same
    window change how the task should be read, as does a management agent that explains the whole
    sequence. The aggregation collapses repetitive agent and service telemetry into high-count
    rows; novel parent-child pairs stand out at low counts and are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is rarely the first step. Earlier detections on the same host - a document or
    archive spawning an interpreter, library side-loading, a download cradle, or defense tampering
    - reveal the stages that preceded the registration and help reconstruct the timeline. A task
    registration with no preceding detections and a coherent parent chain is more likely routine
    administration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other persistence mechanisms also installed on this host around the alert?
  context: >-
    A recurring forced logoff is a timing mechanism, not a payload - it is useful to an operator
    only when something else runs at the next logon. Services, registry autostart entries, other
    scheduled tasks, and WMI subscriptions installed in the same window are what the logoff would
    activate, and finding them is what turns the alert into a scope. Several persistence tools
    running within the same hours points at stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Have other hosts produced the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this registration pattern rather than generic schtasks.exe usage. Many
    hosts registering the same task points at a build image, a policy, or a deployment script that
    can be identified and tuned; one host, or a small set with nothing in common, points at
    operator or code-driven activity on those hosts. Read the host distribution together with the
    parent consistency to calibrate how much weight the alert carries.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /create '
        - shutdown /l /f
        - WEEKLY
      filter_main_system_user:
        User|contains:
        - AUTHORI
        - AUTORI
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
