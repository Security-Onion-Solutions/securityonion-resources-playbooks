name: ScreenConnect Temporary Installation Artefact
id: 48362bea-02f3-4301-b9a5-b18330ede18e
description: |
  Detects a file written to a path containing \Bin\ScreenConnect. — the temporary extraction artifact produced when a
  ScreenConnect (ConnectWise Control) client is installed or updated on a host. ScreenConnect is legitimate remote
  support software, but adversaries deploy the same client to establish an interactive command and control channel,
  because commercial remote access tools blend in and are often permitted by application control. The investigation
  should determine whether the installation was authorized support activity, which ScreenConnect instance the client
  is configured to connect to, and whether the install progressed to a persistent service, outbound relay connection,
  or interactive control of the host.
type: detection
detection_id: fec96f39-988b-4586-b746-b93d59fd1922
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the file path match a ScreenConnect temporary installation artifact?
  context: The rule fires on any file whose path contains \Bin\ScreenConnect. — the extraction location the
    ScreenConnect installer uses while setting up or updating the client. Confirm the path, the operation type, and
    the responsible process match an installation in progress rather than an unrelated file that happens to share the
    pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to install remote support software?
  context: IT support staff and managed endpoints under an RMM program install and update ScreenConnect routinely. A
    standard user's workstation acquiring a remote access client outside any support interaction is the pattern worth
    pursuing — commercial remote access tools are frequently deployed by attackers precisely because they look like
    support activity. When the user is a machine account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is ScreenConnect on the organization's approved remote access software list?
  context: Organizations typically sanction a specific remote support product. If ScreenConnect is the approved tool,
    this alert is likely routine support or agent update activity — but confirm the instance it connects to is the
    organization's own. If a different product is sanctioned, this installation represents shadow IT or
    attacker-deployed access regardless of ScreenConnect's commercial reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a helpdesk ticket or support session explaining this installation?
  context: Legitimate ScreenConnect installs correlate with an active support ticket, a scheduled deployment, or a
    user-initiated support request. No support context for the install window means the client may have been delivered
    by an attacker or by a user circumventing controls — the technical checks on instance, persistence, and egress
    then carry the weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What spawned the process that wrote the artifact, and is that chain expected?
  context: How the installer was launched distinguishes delivery paths — a browser download double-clicked from
    explorer.exe fits a user-initiated support session, a managed-deployment agent fits sanctioned rollout, while a
    script host, Office application, or an unrecognized binary staging the installer points toward phishing or
    hands-on-keyboard delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Which ScreenConnect instance and session type is this client configured for?
  context: The installer invocation embeds the instance the client will report to — the relay host or URL, an instance
    fingerprint, and session parameters distinguishing unattended access from a one-off support session. A client
    pointed at the organization's own instance supports legitimate use; an unknown cloud instance means whoever
    controls that instance controls the host. The writing process's command line shown here is where those parameters
    appear.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: If the dropped binary executed, what is its hash, and is it the signed ScreenConnect client?
  context: A file's hash is recorded when it runs, not when it is written. This query looks for the artifact executing
    and reads its hash — submit it to threat intel to confirm it is the genuine signed ScreenConnect client rather
    than a renamed or tampered binary borrowing the name. If the file is present but has not executed, retrieve it
    from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is the temporary artifact still on disk, or was it cleaned up after installation?
  context: Temporary installation artifacts are routinely deleted once setup completes, so deletion here is not by
    itself anti-forensic behavior. What matters is what remains — a persistent client directory and service binary
    indicate a completed install, while a temp artifact that ran and vanished with no installed footprint suggests a
    run-once session client used for a single access.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the installing process write or delete around the alert?
  context: The installer's full footprint reveals where the client landed — the persistent client directory, service
    executable, and configuration files that carry the instance fingerprint. The breadth and locations of these writes
    distinguish a complete unattended-access install from a minimal one-off session client.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a ScreenConnect service registered on this host?
  context: A full client install registers a Windows service named for the instance fingerprint, giving the operator
    access that survives reboots and logoffs — unattended access rather than a one-time support session. Service
    registration following the temp artifact confirms the install completed and tells you which instance the
    persistent client belongs to.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\ScreenConnect'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What external endpoint is this tool connecting to?
  context: ScreenConnect clients hold a long-lived outbound connection to their instance's relay, on a configurable
    port that is often a high port outside standard web ranges. A relay belonging to the organization's own instance
    supports sanctioned use; an unfamiliar cloud or self-hosted relay is the command and control channel itself. The
    destination hostname is sparse on endpoint telemetry, so expect to work from the IP and port.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Did ScreenConnect processes spawn command shells or other children on this host?
  context: Interactive control is visible as child processes under the ScreenConnect client or service — command
    shells from the remote console feature, file transfers, or tooling launched by the operator. Any shell child under
    a remote access parent means a person was actively driving the host through the channel; what they ran is the
    immediate scope of their activity.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|contains: 'ScreenConnect'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — their 90-day history of ScreenConnect
    installation artifacts, aggregated by host. Support staff who deploy or update the client regularly will show
    steady history across many hosts; a standard user producing this pattern for the first time is the deviation
    worth chasing. Weigh the count against the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \Bin\ScreenConnect.
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful
    pivot is the launch mechanism: the query mirrors the rule''s selection scoped to the alerting program, so
    the result is the 90-day history of this program producing ScreenConnect install artifacts. A deployment agent or
    updater that accounts for many prior events across hosts is sanctioned automation; a new or rare program for this
    pattern is the deviation worth chasing.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \Bin\ScreenConnect.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's process activity across all hosts in the alert window reveals whether the account is
    installing remote access on multiple endpoints or moving between systems. The same account producing installs or
    suspicious tooling on several hosts widens the compromise scope. If the account is a service principal, this view
    fills with routine agent noise and the parent-driven variant of this question is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service principal, user-scoped clustering returns agent-telemetry noise. The meaningful question
    is whether the same launch mechanism produced ScreenConnect install artifacts elsewhere: the query mirrors the
    rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the
    same window points to a pushed rollout — sanctioned or attacker-driven mass deployment; a single host points to a
    host-local install.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \Bin\ScreenConnect.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did ScreenConnect installation artifacts appear on other hosts regardless of how they were launched?
  context: The parent-scoped fleet view misses deployments driven by different mechanisms on different hosts — an
    operator installing by hand here and via script there. This parent-independent sweep over a wider window shows
    every host where the install pattern appeared, with the responsible process on each. Attackers who gain broad
    access sometimes push a remote access client across many systems to entrench.
  range: +/-24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: '\Bin\ScreenConnect.'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections — phishing delivery, script execution, credential access — may reveal how the installer
    arrived and whether this install is one stage of a larger operation. Remote access tool deployment frequently
    follows initial access as the attacker's way of converting a foothold into stable interactive control.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
