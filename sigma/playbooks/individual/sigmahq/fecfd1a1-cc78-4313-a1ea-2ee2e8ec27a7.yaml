name: PowerShell Logging Disabled Via Registry Key Tampering
id: b855e5db-f1bf-493c-bc7f-73297445fbf5
description: |
  Detects a registry value under the PowerShell or PowerShellCore policy hives — EnableModuleLogging,
  EnableScriptBlockLogging, EnableScriptBlockInvocationLogging, EnableTranscripting, EnableInvocationHeader, or
  EnableScripts — being set to DWORD 0. Zeroing these values disables PowerShell module logging, script block logging
  (event 4104), transcription, or script execution, and is typically staged immediately before running malicious
  PowerShell so the script content is never captured. Centrally managed policy can legitimately write these values,
  though organizations rarely configure logging off. The investigation should identify the writing process, whether
  other logging values were swept in the same pass, what PowerShell ran on the host after visibility was cut, and
  whether the values were restored.
type: detection
detection_id: fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the registry write match a PowerShell logging or execution policy value being zeroed?
  context: The rule fires when a value under a \Microsoft\Windows\PowerShell\ or \Microsoft\PowerShellCore\ policy
    path, ending in EnableModuleLogging, EnableScriptBlockLogging, EnableScriptBlockInvocationLogging,
    EnableTranscripting, EnableInvocationHeader, or EnableScripts, is set to DWORD (0x00000000). Confirm the key path
    and value data match, and note which specific logging control the alerting value governs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to modify PowerShell logging policy?
  context: These values live under policy hives and are normally written by central policy processing, not by hand.
    An organization that deliberately configures PowerShell logging off would show these writes fleet-wide from the
    policy engine; a single user or unrecognized process zeroing them on one host is the tampering pattern. When the
    user is a machine account, judge by the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was this logging policy change documented or approved?
  context: Changes to security logging configuration typically require documented approval. A policy change record
    covering this host and window supports administrative action; disabling PowerShell logging with no corresponding
    change is worth treating as unauthorized, since reducing security telemetry is rarely a routine unilateral action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What started the process that zeroed this value, and is that chain expected?
  context: The writer's origin separates policy machinery from tampering. Policy processing runs under service hosts;
    an interactive chain — a shell under explorer.exe, a script host, or an unrecognized or unsigned binary writing
    logging policy — points toward a hands-on or malware-driven change. If the parent linkage is unavailable on the
    registry event, pivot from the writing process's own creation event to recover its parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which PowerShell logging control was disabled, and what visibility does it remove?
  context: Each value cuts a different telemetry source — EnableScriptBlockLogging stops event 4104 script content,
    EnableModuleLogging stops per-module pipeline records, EnableTranscripting stops transcript files,
    EnableInvocationHeader strips timing detail from transcripts, and EnableScripts set to 0 disables script execution
    policy processing. The key path also shows scope — a per-user policy path affects only that user's new sessions,
    while a machine-wide path blinds every session on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Were other PowerShell logging or execution policy values zeroed on this host?
  context: Tampering of this kind typically sets several values in one pass — module logging, script block logging,
    and transcription disabled back-to-back is the staging signature, whereas a single value changed in isolation is
    more consistent with a stray configuration action. This sweep shows every value under the PowerShell policy trees
    zeroed in the surrounding hour, with the writing process for each.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Microsoft\Windows\PowerShell\'
          - '\Microsoft\PowerShellCore\'
        Details: 'DWORD (0x00000000)'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the command that performed the tampering encoded or obfuscated?
  context: The writing process's command line shows how the values were set — a plain reg add naming the policy path
    reads as scripted or hands-on tampering, while a PowerShell writer with -EncodedCommand or string-concatenation
    obfuscation conceals its own action and should be decoded to reveal the full staging script. Base64 payloads
    decode to the actual sequence of changes and any follow-on commands.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other PowerShell security controls bypassed or weakened before this change?
  context: Logging tampering often travels with the rest of the PowerShell evasion kit — execution policy bypass
    flags, AMSI bypass strings, defense tampering cmdlets, or downgrade to PowerShell v2, which predates script block
    logging entirely. Bypass indicators in the hour before this change show the preparation sequence and strengthen
    the case that the tampering was staged for malicious execution.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did script block logging capture PowerShell content around the tampering?
  context: Event 4104 records the script content PowerShell actually executed — including, if the tampering was done
    from PowerShell, the staging script itself, captured before the disable took effect. New sessions covered by the
    zeroed policy stop producing 4104 events afterward, so an abrupt end to script block records at the alert time is
    the tampering working as intended. If these logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What PowerShell activity ran on this host after logging was disabled?
  context: The tampering exists to hide what comes next. With module, script block, and transcription telemetry cut,
    the process-creation command line is the remaining record of PowerShell activity — review the sessions that
    started after the change for download cradles, encoded payloads, or credential access tooling. Activity here is
    exactly the content the attacker did not want logged.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - CommandLine
      - User
- question: Was the zeroed logging value modified again after the alert?
  context: Policy-managed values get re-applied on the next policy refresh, so a later write restoring the value
    indicates central management corrected the change — and dates how long the host ran with logging off. A value that
    stays at 0 means the setting is not centrally enforced and the visibility gap persists until someone intervenes.
    Value deletions are not observable in this telemetry, so judge from the re-modification history.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications occurred on this host in the same session?
  context: An operator blinding PowerShell telemetry often adjusts other configuration in the same pass — additional
    logging channels, security tool policy keys, Run keys, or service settings landing within the same half hour
    indicate a hands-on session or an implant configuring itself. The triggering key will appear in the results; the
    signal is what else changed with it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this logging value been modified before on this host?
  context: Policy-managed values show a recognizable history — periodic identical writes from the policy engine as
    configuration refreshes. That history establishes what the value is supposed to be and who normally writes it.
    Zero history means this value has never been touched in the retention window, making a first-time write to 0 the
    stronger tampering signal.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same logging value zeroed on other hosts?
  context: The same value written to 0 across many hosts from the policy engine indicates a deliberate (if unusual)
    organizational configuration — verify it with whoever owns endpoint policy. The same change appearing on several
    hosts from interactive or script writers instead suggests an operator staging PowerShell evasion across systems.
    A single-host change points toward targeted tampering. Compare writing processes across hosts.
  range: +/-24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: The minutes around the change reveal the operating sequence — what delivered the tampering and what
    followed it. Repetitive agent telemetry collapses into high-count rows in the aggregation; novel parent-child
    pairs at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections — initial access, script execution, defense tampering — reveal the stages that preceded
    the logging change. Disabling PowerShell telemetry typically sits between a foothold being established and the
    main payload running, so the prior alert timeline frames what this change was preparing for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were persistence mechanisms installed on this host around the tampering?
  context: An attacker who cuts logging before running PowerShell commonly installs persistence in the same operation
    — scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions, now with reduced telemetry to record it.
    Persistence tool executions clustered around the logging change indicate foothold-building the tampering was
    designed to obscure.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
