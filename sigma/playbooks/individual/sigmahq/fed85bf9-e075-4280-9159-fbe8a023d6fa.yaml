name: Advanced IP Scanner - File Event
id: 1c44ced6-0761-4539-86ae-69f1395a04aa
description: |
  Advanced IP Scanner is a lightweight network discovery utility that enumerates live hosts, open ports, and shared resources across a subnet. This rule fires when the portable build extracts its files into 'AppData\Local\Temp\Advanced IP Scanner 2' under a user profile, which marks the tool being staged and run. Legitimate network administration uses the scanner, but it is also a common precursor to lateral movement -- establish whether the user and host have a sanctioned scanning role, whether the tool executed and swept the network, and what else happened on the host around the drop.
type: detection
detection_id: fed85bf9-e075-4280-9159-fbe8a023d6fa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the created file sit under 'AppData\Local\Temp\Advanced IP Scanner 2', and which process wrote it there?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires on any file written into the 'Advanced IP Scanner 2' folder under the user Temp directory -- the working directory the portable Advanced IP Scanner build extracts into on first run. Note the operation type and the responsible process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run Advanced IP Scanner?
  context: Legitimate network administration triggers this detection. Knowing whether the user role and host function include network scanning is often the fastest path to distinguishing sanctioned use from post-compromise reconnaissance. When the user is a machine or service account, judge by the writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the scanner still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A binary still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a portable run that removes itself, and shifts the focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is this the genuine Advanced IP Scanner, or a renamed or trojanized binary using the same folder?
  context: The filename and folder are a known signature, so the analyst likely recognizes the tool. Confirm it is the real utility rather than a decoy or wrapped binary reusing the path -- retrieve the file and check its size, embedded strings, and signing status from the endpoint or EDR. Hash-based reputation is a separate step, since the file-write event carries no hash.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the scanner has executed, what is its hash and does it have known AV or threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written (file-creation events carry no hash). This query finds the scanner executing and reads its hash; submit that to reputation or threat-intel services to determine whether it is the known-benign utility, a tampered build, or previously unseen. If the file is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Was the scanner executed after it was written to Temp?
  context: A dropped tool matters most once it runs. This checks whether the extracted binary launched as a process, marking the transition from staging to active reconnaissance. Correlating the file write to a later execution reveals the tool's lifecycle and whether it progressed from delivery to a network sweep.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After the scanner appeared, did this host open connections to many distinct internal addresses in a short window?
  context: Network Service Discovery shows up as one host probing a large set of destination IPs and ports within seconds -- the scan fan-out. Authorized scanners such as Nmap, Nessus, or sanctioned IT sweeps produce the same pattern, so confirm the source host against the inventory of approved scanning tools; a workstation with no scanning role generating a sweep of the local subnets is the deviation. A large count of unique destinations inside roughly a 60-second window is the typical threshold.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single scanner drop alongside native recon binaries -- whoami, ipconfig, net, nltest, nslookup, arp, netstat -- in rapid succession is a signature of post-compromise enumeration staged before lateral movement. For network discovery, net.exe, nltest.exe, arp.exe, and nbtstat.exe are the corroborating binaries to watch; three or more distinct recon tools within fifteen minutes typically indicates automated enumeration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process wrote the scanner to disk, and what launched that process?
  context: The parent chain reveals how the tool arrived. A scanner extracted by explorer.exe (a user double-clicking a portable executable) reads very differently from one written by a script interpreter, a remote-execution service such as wmiprvse.exe or wsmprovhost.exe, or an Office child process -- the latter point to automated or remote delivery rather than a hands-on admin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: A tool that extracts one file usually writes several -- a portable app unpacking its components, or a stager dropping additional payloads. The breadth, paths, and extensions of the writer's other file activity separate a self-contained utility run from broader staging, and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written into the 'Advanced IP Scanner 2' folder, and by which processes?
  context: The extraction directory under user Temp should only be populated by the scanner's own unpacking. Other writers, or unexpected file types landing in the same folder, reveal whether this is an isolated tool run or a location being reused for staging. The aggregation groups by path and writing process; a single unfamiliar writer across many files is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\Advanced IP Scanner 2\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is Advanced IP Scanner present on any other hosts in the environment?
  context: The same recon tool appearing on multiple hosts suggests deliberate distribution ahead of lateral movement rather than a one-off admin use. A single host may be targeted or an isolated administrative action; many hosts, especially within a tight window, indicate an operator staging discovery across the network. Determine the distribution pattern and timeline.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user produced this scanner-drop pattern before, and does that history fit their role?
  context: The query mirrors the rule's file-write pattern scoped to this user -- their 90-day history of dropping Advanced IP Scanner into Temp, aggregated by host. A user who has never done this is more notable than one who runs the tool routinely; weigh the count against whether network scanning belongs to their job.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\Advanced IP Scanner 2
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven the scanner-drop pattern before on this host or across the environment, or is the program new for this activity?
  context: 'When the write happens under a service or machine account, user identity does not attribute the behavior -- the launch mechanism does. The query mirrors the rule''s pattern scoped to the alerting program, giving its 90-day history of driving this drop. A new or rare program is the deviation worth chasing; a program already responsible for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\Advanced IP Scanner 2
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the scanner drop is isolated or one step in a broader hands-on-keyboard session touching multiple endpoints. Repeated activity by the same user on several hosts widens the likely scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window, or is it isolated to this host?
  context: 'Under a service principal, a user-pivot returns agent-telemetry noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same launch mechanism dropped the scanner elsewhere in the alert window: multiple hosts point to scripted or pushed distribution, a single host to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\Advanced IP Scanner 2
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating the host's process activity in a tight window around the drop surfaces what led to it and what followed -- credential access, additional reconnaissance, or the start of lateral movement -- while collapsing repetitive agent noise into high-count rows so novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: A network scanner rarely appears first in an intrusion. Earlier detections on the same host -- initial access, credential access, or defense tampering -- help place this discovery step in the wider timeline and reconstruct how the operator reached this stage.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
