name: Potential DLL Sideloading Of DbgModel.DLL
id: 138a98aa-7a6f-48df-9912-5a5203da378d
description: |
  Detects an image load of a file named dbgmodel.dll from a path outside the expected Windows system directories (System32, SysWOW64, WinSxS) and the Windows Kits / WinDbg debugger locations. dbgmodel.dll is a legitimate Windows debugging component; loading it from a non-canonical directory is a hallmark of DLL search-order hijacking, where a malicious copy is planted next to a vulnerable signed executable so it executes under a trusted process and evades application allow-listing. Investigation should confirm the module's path, signature, and hash, identify the loading process and how the DLL was planted, and determine whether the load is a first-time anomaly on the host or part of broader persistence.
type: detection
detection_id: fef394cd-f44d-4040-9b18-95d92fe278c0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and the process that loaded it. The rule fires when a file named dbgmodel.dll loads from anywhere other than System32, SysWOW64, WinSxS, the WinDbg store package, or the Windows Kits Debuggers folders. A genuinely signed Microsoft copy from one of those canonical paths would not have alerted, so the path itself is the primary signal; the load event also carries the DLL's hash and signing status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run the process that loaded this DLL?
  context: Legitimate debugging tools and some installers stage and load dbgmodel.dll from their own directories. Knowing whether the host's role (developer workstation, build server, general endpoint) and the acting user account are consistent with running a program that loads debugging libraries is often the fastest way to separate a benign relocated load from a planted one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented software deployment that explains this DLL load?
  context: Software installs, debugger deployments, and developer-tool rollouts can legitimately place dbgmodel.dll outside the canonical system directories. A corresponding change record or deployment window suggests authorized activity; absence of one when policy requires it moves the load toward unauthorized. This check can quickly close false positives or escalate true positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall installing or running software that would load this DLL?
  context: Direct confirmation from the person behind the account is often the fastest path to legitimacy. If the user recalls installing a debugger, SDK, or developer tool that carries its own dbgmodel.dll, the load is likely benign; if nobody recalls any activity that would place or load the DLL, the account may be compromised or the load driven by automated malware.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the dbgmodel.dll file still on disk at the loaded path for analysis?
  context: If the planted DLL still exists on disk, it can be hashed, submitted to a sandbox, and compared against the legitimate Microsoft-signed copy. Preserving it before it is deleted enables deeper analysis. This query correlates file activity to the alerting process and its direct children so an analyst can see whether that process also wrote the DLL or other artifacts.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other modules did this process load, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: 'The full set of modules a process loads shows whether the dbgmodel.dll load is isolated or part of a cluster of suspicious loads. Look for: (1) DLLs from %TEMP%, AppData, ProgramData, or Public alongside dbgmodel.dll — reinforcing a side-loading pattern; (2) unsigned modules in directories where signed ones are expected; (3) additional system-DLL names loaded from non-system paths — further search-order hijacking; (4) modules the loading process does not normally pull in. dbgmodel.dll is a debugging component, so a legitimate load is usually accompanied by other debugger modules from the same canonical directory.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded dbgmodel.dll, what is its signing status, hash, and threat-intel reputation?
  context: Module reputation distinguishes a relocated-but-legitimate DLL from a planted malicious one. A genuinely Microsoft-signed dbgmodel.dll (signer CN=Microsoft Corporation, O=Microsoft Corporation) loaded from an unexpected location may still be a benign staging by an installer; an unsigned copy, one with an invalid or mismatched signature, or a filename matching dbgmodel.dll with no valid Microsoft signature is a strong masquerading indicator. Hash lookups against threat intelligence surface known loaders, and the hash provides the baseline to compare against the legitimate system copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Was a dbgmodel.dll file written to this non-canonical location, and which process wrote it?
  context: DLL search-order hijacking begins with planting a dbgmodel.dll in a directory a vulnerable executable will search before the real system copy. Identifying the writing process and drop path shows how the DLL arrived — an installer, an archive extraction, a download, or an unexpected process. The legitimate file lives under System32, SysWOW64, WinSxS, or the Windows Kits Debuggers folders; a write anywhere else is the planting step and the point at which the payload entered the host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\dbgmodel.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: How was the process that loaded dbgmodel.dll invoked — what was its command line and working directory?
  context: A DLL is resolved relative to the loading process's own directory and current working directory before the system path, so the working directory (CurrentDirectory) is central to search-order hijacking. If the vulnerable executable was launched from the same user-writable directory where a dbgmodel.dll sits, that is the sideload path. The command line also reveals whether the process was started by hand, by a script, or by another program.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the executable that loaded this DLL, and is that parent chain expected?
  context: The parent process shows how the vulnerable executable came to run. Legitimate debugger and SDK launches usually have predictable parents (explorer.exe for user actions, a package manager, or an IDE). Unusual parents such as mshta.exe, wscript.exe, an Office application, or a process running from a user-writable directory suggest the executable was launched specifically to trigger the sideload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has dbgmodel.dll been loaded on this host before, and under which processes?
  context: A first-time load of dbgmodel.dll on a host is a stronger anomaly than a recurring one. If the same DLL has loaded under the same process binary repeatedly over the past 90 days, this load is probably routine debugger or SDK use. If this is the first occurrence, or if the DLL has historically loaded only under entirely different processes, the current load is anomalous and consistent with a newly planted copy.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is dbgmodel.dll being loaded on other hosts, especially under unexpected processes?
  context: 'Cross-host correlation surfaces the distribution of the load. The same DLL loading on one host may be a localized event; the same path and DLL loading across multiple hosts points to a shared installer, a deployed tool, or coordinated planting. Pay attention to the variety of loading processes: a single expected debugger loading it is benign, while the same DLL loaded under unrelated executables on several hosts suggests deliberate sideloading rather than legitimate software.'
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining process activity around the load reveals the immediate context: what launched the vulnerable executable, what ran before and after, and whether the load is part of a larger sequence. Look for archive extraction, downloads, reconnaissance, or persistence installation in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or a suspicious download — may reveal the stages that preceded the DLL load and help reconstruct the timeline. Sideloading is frequently the payload-execution step that follows an initial foothold, so preceding alerts can identify how the host was first accessed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were registry keys that control DLL search order or execution redirection modified on this host around the alert?
  context: Beyond planting a DLL next to a vulnerable binary, execution-flow hijacking can also redirect loading through registry keys — KnownDLLs, Image File Execution Options, App Paths, or service ImagePath entries. Modifications to these keys close to the DLL load may indicate a second, registry-based hijack path or persistence being established for the sideloaded payload.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_hijack:
        TargetObject|contains:
          - '\KnownDLLs\'
          - '\Image File Execution Options\'
          - '\App Paths\'
          - '\CurrentControlSet\Services\'
      condition: selection and selection_hijack
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After establishing one foothold, they commonly add backups using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe as the DLL load indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File-event monitoring captures these drops even when standard persistence tools are avoided, giving a parallel view of persistence installed alongside the sideloaded DLL.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
