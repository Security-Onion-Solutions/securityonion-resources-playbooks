name: DotNET Assembly DLL Loaded Via Office Application
id: 59a74278-f80a-4540-be55-5b62b12f9b5b
description: |
  Detects a Microsoft Office application (Word, Excel, PowerPoint, Outlook, OneNote, Publisher) loading a .NET
  assembly DLL from the global assembly cache path C:\Windows\assembly\. This module-load pairing appears when a VBA
  macro or Office add-in invokes managed-code or COM functionality directly inside the Office process (for example the
  Task Scheduler or WMI COM APIs), which pulls .NET assemblies into memory to run code or establish persistence without
  spawning the child processes that child-process-based detections watch for. Legitimate add-ins and some enterprise
  interop tooling also load managed assemblies, so the investigation should confirm which assembly loaded, verify its
  signature and reputation, identify the document that was opened, and check the same lineage for child processes and
  file writes.
type: detection
detection_id: ff0f2b05-09db-4095-b96d-1b75ca24894a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded assembly match what this rule detects across module path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded, expected under
    C:\Windows\assembly\), its code-signature status, and the Office application that loaded it against the rule's
    detection criteria. DLL loads carry a hash and signing status on the load event itself, so this can be judged
    without pivoting to a later execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run Office macros or add-ins that load managed .NET assemblies?
  context: Some development, finance, and reporting workflows legitimately use Office add-ins or macros that call into
    .NET/COM interop. Knowing whether this user role and host function normally involve such tooling is often the fastest
    way to separate a routine add-in from macro-driven code execution. A load running under SYSTEM or a machine account
    rather than the interactive user is a stronger anomaly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What DLLs and .NET assemblies did this Office process load, and are any unsigned or from non-canonical paths?
  context: The full set of modules the Office process loaded tells the story the command line cannot. Look for assemblies
    loaded from C:\Windows\assembly\ alongside modules from %TEMP%, AppData, ProgramData, or Public (side-loading), for
    unsigned modules where signed ones are expected, and for managed assemblies pulled in via reflection-style loading.
    Task Scheduler (taskschd.dll) and WMI (wbem\*.dll) modules loaded by an Office app indicate macro-driven scheduling
    or WMI execution that bypasses schtasks.exe- and child-process-based monitoring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For each assembly loaded by the Office process, what is its signing status, hash, and reputation?
  context: Module reputation separates a routine third-party assembly from a side-loaded malicious one. A validly signed
    Microsoft assembly loaded from the global assembly cache may still be legitimate interop; an unsigned module or one
    with a Microsoft-style name but no valid signature is a masquerading indicator. Watch SignatureStatus values of
    Unsigned, Expired, Distrusted, and Invalid, and pivot the Hashes value against threat intelligence. Trusted internal
    signers can be added to an allow list to suppress benign add-ins.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What document or file did the Office application open, and from which directory?
  context: Malicious-file execution starts with a document or attachment the user opened. Pivoting from the load event to
    the Office process command line reveals the file being processed. Check whether the file path sits in a user-writable
    staging location such as Downloads, %TEMP%, Desktop, or an email or collaboration cache rather than a managed
    document library, which raises the likelihood the document was attacker-delivered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What email, document, or download launched the Office application?
  context: User execution typically begins with a phishing attachment, a link, or a file dropped from a browser or chat
    client. Identifying what launched the Office process, and whether it was opened from an email client or downloaded
    file, enables blocking at the perimeter and searching for other recipients. The download provenance of the file
    (mark-of-the-web / alternate data stream) is not collected as endpoint telemetry here, so confirm the delivery path
    through mail-gateway records or the endpoint console when the parent context is inconclusive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What child processes did the Office application spawn after loading the assembly?
  context: The processes an Office app spawns reveal the actual impact of macro-driven execution. Office rarely launches
    OS utilities; children such as powershell.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe,
    regsvr32.exe, msiexec.exe, curl.exe, or bitsadmin.exe point to a living-off-the-land follow-on stage. Where a child
    is present, check it for immediate outbound HTTP(S), DNS, or SMB against non-corporate destinations, which completes
    the delivery-to-egress chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files did the Office process or its children write to disk, and are any still available for analysis?
  context: Managed-code execution inside Office often stages a payload, a decoded script, or a dropped executable in a
    user-writable path. Correlating file writes to the Office process and its direct children shows what artifacts were
    created and whether they remain on disk for hashing, sandbox submission, or content review. Give extra weight to
    writes with executable or script extensions (exe, scr, dll, js, vbs, bat, cmd, ps1, hta, iso) or double extensions
    landing in Downloads, %TEMP%, Desktop, or AppData staging.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this assembly been loaded on this host before, and by which processes?
  context: A first-time module load on a host is a stronger anomaly signal than a recurring one. If the same assembly has
    been loaded repeatedly by the same Office binary over the past 90 days, this load is probably routine interop. If it
    is the first occurrence, or the assembly has historically been loaded only by unrelated processes, the current load
    stands out.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously fired this rule's pattern, what programs and users drove it, and does the current
    alert fit?
  context: Even routine interop can look like this rule's firing pattern. The query mirrors the rule's selection scoped
    to this host, so the resulting program and user distribution reflects how an Office application loading an assembly
    from the global assembly cache has historically run here. A new Office application, an unexpected user account, or a
    machine-account load that departs from the established pattern is the deviation worth chasing; image-load events
    carry no parent lineage, so pivot to the Office process's start event if launch lineage matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \onenote.exe
        - \onenoteim.exe
        - \outlook.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|startswith: C:\Windows\assembly\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Is this Office installation current with security patches?
  context: Many user-execution paths rely on macro, OLE, or DDE handling in Office, and some exploit known parsing
    vulnerabilities. Confirming whether this Office build carries recent security updates indicates whether exploitation
    was possible and whether other similarly unpatched hosts are exposed. Patch status also helps distinguish abuse of a
    known CVE from a novel technique.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in the minutes around the load reveals what led
    to the document being opened and what followed, and whether the load is part of a larger sequence involving
    reconnaissance, credential access, or persistence. Aggregating by process and parent collapses routine agent noise
    while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts loaded an assembly into an Office application from the global assembly cache in the past week?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific
    load pattern rather than generic Office usage. Many hosts firing the same pattern points to a deployed add-in or
    scripted interop; one host or a small unrelated set points to targeted, operator-driven activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \mspub.exe
        - \onenote.exe
        - \onenoteim.exe
        - \outlook.exe
        - \powerpnt.exe
        - \winword.exe
        ImageLoaded|startswith: C:\Windows\assembly\
      condition: selection
    fields:
    - host.name
- question: Were other users or hosts targeted by the same delivery, and did this rule fire elsewhere?
  context: Phishing and document-borne campaigns rarely target a single user. Correlating this rule across all hosts
    shows the breadth of the activity and surfaces additional systems where the same Office-to-assembly load occurred and
    that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, or defense tampering — may reveal the
    attack stages that preceded this load and help reconstruct the timeline. A sequence of alerts on one host usually
    tells a clearer story than any single event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
