name: Suspicious Scheduled Task Name As GUID
id: bba08deb-c244-425f-95fb-29e5b794c1d3
description: |
  Detects schtasks.exe /Create invocations where the task name (/TN) is a GUID-format
  string such as {97F2F70B-10D1-4447-A2F3-9B070C86E261}. The rule fires only when all
  three conditions match: the schtasks /Create command, a /TN argument opening with a
  brace, and a closing-brace terminator. Legitimate Microsoft tasks under the
  \Microsoft\Windows\ namespace rarely use GUID-only names, so this naming convention is
  a common persistence-installation signature for commodity loaders that disguise their
  task among system-looking entries. Investigation should confirm the GUID-named task,
  decode the command it runs (/TR), determine when and whether it has executed, and check
  whether the same persistence pattern appears across the host's history or the fleet.
type: detection
detection_id: ff2fff64-4cd6-4a2b-ba7d-e28a30bbe66b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line show schtasks /Create with a GUID-format task name?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires only when all three criteria are present together - the schtasks /Create
    command, a /TN argument that opens with a brace, and a closing-brace terminator -
    producing a task name in the {xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx} format. Verify the
    command line carries all three before proceeding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to create scheduled tasks from the command line?
  context: Legitimate administrative activity can trigger this detection. Scheduled tasks
    are usually deployed centrally via group policy or management tooling rather than by
    direct schtasks.exe on a workstation. Knowing whether this account and host routinely
    register tasks by hand is often the fastest path to separating a routine admin action
    from an attacker establishing persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What scheduled task was created, and what command does it execute?
  context: The schtasks command line carries the task name (/TN), the command or program
    to run (/TR), the schedule type (/SC such as ONLOGON, MINUTE, DAILY), and the run-as
    account (/RU - SYSTEM is high-risk). The /TR value reveals the persistence payload,
    which for this naming pattern is often a script, binary, or a download cradle invoked
    through cmd or powershell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the task command (/TR) encoded or obfuscated, and what does it decode to?
  context: The payload behind a GUID-named task is frequently hidden from casual inspection.
    Common patterns include base64 in a powershell -EncodedCommand or IEX cradle, character
    concatenation, and values read from a registry blob and decoded at runtime. Decoding the
    /TR argument reveals the real intent - download cradle, in-memory loader, reverse shell,
    or registry-backed retrieval. Iterate decoding for multi-layer encoding until the command
    is readable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was a Task Scheduler creation or modification event logged for this task name?
  context: Task creation also produces a security audit event (Task Scheduler operational
    and security channels) independent of the process_creation evidence. That record carries
    the full registered task name and the account that created it, confirming the GUID-format
    name actually became a registered task rather than a failed or malformed invocation. If
    these audit events are not collected in this environment, treat their absence as a
    visibility gap rather than evidence the task was not created.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - TaskName
      - SubjectUserName
- question: Were Task Scheduler registry entries written for this task on the host?
  context: Registered tasks are persisted under the TaskCache registry tree, so task creation
    leaves registry-set artifacts under Schedule\TaskCache\Tree and \Tasks even when the
    creating command is missed. These entries store the task name and a GUID identifier and
    survive reboots, so confirming the registry footprint shows the persistence was committed
    to disk and helps locate the on-disk task definition for removal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      category: registry_set
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: When is the task scheduled to run, and has it already executed?
  context: The trigger schedule determines when the persistence activates. Tasks set to run
    at boot or logon fire on the next restart; recurring tasks (every few minutes, daily)
    may already have executed several times. Scheduled tasks run as children of the Task
    Scheduler service, so processes spawned by svchost.exe hosting the Schedule service after
    task creation indicate the payload has run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the scheduled task still registered on the system?
  context: Persistence is only effective while the task exists, and some operators delete the
    task after a single execution to reduce forensic artifacts. Confirming the GUID-named task
    is still present (via schtasks /query or the Task Scheduler console) determines whether the
    persistence mechanism is active and requires removal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        Image|endswith: \schtasks.exe
        CommandLine|contains: '/Create '
      selection_tn:
        CommandLine|contains:
        - /TN "{
        - /TN '{
        - /TN {
      selection_end:
        CommandLine|contains:
        - '}"'
        - '}'''
        - '} '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        Image|endswith: \schtasks.exe
        CommandLine|contains: '/Create '
      selection_tn:
        CommandLine|contains:
        - /TN "{
        - /TN '{
        - /TN {
      selection_end:
        CommandLine|contains:
        - '}"'
        - '}'''
        - '} '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity
    spanning multiple endpoints. If the same account triggered similar task creation on several
    hosts, the scope of the persistence operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        Image|endswith: \schtasks.exe
        CommandLine|contains: '/Create '
      selection_tn:
        CommandLine|contains:
        - /TN "{
        - /TN '{
        - /TN {
      selection_end:
        CommandLine|contains:
        - '}"'
        - '}'''
        - '} '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this GUID-named-task pattern, what parents and
    users normally drive it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how this specific
    firing pattern - not generic schtasks usage - has historically run here. A new parent
    process, an unexpected user account, or an unusual command-line structure is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        Image|endswith: \schtasks.exe
        CommandLine|contains: '/Create '
      selection_tn:
        CommandLine|contains:
        - /TN "{
        - /TN '{
        - /TN {
      selection_end:
        CommandLine|contains:
        - '}"'
        - '}'''
        - '} '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this GUID-named-task pattern in the past week, and does the
    cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a
    fleet-wide count of this specific firing pattern rather than generic schtasks usage. Many
    hosts firing the same pattern points to scripted deployment or vendor automation; one host or
    a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        Image|endswith: \schtasks.exe
        CommandLine|contains: '/Create '
      selection_tn:
        CommandLine|contains:
        - /TN "{
        - /TN '{
        - /TN {
      selection_end:
        CommandLine|contains:
        - '}"'
        - '}'''
        - '} '
      condition: all of selection_*
    fields:
    - host.name
- question: How often has this host fired the schtasks GUID-name pattern over the past 90 days,
    and what command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one used regularly
    under stable parents. The query mirrors the rule's selection structure scoped to this host,
    so the count reflects this specific firing pattern rather than generic schtasks usage. The
    command-line projection lets the analyst compare typical invocation patterns against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
        Image|endswith: \schtasks.exe
        CommandLine|contains: '/Create '
      selection_tn:
        CommandLine|contains:
        - /TN "{
        - /TN '{
        - /TN {
      selection_end:
        CommandLine|contains:
        - '}"'
        - '}'''
        - '} '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Was schtasks.exe executed from its expected System32 path?
  context: A LOLBin executed from a non-standard path (outside System32 or SysWOW64) may have
    been copied or renamed to evade path-based allowlists. A schtasks.exe running from a user's
    temp or AppData directory is more suspicious than one in System32; compare the Image path
    and OriginalFileName to confirm it is the genuine system binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other persistence or proxy-execution LOLBins used on this host recently?
  context: Operators who use one LOLBin to install persistence often use several. After
    registering a scheduled task, check whether reg.exe, sc.exe, bitsadmin, or proxy-execution
    binaries such as rundll32, regsvr32, or mshta also ran on the host - finding multiple LOLBins
    working toward the same foothold strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\bitsadmin.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\certutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
