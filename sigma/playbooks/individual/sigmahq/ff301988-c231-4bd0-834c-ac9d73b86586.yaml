name: PowerShell Console History Logs Deleted
id: eebffd5b-9bc8-40ee-9bb0-934814b9a5af
description: |
  Detects deletion of the PowerShell console history file written by PSReadLine, whose path ends in
  \PSReadLine\ConsoleHost_history.txt. The file holds the plain-text record of every command typed into an
  interactive PowerShell session, so its removal takes away the artifact an investigation would normally read
  first; the same removal is also produced routinely by profile-cleanup utilities, roaming-profile resets, and
  privacy tools. The deleted content cannot be recovered from the deletion event, so the investigation turns on
  which process performed the deletion and what launched it, whether script block logging captured the commands
  the history would have held, and whether the removal sits alongside other evidence-suppression actions or
  matches an established cleanup cadence on the host.
type: detection
detection_id: ff301988-c231-4bd0-834c-ac9d73b86586
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the deleted path match the PowerShell console history file this rule detects, and which process performed the deletion?
  context: >-
    The rule fires on a single condition: a file whose path ends in \PSReadLine\ConsoleHost_history.txt was
    deleted. Confirm the exact path, the operation recorded against it, and the responsible process before
    investing further time. The signer columns attribute the acting process to a vendor — read them for
    coherence with a PowerShell profile file rather than as a verdict, since essentially every process on
    Windows is trusted-signed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to delete the PowerShell console history file?
  context: >-
    Profile-cleanup utilities, roaming-profile churn, and privacy tools remove ConsoleHost_history.txt as
    routine maintenance, and some users clear it deliberately. The user's role and the host's function are
    often the fastest way to separate that from an operator removing the record of what they typed. When the
    user is a machine or service account, judge by the deleting process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was the history file recreated after the deletion, or does the path stay absent?
  context: >-
    PSReadLine rewrites ConsoleHost_history.txt as soon as another interactive PowerShell session runs, so a
    file that reappears within minutes is consistent with normal session churn following a cleanup. A path that
    stays absent, or one that is deleted again each time it reappears, points at sustained suppression rather
    than one-off maintenance. Read the operation type on each row to tell recreation from repeat deletion.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which process deleted the history file, and what launched it?
  context: >-
    The deletion event names the acting process but not its origin. Retrieving that process's own start event
    surfaces its full command line and the parent that launched it. A profile-cleanup utility, an installer, or
    explorer.exe fits routine maintenance; a script host, a remote-management agent, or a shell spawned from an
    unusual parent redirects the investigation toward the session whose record was removed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did the deleting command target only the console history file, or a wider set of evidence?
  context: >-
    Read the responsible process's command line to see how the history file was named — explicitly, matched by
    a wildcard sweep over the PSReadLine directory, or removed as one path among many. A Remove-Item over
    several evidence paths, a log-clearing sequence, and a profile-wide cleanup each imply different scope. If
    the command line is base64-encoded via -EncodedCommand or built from concatenated strings and backticks,
    decode it before judging intent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Whose history file was removed, and does the deleting process read as maintenance or as evidence removal?
  context: >-
    The deletion event carries the full path, which identifies the profile the history belonged to, and the
    process that performed it. A cleanup utility, a sync or backup client, or a profile-management agent
    removing its own user's file reads as maintenance; a shell, script host, or ad-hoc tool removing another
    account's history does not. The file's contents cannot be read back from this event — only the fact of the
    deletion and the actor.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Did PowerShell script block logging capture the commands the deleted history would have held?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell executed, independent of the PSReadLine
    history file. Where it is enabled it is the surviving record of what ran in the session whose history was
    removed, including the deletion itself. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What other files did the deleting process, or its children, write or delete around the alert?
  context: >-
    A process that removes one evidence file often touches several — history files under other profiles,
    transcript output, temporary scripts it staged, or its own dropped tooling. The breadth and location of its
    other file activity separates a targeted removal from a profile-wide cleanup pass. Read the operation type
    on each row, since creations and deletions by the same process mean different things.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did the deleting process launch after the history file was removed?
  context: >-
    Removal of a command record is often one step in a sequence. Processes spawned by the deleting process in
    the window after the deletion show whether additional cleanup followed — event log clearing, shadow-copy
    removal, transcript deletion — or whether a maintenance task simply exited. An empty result narrows the
    deletion to a self-contained operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Were other defense tampering or evidence removal actions performed on this host?
  context: >-
    Operators who remove one record commonly remove several — clearing event logs, deleting shadow copies,
    disabling real-time protection, or stopping the services that produce the evidence. This looks for the
    common tooling for those actions on the host within an hour either side of the deletion. Several such
    actions clustered in one window point to a deliberate sweep; none, combined with a familiar cleanup
    process, points back to maintenance.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were the Windows event logs cleared or the audit policy changed around the deletion?
  context: >-
    Event ID 1102 records that the Security log was cleared and 4719 records a change to the audit policy; both
    are the channel-level counterpart of removing a command history. Either one within hours of the history
    deletion places the file removal inside a wider evidence-suppression sequence rather than routine profile
    cleanup. If the Security channel is not collected from this host, zero results are a visibility gap.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 1102
          - 4719
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - SubjectDomainName
- question: Were PowerShell logging policies or shell history registry values modified around the deletion?
  context: >-
    Indicator removal extends into the registry. Turning off script block logging, module logging, or
    transcription stops the evidence being produced at all, and the Explorer MRU and typed-path values hold
    their own record of what was run. Values under the PowerShell policy keys set to 0 disable the
    corresponding log; modifications to any of these in the same window as the history deletion indicate the
    record was suppressed at more than one layer.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_indicator:
        TargetObject|contains:
          - '\PowerShell\ScriptBlockLogging'
          - '\PowerShell\ModuleLogging'
          - '\PowerShell\Transcription'
          - '\Explorer\RunMRU'
          - '\Explorer\TypedPaths'
          - '\Explorer\RecentDocs'
      condition: selection and selection_indicator
    fields:
      - TargetObject
      - Details
      - Image
- question: How often has the console history file been deleted on this host before, and by which processes?
  context: >-
    PSReadLine history removal is a normal by-product of profile-cleanup utilities, roaming-profile resets, and
    privacy tools; on a host where those run, the file is deleted on a regular cadence by a consistent process.
    A count near zero over 90 days, or an established cadence with an unfamiliar process performing this one,
    marks the alerting deletion as the deviation to pursue.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - User
- question: Has this user deleted the PowerShell console history before, and does that history fit their role?
  context: >-
    The query counts this user's own deletions of the console history file over 90 days, aggregated by host. A
    developer or administrator whose cleanup routine removes it weekly produces a steady count; a user with no
    prior deletions is the deviation. Weigh the count against the user's role and normal toolset. When the
    alert fires under SYSTEM, a service principal, or a machine account, this pivot attributes nothing — read
    the acting-program baseline instead.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \PSReadLine\ConsoleHost_history.txt
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this program deleted console history files before, on this host or elsewhere, or is it new for this activity?
  context: >-
    The query counts this program's own deletions of the console history file over 90 days, aggregated by host.
    A cleanup utility, backup client, or management agent that already accounts for thousands of these across
    the environment is vendor or operating-system automation; a program that is new or rare for this action is
    the deviation worth chasing. This pivot holds when the alert fires under a service principal and user
    identity attributes nothing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \PSReadLine\ConsoleHost_history.txt
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user run across the environment around the time of the deletion?
  context: >-
    The user's process activity across all hosts in the hour around the deletion shows whether the removal was
    an isolated action inside one session or one step among several across multiple endpoints. Similar activity
    on other hosts widens the scope of the investigation. Under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a
    machine account this returns routine agent telemetry — read the program-pivot question instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same program delete console history files on other hosts in the same window?
  context: >-
    The query counts this program's deletions of the console history file across the environment in the hour
    around the alert. Several hosts in the same window points to scheduled or pushed automation — a cleanup
    policy, an imaging step, a management task. A single host points to a host-local trigger, which is the case
    that warrants tracing the session whose record was removed.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \PSReadLine\ConsoleHost_history.txt
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before the deletion?
  context: >-
    Earlier detections on the same host — credential access, reconnaissance, remote execution, or other
    tampering — indicate what the removed command record may have covered. Indicator removal typically follows
    the activity it is meant to conceal, so the preceding alert timeline is often the closest available
    substitute for the deleted history.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
