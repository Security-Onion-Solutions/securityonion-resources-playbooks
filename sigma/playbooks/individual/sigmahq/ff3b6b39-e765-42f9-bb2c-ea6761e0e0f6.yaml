name: Mstsc.EXE Execution From Uncommon Parent
id: 7bdeeda8-abe7-4e37-96e0-c86a191cc167
description: |
  Detects mstsc.exe (the RDP client) launched by a web browser or email client rather than by explorer.exe or a user shortcut.
  The rule fires when ParentImage ends in a browser or mail-client binary (brave, chrome, chromium, edge, firefox, iexplore, opera, vivaldi, whale, outlook) AND the child is mstsc.exe (by Image or OriginalFileName). This parent-child pattern is the signature of a user double-clicking a ".rdp" file that arrived as an email attachment or web download, which connects the workstation to an attacker-controlled RDP server; on connect, drive/clipboard/printer redirection can stream the victim's local files and clipboard back to the attacker, and the remote session can drop payloads onto the local disk. Legitimate mstsc launches almost always come from explorer.exe, a pinned shortcut, or a management tool, not from a browser or Outlook. Investigation should confirm the parent chain, recover the .rdp file and connection target, and check for non-standard outbound RDP ports and any executable files written by mstsc.exe.
type: detection
detection_id: ff3b6b39-e765-42f9-bb2c-ea6761e0e0f6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Did mstsc.exe launch from a browser or email-client parent as the rule detects?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule fires only when the child is mstsc.exe (by Image or OriginalFileName) AND the parent ends in a browser or mail-client binary such as chrome.exe, msedge.exe, firefox.exe, or outlook.exe. Verify both halves match before investing further investigation time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this user and host expected to launch RDP sessions from a browser or email client?
  context: Legitimate RDP connections almost always start from explorer.exe, a pinned shortcut, or a management console - not from a browser or Outlook. Knowing whether this user routinely opens ".rdp" files this way, and whether the host is an admin jump box versus a standard workstation, is often the fastest way to separate a genuine rogue-RDP delivery from an unusual but benign workflow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this browser or mail client expected to spawn mstsc.exe, and what started the parent?
  context: The parent-child relationship is the core signal for this detection. A browser or Outlook spawning mstsc.exe typically means a user opened a ".rdp" file delivered by email or web. Tracing the parent's own origin shows whether the chain is a routine user action or whether the parent was itself launched by something unusual.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What email, download, or link delivered the file that launched this RDP session?
  context: A browser or mail-client parent points to a delivered ".rdp" file. Recover the parent's command line and the originating message or download to identify the sender, attachment name, or URL. This enables blocking the file at the perimeter and finding other recipients who received the same delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent instance spawn?
  context: If the browser or mail-client instance that launched mstsc.exe also spawned other processes, those siblings reveal the full scope of what the opened file triggered. Multiple unexpected children from the same parent points to more than a single RDP launch.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What .rdp file and connection target did mstsc.exe use? Decode its command line.
  context: The mstsc.exe command line carries the path to the ".rdp" file and often the target address. Recover the .rdp file from disk and read its options - especially the full address (host and port) and any drive, clipboard, printer, or smartcard redirection settings, which is how a rogue RDP server harvests local files and peripherals. A user-writable source path (Downloads, Desktop, %TEMP%, AppData) reinforces a delivered-file origin.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What outbound RDP connection did this host make, and was the destination port non-standard?
  context: A rogue RDP server is frequently reached on a non-3389 port to evade scanning and outbound 3389 blocks, and the destination is typically an external, non-internal address. Examine connections from this host on RDP and common remote ports around the alert; an outbound RDP-style connection to an external IP on an unusual port is a high-value confirmation of attacker-controlled infrastructure.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: Did mstsc.exe write any executable or shortcut files to the local disk?
  context: Legitimate RDP sessions almost never write executables locally. Drive redirection on a rogue RDP connection lets the remote session drop a payload onto the victim - commonly a .lnk, .exe, .dll, .config, .ps1, .vbs, or .bat - including into Startup folders for persistence. File-write events authored by mstsc.exe of those types strongly indicate payload delivery and warrant recovery and reputation checks of the dropped file.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \mstsc.exe
        TargetFilename|endswith:
          - .lnk
          - .exe
          - .dll
          - .config
          - .ps1
          - .vbs
          - .bat
      condition: selection
    fields:
      - TargetFilename
      - User
      - EventType
- question: What processes ran on this host shortly after the RDP session started?
  context: A rogue RDP connection is a means to an end - the redirected drive or a dropped payload may lead to follow-on execution. Examining processes that started shortly after the connection reveals whether the session produced reconnaissance, tool execution, or persistence on the workstation.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \brave.exe
        - \CCleanerBrowser.exe
        - \chrome.exe
        - \chromium.exe
        - \firefox.exe
        - \iexplore.exe
        - \microsoftedge.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        - \whale.exe
        - \outlook.exe
      selection_img:
      - Image|endswith: \mstsc.exe
      - OriginalFileName: mstsc.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \brave.exe
        - \CCleanerBrowser.exe
        - \chrome.exe
        - \chromium.exe
        - \firefox.exe
        - \iexplore.exe
        - \microsoftedge.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        - \whale.exe
        - \outlook.exe
      selection_img:
      - Image|endswith: \mstsc.exe
      - OriginalFileName: mstsc.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the rogue-RDP delivery is isolated or part of broader hands-on activity. If the same user triggered similar actions on multiple hosts, the scope may be larger than a single workstation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \brave.exe
        - \CCleanerBrowser.exe
        - \chrome.exe
        - \chromium.exe
        - \firefox.exe
        - \iexplore.exe
        - \microsoftedge.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        - \whale.exe
        - \outlook.exe
      selection_img:
      - Image|endswith: \mstsc.exe
      - OriginalFileName: mstsc.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Activity around the alert reveals what led to the RDP launch and what followed it. Aggregating process activity by image and parent collapses routine noise so novel parent-child pairs stand out for review.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, defense tampering, or other delivery alerts - may reveal the stages that preceded this event and help reconstruct the timeline leading to the RDP launch.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other users or hosts hit by the same rule, suggesting a delivery wave?
  context: A weaponized ".rdp" file is rarely sent to a single user. Correlating the same detection across other hosts reveals whether a delivery wave reached multiple recipients and identifies additional systems that opened the file and need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this browser-or-mail-client spawning mstsc.exe occurring on other hosts?
  context: The same parent-child pairing appearing across multiple hosts may indicate a phishing wave or a shared malicious file circulating in the environment. A single occurrence is more likely targeted. Enterprise-wide comparison calibrates severity and scopes the affected population.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
