name: User Added to Remote Desktop Users Group
id: c1aa9e53-36aa-470c-a805-df9bb97a6860
description: |
  Detects a command line that adds a user to the local Remote Desktop Users group, either through 'net localgroup ... /add' or 'Add-LocalGroupMember -Group', matched against the group name in English, French, or Spanish. Granting Remote Desktop Users membership enables interactive RDP logon for that account, so this is routinely an administrative action but is also a common way to establish remote-access persistence after a host is compromised. The investigation should confirm the group change actually succeeded, determine who ran it and whether that user and host normally perform account administration, and check whether the newly enabled account is subsequently used for remote logon or lateral movement.
type: detection
detection_id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line add a user to the Remote Desktop Users group via net localgroup or Add-LocalGroupMember?
  context: Confirm the alert is a true positive before investing further time. The rule fires when the command line both performs a group add ('localgroup ... /add' or 'Add-LocalGroupMember -Group') and references the Remote Desktop Users group name in English, French, or Spanish. Read the full command line and identify which account is being granted membership.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to manage local group membership for remote access?
  context: Legitimate administrative activity is the documented false positive for this rule. Knowing whether the acting user holds an admin role and whether this host is one where group administration normally happens is often the fastest way to separate routine maintenance from an attacker enabling remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the command do? Decode the full command line and identify which account was added to the group.
  context: The full command line reveals the target account and the exact method used. Identify the account name being added, whether it is a built-in account, a newly created local account, or a domain account, and whether any additional flags or chained commands ran in the same invocation. The query returns all matching group-add commands on this host in a tight window so multi-step operations are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cmd:
      - CommandLine|contains|all:
        - 'localgroup '
        - ' /add'
      - CommandLine|contains|all:
        - 'Add-LocalGroupMember '
        - ' -Group '
      condition: selection and selection_cmd
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did the group change succeed? Is there a Security log event showing a member added to the Remote Desktop Users group?
  context: A command to modify group membership does not guarantee success; insufficient privileges or policy can block it. Windows Security event 4732 (member added to a security-enabled local group) confirms the change occurred and records the account that was added. Absence of a corresponding 4732 around the command time suggests the add failed or that group-membership auditing is not collected on this host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4728
          - 4732
          - 4756
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - SubjectUserName
- question: What process spawned this command and is that parent chain expected?
  context: The parent process reveals how the group-add was invoked. An interactive admin session (explorer.exe, a console host launched by a logged-on user) fits routine administration; an unusual parent such as a script host, an Office application, or a remote-execution service points to automated or attacker-driven invocation. Walk up to the parent to see what launched it and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main:
      - CommandLine|contains|all:
        - 'localgroup '
        - ' /add'
      - CommandLine|contains|all:
        - 'Add-LocalGroupMember '
        - ' -Group '
      selection_group:
        CommandLine|contains:
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main:
      - CommandLine|contains|all:
        - 'localgroup '
        - ' /add'
      - CommandLine|contains|all:
        - 'Add-LocalGroupMember '
        - ' -Group '
      selection_group:
        CommandLine|contains:
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar administrative or remote-access activity on other hosts in the same window, the scope of the event may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main:
      - CommandLine|contains|all:
        - 'localgroup '
        - ' /add'
      - CommandLine|contains|all:
        - 'Add-LocalGroupMember '
        - ' -Group '
      selection_group:
        CommandLine|contains:
        - Remote Desktop Users
        - "Utilisateurs du Bureau \xE0 distance"
        - Usuarios de escritorio remoto
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What did this user do next on this host?
  context: Follow-on activity reveals the next steps after the group change. Look for privilege escalation, additional account or group modifications, persistence installation, or attempts to use the newly granted remote access by the same user on this host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other local-group or account-administration commands ran on this host in the next four hours, and does the parent or command-line structure change?
  context: 'Under a service principal, asking what the user did next is unbounded. A more focused follow-on for automation-driven alerts is to track repeat account-administration on the same host: routine configuration management repeats with stable parents and command-line structures, whereas a change in parent or command-line structure in the follow-on window is the signal worth chasing.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cmd:
        CommandLine|contains:
          - 'net user'
          - 'net localgroup'
          - 'Add-LocalGroupMember'
          - 'New-LocalUser'
          - 'Set-LocalUser'
      condition: selection and selection_cmd
    fields:
      - ParentImage
      - CommandLine
- question: Are there other detections for this user on other hosts in the past day?
  context: If the same user triggered alerts on multiple hosts, the activity may extend beyond a single endpoint. Check for lateral movement patterns or repeated account-administration across the environment by this user.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        user.name|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Did this same rule fire on other hosts in the past day, and does the cross-host pattern look like coordinated automation or an isolated detection?
  context: 'Under a service principal, alerts for the acting user match everywhere because the principal is omnipresent. The triage-useful question is whether this specific rule fires on multiple hosts: a rule firing across many hosts on the same day is probably tracking scheduled or pushed administration, while a rule firing on one host alone is the deviation worth chasing.'
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
- question: Was the newly added account used for logon or process execution after the group change?
  context: Adding an account to Remote Desktop Users is a means to an end, granting that account interactive RDP logon. Process executions or new sessions attributed to the added account shortly after the change indicate the remote access was actually used. Substitute the account name from the decoded command line into the analysis when reviewing results.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|contains:
          - 'Administrator'
          - 'guest'
          - 'DefaultAccount'
      condition: selection
    fields:
      - host.name
      - Image
      - User
- question: Did remote-access gateway or VPN logs show external sessions for the added account after the group change?
  context: Granting Remote Desktop Users membership is frequently a step toward enabling external remote access. Remote-access gateway, VPN, and Citrix logs record external source addresses and session establishment for accounts, which process and Security logs do not capture. External sessions for the newly added account from uncommon source addresses or outside business hours strengthen the case that the change enabled unauthorized remote entry. If application-channel remote-access logs are not collected in this environment, treat zero results as a visibility gap rather than evidence nothing happened.
  range: +4h
  query: |
    aggregation: false
    logsource:
      service: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - EventID
- question: Was there a change ticket, maintenance window, or documented approval for adding this account to the Remote Desktop Users group?
  context: Many organizations require change records for account and group modifications. A corresponding ticket or maintenance window suggests authorized administration; the absence of one when policy requires it suggests the change was unauthorized. This check is often the fastest way to close a false positive or escalate a true positive, and it must be answered from change-management systems outside of log data.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
