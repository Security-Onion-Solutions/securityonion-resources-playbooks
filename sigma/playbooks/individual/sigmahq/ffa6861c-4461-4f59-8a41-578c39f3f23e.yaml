name: LSASS Dump Keyword In CommandLine
id: 5be00532-1702-4836-b594-9541a2484055
description: |
  Detects command lines containing keywords associated with dumping the LSASS process to disk, such as the literal strings
  lsass.dmp / lsass.zip / lsass.rar / nanodump / SQLDmpr or the combination of "lsass" and ".dmp" in a single command.
  LSASS process memory holds plaintext credentials and NTLM hashes when Credential Guard is not enabled, so a dump file is
  typically staged for offline extraction with Mimikatz or pypykatz. Legitimate hits are rare (a crash-analysis dump of an
  unrelated process, a file named for testing); the investigation should confirm whether LSASS memory was actually accessed
  and dumped, by whom, and whether the resulting credentials were used to move laterally.
type: detection
detection_id: ffa6861c-4461-4f59-8a41-578c39f3f23e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-06
questions:
- question: Does the command line contain the LSASS dump keywords this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line against
    the rule's criteria. The rule fires on dump-file keywords (lsass.dmp, lsass.zip, lsass.rar, nanodump, SQLDmpr) or the
    pairing of "lsass" with ".dmp" in one command. Read the full command to see which keyword matched and whether it names
    a real LSASS dump or an unrelated artifact that happens to contain the string.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to dump process memory or run credential-access tooling?
  context: Legitimate administrative or crash-analysis activity can produce a dump file, but a routine workstation user dumping
    LSASS is rarely expected. Knowing whether the user role (admin, incident responder, developer) and host function (a debug
    or DFIR workstation versus a general endpoint) fit the detected behavior is often the fastest path to distinguishing a
    sanctioned operation from credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was LSASS memory actually accessed or dumped, and by what method?
  context: The command line reveals which LSASS dumping method was used and whether the dump targets memory or a file on disk.
    Identify the mechanism — procdump, comsvcs.dll MiniDump, nanodump, a SQLDumper variant, or a custom dumper — because the
    method indicates attacker sophistication and which evasion was attempted. A successful dump means the credentials cached
    in LSASS for every account logged on to this host should be treated as exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the dump command was invoked. A dump launched from explorer.exe or an admin shell
    during sanctioned work looks different from one spawned by office applications, script hosts (wscript.exe, mshta.exe),
    or a remote-execution service (WmiPrvSE.exe, services.exe from a scheduled task) — the latter point to hands-off or remote
    operator activity. Walk up the tree to see what spawned the parent and what else it launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did the alerting process, or a process it spawned, write any file to disk around the time of the command line match?
  context: The handle-open that actually reads LSASS memory — OpenProcess into lsass.exe with full access rights — leaves
    no artifact of its own in the available telemetry, so a query for that handle open would always return zero results
    regardless of whether the read occurred. What is observable is the file the dump produces; this checks for any file
    written by the alerting process itself or by a process it spawned, independent of whether the filename matches the
    rule's keyword list, in case the operator renamed the output.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a dump file written to disk on this host, and where?
  context: A memory dump typically lands as a file before it is staged for exfiltration. Dump files are commonly written to
    operator-controlled staging paths such as %TEMP% or C:\Windows\Temp under names matching the rule keywords. Locating the
    file, its directory, and its creation time confirms the dump completed and shows where the credential material now sits;
    the gap between the file write and the LSASS handle open establishes the access-to-dump timing of the chain.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - lsass
          - .dmp
          - .mdmp
          - SQLDmpr
          - nanodump
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What child processes did this command spawn afterward?
  context: The processes spawned after the dump reveal its actual impact. A dump followed by compression (a .zip or .rar of
    the output), an upload utility, or a parser like mimikatz/pypykatz indicates the credentials are being staged or extracted,
    not just captured. Predictable, no-child behavior is more consistent with a benign or isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this LSASS-dump pattern, what parents and users drove it, and does the current
    alert fit?
  context: Even legitimate tooling can match these keywords. The query mirrors the rule's selection scoped to this host, so
    the resulting parent/user distribution reflects how this specific dump pattern (not generic process activity) has run
    here before. A new parent process, an unexpected user account, or a command structure with no precedent on this host is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on multiple endpoints. If the
    same user triggered dump activity or other hands-on-keyboard actions on several hosts in the same window, the scope of
    compromise is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led
    to the dump command, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or staging that brackets the credential-access event.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of an LSASS dump depends on which accounts had sessions on this host when memory was captured. Every
    account logged on — interactive, service, or cached — may have credentials in the dump. Domain admin or service accounts
    with broad access require incident escalation; a standalone standard user may only need monitoring. Cross-reference the
    logged-on accounts with directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Have other hosts fired this LSASS-dump pattern in the past week, and does the distribution look like automation
    or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific
    dump pattern (not generic process activity). Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains:
        - lsass.dmp
        - lsass.zip
        - lsass.rar
        - Andrew.dmp
        - Coredump.dmp
        - NotLSASS.zip
        - lsass_2
        - lsassdump
        - lsassdmp
      - CommandLine|contains|all:
        - lsass
        - .dmp
      - CommandLine|contains|all:
        - SQLDmpr
        - .mdmp
      - CommandLine|contains|all:
        - nanodump
        - .dmp
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    privilege escalation — may reveal the stages that preceded the dump and help reconstruct the timeline. Credential access
    sitting at the end of a chain of prior alerts is a stronger signal than an isolated keyword match.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
