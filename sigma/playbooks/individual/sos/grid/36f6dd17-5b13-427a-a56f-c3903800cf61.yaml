name: Security Onion - Repeated Grid Node Login Failures (SSH)
id: a31b04de-4499-4736-bed6-b42bb6a7f667
description: |
  Fires when one source address fails many SSH logins to Security Onion grid nodes within
  ten minutes. An administrator mistyping a password produces one or two failures; dozens
  point to automated guessing against the monitoring infrastructure. Establish which accounts
  and nodes were tried, whether the source then logged in, whether it is a known
  administration host, and whether it is also probing other hosts.
type: detection
detection_id: 36f6dd17-5b13-427a-a56f-c3903800cf61
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-09-30
questions:
- question: Which source failed, how many times, and against which nodes and accounts?
  context: >-
    The source address, the grid nodes it tried and the accounts it used. Many different or
    non-existent accounts point to guessing; one real administrator account failing a few
    dozen times points to automation with a stale password.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event.reason
      - event_data.source.ip
      - event_data.event_count
      - event_data.host.name
      - event_data.user.name
      - event_data.window_start
      - event_data.@timestamp
- question: Which accounts did the source try?
  context: >-
    The failures from this source in the alert's window, by account and node. Common
    guessing lists (root, admin, test, oracle) or names that do not exist on the grid mean the
    source does not know valid accounts; a real administrator account is the one at risk.
  range: -12m
  query: |
    aggregation: true
    logsource:
      product: linux
      service: auth
    detection:
      selection:
        event.action: ssh_login
        event.outcome: failure
        tags|contains: so-grid-node
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - User
      - host.name
- question: Did the source log in successfully to any grid node?
  context: >-
    The deciding question. A success from the same source around the failures means a
    guessed or stale credential worked, or that an administrator got in after mistyping; which
    account succeeded, and whether it is one that failed, tells them apart.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: linux
      service: auth
    detection:
      selection:
        event.action: ssh_login
        event.outcome: success
        tags|contains: so-grid-node
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - User
      - host.name
- question: Is this source normally used to administer the grid?
  context: >-
    Successful SSH logins from this source over the past month. A known administration
    workstation or jump host with regular logins makes automation or a stale password likely;
    a source that has never logged in has no legitimate history with the grid.
  range: -30d
  query: |
    aggregation: true
    logsource:
      product: linux
      service: auth
    detection:
      selection:
        event.action: ssh_login
        event.outcome: success
        tags|contains: so-grid-node
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - User
- question: Is the source probing SSH on other hosts too?
  context: >-
    Connections from this source to port 22 on other hosts, seen by network monitoring. Many
    destinations mean the grid is one target of a wider SSH sweep rather than the only one.
  range: -1h
  query: |
    aggregation: true
    logsource:
      category: network
      service: connection
    detection:
      selection:
        src_ip|expand: '%src_ip%'
        dst_port: 22
      condition: selection
    fields:
      - dst_ip
- question: Are other sources failing SSH logins to the grid?
  context: >-
    Failures from several sources in the same hour suggest a distributed attempt against the
    grid. Only the five sources with the most failures are listed.
  range: -1h
  query: |
    aggregation: true
    logsource:
      product: linux
      service: auth
    detection:
      selection:
        event.action: ssh_login
        event.outcome: failure
        tags|contains: so-grid-node
      condition: selection
    fields:
      - src_ip
