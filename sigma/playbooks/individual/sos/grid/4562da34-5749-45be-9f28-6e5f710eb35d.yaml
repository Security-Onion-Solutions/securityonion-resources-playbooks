name: Security Onion - SOC Login Failures Across Many Accounts
id: ebfd22d4-f752-47eb-ab80-eedcca0c75c2
description: |
  Fires when failed Security Onion Console logins for several different accounts come from
  one client address within ten minutes. Password spraying tries a few common passwords
  against many accounts, so no single account stands out. Establish which accounts were
  tried and with what client, whether any of them then logged in from that address, whether
  the accounts are real, and whether the address is one analysts normally use.
type: detection
detection_id: 4562da34-5749-45be-9f28-6e5f710eb35d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-09-30
questions:
- question: Which address tried which accounts, and over what window?
  context: >-
    The client address and the accounts that failed from it. A list of generic or guessed
    names (admin, test, first.last variants) points to spraying; two or three spellings of
    one person's name point to that person trying their own usernames.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event.reason
      - event_data.http.request.headers.x-real-ip
      - event_data.value_count
      - event_data.user.name
      - event_data.window_start
      - event_data.@timestamp
- question: What client made the attempts?
  context: >-
    The failures from this address in the alert's window, by account and user agent. A
    scripting client (python-requests, curl, Go-http-client) points to an automated spray;
    a single browser points to a person at that address.
  range: -12m
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg: 'Encountered self-service login error.'
        http.request.headers.x-real-ip|expand: '%http.request.headers.x-real-ip%'
      condition: selection
    fields:
      - User
      - c-useragent
- question: Did any account log in successfully from this address?
  context: >-
    The deciding question. A success for one of the tried accounts means a sprayed password
    worked and warrants escalation, unless it is the same person who produced the failures
    and then remembered the right username.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg|contains: 'authenticated successfully'
        http.request.headers.x-real-ip|expand: '%http.request.headers.x-real-ip%'
      condition: selection
    fields:
      - User
      - c-useragent
- question: Which of the tried accounts are real SOC accounts?
  context: >-
    Successful logins for the tried accounts over the past month. Real accounts among the
    targets are at risk; names that never logged in may not exist, which means the source is
    guessing usernames as well as passwords.
  range: -30d
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg|contains: 'authenticated successfully'
        User|expand: '%User%'
      condition: selection
    fields:
      - User
      - http.request.headers.x-real-ip
- question: Do analysts normally log in from this address?
  context: >-
    Successful logins from this address over the past month. Regular logins by several
    analysts suggest a shared workstation, proxy or NAT address, where unrelated typos can add
    up; an address with no successful logins has no legitimate history with this console.
  range: -30d
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg|contains: 'authenticated successfully'
        http.request.headers.x-real-ip|expand: '%http.request.headers.x-real-ip%'
      condition: selection
    fields:
      - User
- question: Are other addresses failing to log in at the same time?
  context: >-
    Failures from several addresses in the same hour suggest a distributed attempt against
    the console. Only the five addresses with the most failures are listed.
  range: -1h
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg: 'Encountered self-service login error.'
      condition: selection
    fields:
      - http.request.headers.x-real-ip
