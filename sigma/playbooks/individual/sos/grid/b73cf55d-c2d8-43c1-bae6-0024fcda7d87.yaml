name: Security Onion - Grid Node Login Failure (SSH)
id: b73cf55d-c2d8-43c1-bae6-0024fcda7d87
description: |
  Fires when an SSH authentication attempt to a Security Onion grid node fails.
  Grid nodes are part of the monitoring infrastructure itself, so failed logins
  are most often an administrator mistyping a password or a misconfigured
  automation, but they can also indicate password-guessing or an attempt to
  reach the infrastructure from an unexpected source. Establish which account
  failed, where the attempt came from, whether that source and account are
  expected, whether the same activity spans multiple nodes, and whether the
  account ultimately authenticated successfully.
type: detection
detection_id: 923421c7-9b1e-45d4-80cc-e21d060c8723
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2025-03-24
questions:
- question: Which user account failed to authenticate?
  context: >-
    This is the account that attempted and failed to authenticate over SSH to the grid node.
    Determine whether it is a known administrator account that has legitimate access to the
    infrastructure or an unexpected or non-existent account, which would point to guessing.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.user.name
- question: What source IP did the failed login come from?
  context: >-
    The source address shows where the attempt originated. A failure from an administrator
    workstation or jump host is routine; one from an unexpected internal host or an external
    address against infrastructure is not and should be treated as a higher priority.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.source.ip
- question: What source IPs do login attempts for this account normally come from?
  context: >-
    Comparing the current source against where this account usually authenticates from
    distinguishes a routine failure (an admin at a known host) from an attempt originating
    somewhere this account has never been used.
  range: -30d
  query: |
    aggregation: true
    logsource:
      product: linux
      service: auth
    detection:
      selection:
        event.action: ssh_login
        tags|contains: so-grid-node
        User|expand: '%User%'
      condition: selection
    fields:
      - source.ip
      - event.outcome
- question: Are there other failed SSH logins across any grid nodes?
  context: >-
    Failed logins spread across several grid nodes, or repeated against one, indicate
    systematic guessing rather than a single fat-fingered password. Excluding this account
    surfaces whether other accounts are being targeted in the same window.
  range: -30d
  query: |
    aggregation: true
    logsource:
      product: linux
      service: auth
    detection:
      selection:
        event.action: ssh_login
        event.outcome: failure
        tags|contains: so-grid-node
      filter:
        User|expand: '%User%'
      condition: selection and not filter
    fields:
      - source.ip
      - User
      - host.name
- question: Did this account ultimately authenticate successfully to any grid node?
  context: >-
    A failure followed by a success for the same account is the deciding outcome: it
    separates a mistyped password that was then corrected from a guessing attempt that
    eventually worked. A success from an unexpected source after repeated failures is the
    clearest reason to escalate.
  range: -30d
  query: |
    aggregation: true
    logsource:
      product: linux
      service: auth
    detection:
      selection:
        event.action: ssh_login
        event.outcome: success
        tags|contains: so-grid-node
        User|expand: '%User%'
      condition: selection
    fields:
      - source.ip
      - host.name
