name: Security Onion - Repeated SOC Login Failures For One Account
id: daf309ba-8d6c-48d5-ac1b-9dfe4ae3e4e1
description: |
  Fires when one account reaches the rule's threshold of failed Security Onion Console
  logins within ten minutes. A mistyped password once or twice is routine; a run of
  failures points to password guessing against that account. Establish where the
  failures came from and with what client, whether the account then logged in, whether
  it is a real account, and whether the same source tried or reached other accounts.
type: detection
detection_id: c448c9f6-2979-4ceb-8d26-ab2aaedd92b0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-09-30
questions:
- question: Which account failed, how many times, and over what window?
  context: >-
    The correlation counted these failures for one account. The window runs from the first
    to the last failure: many failures seconds apart suggest a script, a few spread over
    minutes suggest a person, possibly the account owner. Several source addresses for one
    account point to a distributed attempt or a user moving between networks.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event.reason
      - event_data.user.name
      - event_data.event_count
      - event_data.window_start
      - event_data.@timestamp
      - event_data.http.request.headers.x-real-ip
- question: Where did the failures come from, and with what client?
  context: >-
    The failures in the alert's window, by source address and user agent. A scripting
    client (python-requests, curl, Go-http-client, Hydra) points to an automated attempt; a
    browser from an address the account normally uses points to the owner.
  range: -12m
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg: 'Encountered self-service login error.'
        User|expand: '%User%'
      condition: selection
    fields:
      - http.request.headers.x-real-ip
      - c-useragent
- question: Did the account log in successfully afterwards?
  context: >-
    The deciding question. A success soon after the failures, from the same address and
    browser, is usually a corrected typo. A success from a different address or client,
    or after a long run of failures, means a guess may have worked and warrants escalation.
  range: 1h
  query: |
    aggregation: false
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg|contains: 'authenticated successfully'
        User|expand: '%User%'
      condition: selection
    fields:
      - User
      - http.request.headers.x-real-ip
      - c-useragent
- question: Is this a real SOC account, and where does it normally log in from?
  context: >-
    Successful logins for the account over the past month, by source address. None means
    the name may not exist, so the source is guessing usernames as well as passwords, or
    the account is dormant, which makes it an attractive target. Compare the usual
    addresses with the source of the failures.
  range: -30d
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg|contains: 'authenticated successfully'
        User|expand: '%User%'
      condition: selection
    fields:
      - http.request.headers.x-real-ip
- question: Did the same source try other accounts?
  context: >-
    Failures for several accounts from one address is password spraying rather than one
    user struggling with a password. Only the five accounts with the most failures are
    listed. The rule counts names exactly as typed, so the same name in different letter
    case appears here as separate accounts.
  range: -1h
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg: 'Encountered self-service login error.'
        http.request.headers.x-real-ip|expand: '%http.request.headers.x-real-ip%'
      condition: selection
    fields:
      - User
- question: Did the same source log in successfully as any account?
  context: >-
    A success for a different account from the source of the failures suggests a guessed
    or stuffed credential worked elsewhere. A success for the same account is covered
    above. A shared address (NAT, proxy, jump host) can make unrelated users appear here.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg|contains: 'authenticated successfully'
        http.request.headers.x-real-ip|expand: '%http.request.headers.x-real-ip%'
      condition: selection
    fields:
      - User
- question: Is this many failures normal for this account?
  context: >-
    Regular bursts over the past week may be an automated client with a stale password.
    A first occurrence, or failures from an address the account has not used before,
    deserves more attention.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: kratos
      service: audit
    detection:
      selection:
        msg: 'Encountered self-service login error.'
        User|expand: '%User%'
      condition: selection
    fields:
      - http.request.headers.x-real-ip
