name: Security Onion IDH - SSH Login Attempt
id: 2a1ceb0f-baae-41ba-bc3d-4cb0c516c4f3
description: |
  Fires when a client attempts to authenticate to the decoy (honeypot) SSH service. The
  decoy is deployed inside the network to imitate an internal SSH server and has no
  production function, so no user or system has a legitimate reason to connect to it. Any
  interaction is therefore high-signal and most often points to an intruder or a compromised
  internal host performing reconnaissance or lateral movement; the common benign cause is an
  approved internal scanner — a vulnerability or asset-inventory system — sweeping internal
  ranges and incidentally reaching the decoy. Determine what host the connection came from,
  whether it is a known managed asset, what credentials and client were used, and whether
  the same source also touched real internal systems.
type: detection
detection_id: 6b033764-7a14-4c7c-9109-300392a051ce
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2025-06-26
questions:
- question: 'What source IP connected to the decoy SSH service?'
  context: >-
    The source address is the primary pivot for the rest of the investigation. Because the
    decoy is internal, the source is normally another host inside the network. Determine
    whether it maps to a known managed asset and whether that asset has any business reason
    to be reaching internal SSH services.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.source.ip
      - event_data.host.name
- question: 'Is the source host an approved internal scanner, or an unexpected system?'
  context: >-
    The most common benign cause is an authorized vulnerability or asset-inventory scanner
    sweeping internal ranges and incidentally reaching the decoy. Confirm the source against
    asset inventory and the list of sanctioned scanners. A source that is not an approved
    scanner — a workstation, server, or unmanaged device — has no reason to touch the decoy
    and points to a compromised host or an intruder. Answer from asset inventory and
    organizational records.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.source.ip
      - event_data.host.name
- question: 'Is the username generic or specific to your organization?'
  context: >-
    A generic or default account name (root, admin, test) fits opportunistic guessing, while
    a real account name specific to your organization suggests the source has prior
    knowledge of internal naming and raises the likelihood of a targeted internal actor.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.user.name
- question: 'What password was submitted, and is it generic or organization-specific?'
  context: >-
    A common or default password points to broad automated guessing; a password that matches
    one in use in your environment indicates the source is testing known or leaked internal
    credentials rather than guessing blindly.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.idh.password_submitted
- question: 'What SSH client version did the source present?'
  context: >-
    The advertised client version identifies the connecting software and can distinguish a
    stock client from a known scanning or brute-force tool. A repeated, unusual client
    string is a useful fingerprint for grouping related attempts from the same source.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.logdata.REMOTEVERSION
- question: 'Has this source IP interacted with other decoy services recently?'
  context: >-
    A single interaction is one data point; the same source touching several decoy services
    over a short window indicates deliberate enumeration of internal services rather than a
    stray connection, consistent with an actor mapping the environment. Review which
    services it reached and how often.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: alert
    detection:
      selection:
        event_data.source.ip|expand: '%event_data_source_ip%'
        event_data.tags: 'idh'
      condition: selection
    fields:
      - rule.name
      - event_data.host.name
- question: 'Did this source IP also generate activity against non-decoy assets?'
  context: >-
    The decoy holds no production data, so the deciding question is whether the same
    internal source touched real systems. Pivoting on the source address while excluding
    decoy interactions reveals contact with production assets, which would indicate the
    source is moving laterally through the environment rather than only brushing the decoy.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: alert
    detection:
      selection:
        related.ip|expand: '%event_data_source_ip%'
      filter:
        event_data.tags: 'idh'
      condition: selection and not filter
    fields:
      - rule.name
      - event_data.host.name
