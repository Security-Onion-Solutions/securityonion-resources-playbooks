name: Security Onion IDH - VNC Login
id: 3f5d899a-e0c6-46ed-96b5-51f8cdd36577
description: |
  Fires when a client attempts to authenticate to the decoy (honeypot) VNC service. The
  decoy is deployed inside the network to imitate an internal VNC remote-desktop endpoint
  and has no production function, so no user or system has a legitimate reason to connect to
  it. Any interaction is therefore high-signal and most often points to an intruder or a
  compromised internal host performing reconnaissance or lateral movement; the common benign
  cause is an approved internal scanner — a vulnerability or asset-inventory system —
  sweeping internal ranges and incidentally reaching the decoy. Determine what host the
  connection came from, whether it is a known managed asset, what authentication was
  attempted, and whether the same source also touched real internal systems.
type: detection
detection_id: 5d52bf82-19f8-4f18-9bc6-e1d6bdc1872f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2025-07-01
questions:
- question: 'What source IP connected to the decoy VNC service?'
  context: >-
    The source address is the primary pivot for the rest of the investigation. Because the
    decoy is internal, the source is normally another host inside the network. Determine
    whether it maps to a known managed asset and whether that asset has any business reason
    to be reaching internal VNC services.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.source.ip
      - event_data.host.name
- question: 'Is the source host an approved internal scanner, or an unexpected system?'
  context: >-
    The most common benign cause is an authorized vulnerability or asset-inventory scanner
    sweeping internal ranges and incidentally reaching the decoy. Confirm the source against
    asset inventory and the list of sanctioned scanners. A source that is not an approved
    scanner — a workstation, server, or unmanaged device — has no reason to touch the decoy
    and points to a compromised host or an intruder. Answer from asset inventory and
    organizational records.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.source.ip
      - event_data.host.name
- question: 'What VNC password was used in the authentication attempt?'
  context: >-
    The password indicates whether default credentials or specific passwords are being
    tested against the decoy VNC service.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.logdata.VNC_Password
- question: 'What were the VNC authentication challenge and response details?'
  context: >-
    The server challenge and client response provide technical detail about the
    authentication attempt and the method used, useful for fingerprinting the client and
    grouping related attempts.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.logdata.VNC_Server_Challenge
      - event_data.logdata.VNC_Client_Response
- question: 'Has this source IP interacted with other decoy services recently?'
  context: >-
    A single interaction is one data point; the same source touching several decoy services
    over a short window indicates deliberate enumeration of internal services rather than a
    stray connection, consistent with an actor mapping the environment. Review which
    services it reached and how often.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: alert
    detection:
      selection:
        event_data.source.ip|expand: '%event_data_source_ip%'
        event_data.tags: 'idh'
      condition: selection
    fields:
      - rule.name
      - event_data.host.name
- question: 'Did this source IP also generate activity against non-decoy assets?'
  context: >-
    The decoy holds no production data, so the deciding question is whether the same
    internal source touched real systems. Pivoting on the source address while excluding
    decoy interactions reveals contact with production assets, which would indicate the
    source is moving laterally through the environment rather than only brushing the decoy.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: alert
    detection:
      selection:
        related.ip|expand: '%event_data_source_ip%'
      filter:
        event_data.tags: 'idh'
      condition: selection and not filter
    fields:
      - rule.name
      - event_data.host.name
