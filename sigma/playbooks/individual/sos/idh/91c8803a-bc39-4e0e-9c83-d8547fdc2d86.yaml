name: Security Onion IDH - HTTP Access
id: 91c8803a-bc39-4e0e-9c83-d8547fdc2d86
description: |
  Fires when a client sends an HTTP request to the decoy (honeypot) HTTP service. The decoy
  is deployed inside the network to imitate an internal web service and has no production
  function, so no user or system has a legitimate reason to connect to it. Any interaction
  is therefore high-signal and most often points to an intruder or a compromised internal
  host performing reconnaissance or lateral movement; the common benign cause is an approved
  internal scanner — a vulnerability or asset-inventory system — sweeping internal ranges
  and incidentally reaching the decoy. Determine what host the connection came from, whether
  it is a known managed asset, what paths and tooling were used, and whether the same source
  also touched real internal systems.
type: detection
detection_id: a02961c9-4e4b-4421-a04d-2ad753d6b06a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2025-07-01
questions:
- question: 'What source IP connected to the decoy HTTP service?'
  context: >-
    The source address is the primary pivot for the rest of the investigation. Because the
    decoy is internal, the source is normally another host inside the network. Determine
    whether it maps to a known managed asset and whether that asset has any business reason
    to be reaching internal HTTP services.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.source.ip
      - event_data.host.name
- question: 'Is the source host an approved internal scanner, or an unexpected system?'
  context: >-
    The most common benign cause is an authorized vulnerability or asset-inventory scanner
    sweeping internal ranges and incidentally reaching the decoy. Confirm the source against
    asset inventory and the list of sanctioned scanners. A source that is not an approved
    scanner — a workstation, server, or unmanaged device — has no reason to touch the decoy
    and points to a compromised host or an intruder. Answer from asset inventory and
    organizational records.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.source.ip
      - event_data.host.name
- question: 'What paths were requested on the decoy?'
  context: >-
    The requested paths reveal what the source is looking for — admin panels, configuration
    files, or known-vulnerable endpoints — and whether the requests look hand-crafted or
    like an automated scan.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.logdata.PATH
- question: 'What user agent was used?'
  context: >-
    The user agent helps identify the scanning tool or browser and can fingerprint the
    source, distinguishing a known scanner from a manual request.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.logdata.USERAGENT
- question: 'Has this source IP interacted with other decoy services recently?'
  context: >-
    A single interaction is one data point; the same source touching several decoy services
    over a short window indicates deliberate enumeration of internal services rather than a
    stray connection, consistent with an actor mapping the environment. Review which
    services it reached and how often.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: alert
    detection:
      selection:
        event_data.source.ip|expand: '%event_data_source_ip%'
        event_data.tags: 'idh'
      condition: selection
    fields:
      - rule.name
      - event_data.host.name
- question: 'Did this source IP also generate activity against non-decoy assets?'
  context: >-
    The decoy holds no production data, so the deciding question is whether the same
    internal source touched real systems. Pivoting on the source address while excluding
    decoy interactions reveals contact with production assets, which would indicate the
    source is moving laterally through the environment rather than only brushing the decoy.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: alert
    detection:
      selection:
        related.ip|expand: '%event_data_source_ip%'
      filter:
        event_data.tags: 'idh'
      condition: selection and not filter
    fields:
      - rule.name
      - event_data.host.name
