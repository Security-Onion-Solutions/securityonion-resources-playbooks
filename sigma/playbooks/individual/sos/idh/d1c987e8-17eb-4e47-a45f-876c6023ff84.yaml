name: Security Onion IDH - SMB Request
id: d1c987e8-17eb-4e47-a45f-876c6023ff84
description: |
  Fires when a client connects to the decoy (honeypot) SMB service. The decoy is deployed
  inside the network to imitate an internal SMB file share and has no production function,
  so no user or system has a legitimate reason to connect to it. Any interaction is
  therefore high-signal and most often points to an intruder or a compromised internal host
  performing reconnaissance or lateral movement; the common benign cause is an approved
  internal scanner — a vulnerability or asset-inventory system — sweeping internal ranges
  and incidentally reaching the decoy. Determine what host the connection came from, whether
  it is a known managed asset, what credentials and resources were accessed, and whether the
  same source also touched real internal systems.
type: detection
detection_id: 789d4e19-6d07-4be9-9587-0e5a6b460f6d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2025-07-01
questions:
- question: 'What source IP connected to the decoy SMB service?'
  context: >-
    The source address is the primary pivot for the rest of the investigation. Because the
    decoy is internal, the source is normally another host inside the network. Determine
    whether it maps to a known managed asset and whether that asset has any business reason
    to be reaching internal SMB services.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.source.ip
      - event_data.host.name
- question: 'Is the source host an approved internal scanner, or an unexpected system?'
  context: >-
    The most common benign cause is an authorized vulnerability or asset-inventory scanner
    sweeping internal ranges and incidentally reaching the decoy. Confirm the source against
    asset inventory and the list of sanctioned scanners. A source that is not an approved
    scanner — a workstation, server, or unmanaged device — has no reason to touch the decoy
    and points to a compromised host or an intruder. Answer from asset inventory and
    organizational records.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.source.ip
      - event_data.host.name
- question: 'What user credentials were used in the SMB request?'
  context: >-
    The account attempted distinguishes a targeted attempt using known internal accounts
    from generic scanning, and indicates whether the source is testing credentials it has
    already obtained.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.logdata.USER
- question: 'What SMB shares and files were accessed?'
  context: >-
    The shares and files touched, and the action taken, reveal intent — for example
    enumerating shares versus reading or writing specific files.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event_data.logdata.SHARENAME
      - event_data.logdata.FILENAME
      - event_data.logdata.AUDITACTION
- question: 'Has this source IP interacted with other decoy services recently?'
  context: >-
    A single interaction is one data point; the same source touching several decoy services
    over a short window indicates deliberate enumeration of internal services rather than a
    stray connection, consistent with an actor mapping the environment. Review which
    services it reached and how often.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: alert
    detection:
      selection:
        event_data.source.ip|expand: '%event_data_source_ip%'
        event_data.tags: 'idh'
      condition: selection
    fields:
      - rule.name
      - event_data.host.name
- question: 'Did this source IP also generate activity against non-decoy assets?'
  context: >-
    The decoy holds no production data, so the deciding question is whether the same
    internal source touched real systems. Pivoting on the source address while excluding
    decoy interactions reveals contact with production assets, which would indicate the
    source is moving laterally through the environment rather than only brushing the decoy.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: alert
    detection:
      selection:
        related.ip|expand: '%event_data_source_ip%'
      filter:
        event_data.tags: 'idh'
      condition: selection and not filter
    fields:
      - rule.name
      - event_data.host.name
