name: Many Distinct TXT Lookups Under One Domain From One Host
id: dbb67b63-cd9f-48a9-9fe1-9b643c0870da
description: |
  Fires when one client makes many different TXT or NULL lookups under one registered domain
  within ten minutes. DNS tunnels carry data in unique subdomain labels and read replies from
  TXT records; ordinary clients ask for a few fixed TXT records. Establish what the names look
  like, whether the replies carried data, which resolver was used, how widely the domain is
  queried, and whether the client shows other signs of compromise.
type: detection
detection_id: 0c5c5ca1-ee06-4df5-a523-bc11fe918ef9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-09-30
questions:
- question: Which client queried which domain, how many names, and over what window?
  context: >-
    The client, the registered domain and the number of distinct names looked up. Dozens of
    names in a few minutes from one workstation point to a tool, not a person; a mail or
    security server doing this may be checking records it is built to check.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event.reason
      - event_data.source.ip
      - event_data.dns.highest_registered_domain
      - event_data.value_count
      - event_data.destination.ip
      - event_data.window_start
      - event_data.@timestamp
- question: What do the query names look like?
  context: >-
    Random-looking labels (long hex or base32 strings, a counter or session ID) are the mark of
    a tunnel encoding data; readable names such as selector or service labels point to
    legitimate lookups. Only the five most frequent names are listed.
  range: -12m
  query: |
    aggregation: true
    logsource:
      category: network
      service: dns
    detection:
      selection:
        src_ip|expand: '%src_ip%'
        dns.highest_registered_domain|expand: '%dns.highest_registered_domain%'
      condition: selection
    fields:
      - query
      - dns.query.type_name
- question: Did the lookups get answers?
  context: >-
    Successful (NOERROR) TXT replies mean data came back to the client, as in command and
    control. Mostly NXDOMAIN or refused replies mean the names carried data out and the answers
    did not matter, as in one-way exfiltration.
  range: -12m
  query: |
    aggregation: true
    logsource:
      category: network
      service: dns
    detection:
      selection:
        src_ip|expand: '%src_ip%'
        dns.highest_registered_domain|expand: '%dns.highest_registered_domain%'
      condition: selection
    fields:
      - dns.response.code_name
- question: Which resolvers does the client use?
  context: >-
    A client that normally uses the internal resolvers but sent these lookups straight to an
    external server is avoiding DNS logging and filtering, which is itself a reason to escalate.
  range: -1h
  query: |
    aggregation: true
    logsource:
      category: network
      service: dns
    detection:
      selection:
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - dst_ip
- question: How widely is this domain queried on the network?
  context: >-
    A domain queried by many hosts every day is likely a service the organization uses; one
    queried only by this client, and first seen recently, is far more suspicious.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network
      service: dns
    detection:
      selection:
        dns.highest_registered_domain|expand: '%dns.highest_registered_domain%'
      condition: selection
    fields:
      - src_ip
- question: Are there other alerts for this client?
  context: >-
    Other detections for the same address, such as malware downloads, beaconing or long DNS
    labels, support a compromise; none suggests checking the domain's purpose with the host owner.
  range: +/-1d
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        related_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - rule.name
