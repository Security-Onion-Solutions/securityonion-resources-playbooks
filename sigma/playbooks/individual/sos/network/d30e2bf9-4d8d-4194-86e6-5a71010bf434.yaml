name: SSH Authentication Failing Against Many Servers From One Host
id: adeef238-3e2c-4550-96aa-28ef4a54a372
description: |
  Fires when one source fails SSH authentication against many different servers within ten
  minutes, as inferred by Zeek. Password spraying and SSH-spreading malware try each server once
  or twice; a person mistyping a password fails against one. Establish which servers were tried,
  whether the source got in anywhere, what SSH client it used, whether this is new for the
  source, and whether it has other alerts.
type: detection
detection_id: d30e2bf9-4d8d-4194-86e6-5a71010bf434
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-09-30
questions:
- question: Which source failed against how many servers, and with what client?
  context: >-
    The source, the servers it failed against and its SSH client string. An internal
    workstation failing against many servers is a stronger signal than a known automation
    server; a library client (libssh, Go, paramiko) on a workstation points to a tool.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event.reason
      - event_data.source.ip
      - event_data.value_count
      - event_data.destination.ip
      - event_data.ssh.client
      - event_data.window_start
      - event_data.@timestamp
- question: Which servers were tried, and how many times each?
  context: >-
    One or two attempts against each of many servers is spraying or worm spread; many attempts
    against a few servers is brute force. Sequential addresses suggest a blind sweep. Only the
    five servers with the most failures are listed.
  range: -12m
  query: |
    aggregation: true
    logsource:
      category: network
    detection:
      selection:
        event.dataset: zeek.ssh
        ssh.authentication.success: false
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - dst_ip
      - dst_port
- question: Did the source authenticate successfully to any server?
  context: >-
    The deciding question. A success after a run of failures means a guessed or stolen
    credential worked on that server, which should be investigated as a likely compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network
    detection:
      selection:
        event.dataset: zeek.ssh
        ssh.authentication.success: true
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - dst_ip
- question: What SSH clients does the source use?
  context: >-
    A single client string across all attempts fits one tool. A workstation that normally uses
    OpenSSH suddenly using a scripting library client is a strong sign of malware.
  range: -1h
  query: |
    aggregation: true
    logsource:
      category: network
    detection:
      selection:
        event.dataset: zeek.ssh
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - ssh.client
- question: Does this source normally use SSH, and to which servers?
  context: >-
    SSH sessions from this source over the past week, by server. A host that never used SSH
    before, or only to one or two servers, has no routine reason for this activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network
    detection:
      selection:
        event.dataset: zeek.ssh
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - dst_ip
- question: Are there other alerts for this source?
  context: >-
    Alerts such as a malware download, a miner or a scanner on the same address support a
    compromised host spreading itself.
  range: +/-1d
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        related_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - rule.name
