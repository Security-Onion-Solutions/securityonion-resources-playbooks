name: One Source Logging In Over SSH To Many Internal Hosts
id: 0fb8d424-54d1-4c40-a414-633bff62a099
description: |
  Fires when one source authenticates over SSH to many different internal hosts within an hour,
  as inferred by Zeek. Lateral movement with harvested keys or passwords looks like this; so do
  jump boxes, configuration management and CI systems. Establish which hosts were reached,
  whether this is routine for the source, whether it failed elsewhere first, what else it did,
  and whether the reached hosts moved on.
type: detection
detection_id: eefc6d24-0cdd-4b73-aab7-416f82e8251c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-09-30
questions:
- question: Which source reached which hosts, and with what client?
  context: >-
    The source, the internal hosts it logged in to and its SSH client string. A known jump box
    or automation server is usually expected; a workstation or server that does not administer
    others is not.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event.reason
      - event_data.source.ip
      - event_data.value_count
      - event_data.destination.ip
      - event_data.ssh.client
      - event_data.window_start
      - event_data.@timestamp
- question: Does this source log in to many hosts routinely?
  context: >-
    Successful SSH logins from this source over the past week. Regular logins to a similar set of
    hosts every day fit a jump box or automation; a first occurrence, or a new set of hosts,
    deserves investigation. Only the five hosts with the most logins are listed.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network
    detection:
      selection:
        event.dataset: zeek.ssh
        ssh.authentication.success: true
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - dst_ip
- question: Did the source fail against other hosts first?
  context: >-
    Failures alongside the successes mean the source was trying credentials, not using ones it
    was given, which points to spraying with a partly valid credential set.
  range: -1h
  query: |
    aggregation: true
    logsource:
      category: network
    detection:
      selection:
        event.dataset: zeek.ssh
        ssh.authentication.success: false
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - dst_ip
- question: What other services did the source connect to?
  context: >-
    Connections to other administrative or file-transfer ports (SMB, RDP, WinRM, databases) in the
    same hour widen the picture from SSH administration to broader lateral movement.
  range: -1h
  query: |
    aggregation: true
    logsource:
      category: network
      service: connection
    detection:
      selection:
        src_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - dst_port
- question: Did any of the reached hosts start SSH sessions of their own?
  context: >-
    Reached hosts opening SSH sessions to further hosts shortly afterwards show a chain of
    movement through the network, as a worm or an operator hopping onward would produce.
  range: 1h
  query: |
    aggregation: true
    logsource:
      category: network
    detection:
      selection:
        event.dataset: zeek.ssh
        src_ip|expand: '%dst_ip%'
      condition: selection
    fields:
      - src_ip
      - dst_ip
- question: Are there other alerts for this source?
  context: >-
    Other detections for the same address support a compromised host; none, together with a
    routine pattern above, points to expected administration.
  range: +/-1d
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        related_ip|expand: '%src_ip%'
      condition: selection
    fields:
      - rule.name
